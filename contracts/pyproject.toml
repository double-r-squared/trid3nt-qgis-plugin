[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trid3nt-contracts"
version = "0.1.0"
description = "Shared contracts: the WebSocket protocol, the persisted document schemas, the data-source and tool-registration declarations, and the result shapes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "schema specialist" }]
dependencies = [
    "pydantic>=2,<3",
    "python-ulid>=2,<4",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[project.scripts]
trid3nt-export-schemas = "trid3nt_contracts.export_schemas:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["trid3nt_contracts*"]

[tool.setuptools.package-data]
trid3nt_contracts = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
