[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trid3nt-server"
version = "0.1.0"
description = "Agent service: the pluggable-LLM agent loop, Appendix-A WebSocket server, file-backed persistence, local solver dispatch."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nate Almanza" }]

# Upper bounds are loose on purpose: the provider SDKs move faster than a pin
# can track. Verify an installed set with `pip show`.
dependencies = [
    # S3-compatible object I/O: the cached-fetch store, user-layer ingest and
    # the public-bucket fetchers all speak S3 (MinIO locally).
    "boto3>=1.40,<2",
    # Kept for its ``types`` package alone: the Content/FunctionDeclaration IR
    # every provider adapter converts from at its own boundary. Removing it
    # breaks every live provider path, whichever provider is selected.
    "google-genai>=2.8,<3",
    # py3dep wraps the USGS 3DEP DEM service (CONUS DEM at 10/30 m) and pulls
    # in rioxarray + rasterio for COG serialization. requests is the HTTP
    # client for Nominatim, Census ACS and Planetary Computer STAC search.
    "py3dep>=0.19,<0.20",
    "rioxarray>=0.18,<1",
    "requests>=2.32,<3",
    # pystac-client is the canonical STAC catalog reader. WorldPop is NOT read
    # through it: WorldPop serves a direct REST API and has no collection on
    # Planetary Computer to open.
    "pystac-client>=0.8,<1",
    # The < 2.0 cap holds until SfincsModel v2.0 leaves release-candidate
    # status; v2.0 breaks the component-based API. hydromt-sfincs 1.1.2 does
    # not exist on PyPI (the line jumps 1.1.0 -> 1.2.0), and the stable 1.2.x
    # line transitively constrains hydromt < 1 - so hydromt carries no pin of
    # its own here and resolves transitively.
    "hydromt-sfincs>=1.1.0,<2.0",
    # The pandas ceiling is upstream's, not ours: hydromt-sfincs 1.2.2 calls
    # pd.Index.is_integer() (removed in pandas 2.0) and pd.date_range(
    # freq="10T") (the "T" alias, removed in pandas 3.0). Both still work under
    # 2.2.x with FutureWarnings. 2.2 is also the earliest series with cp313
    # wheels - 2.1.x and older fail to compile against the CPython 3.13
    # _PyLong_AsByteArray change. The cap lifts when upstream fixes both calls.
    "pandas>=2.2,<2.3",
    # fsspec core only: the live object store is S3 through s3fs below, and the
    # ``fsspec.filesystem("gcs")`` calls in the staging branches are dead.
    "fsspec>=2024.6",
    # flopy is the MODFLOW 6 deck builder and UCN reader. 3.9 is the first
    # series carrying the MF6-GWT API used here; < 4 guards the next major.
    # Declared explicitly rather than left transitive: an undeclared dependency
    # is how a stale-venv resolution silently changes what runs.
    "flopy>=3.9,<4",
    # s3fs is the fsspec S3 backend for the NOAA Big Data Program anonymous
    # mirrors (HRRR-Zarr at s3://hrrrzarr/). It wraps boto3 + aiobotocore, but
    # is used only in sync calls via fsspec.filesystem('s3', anon=True).
    "s3fs>=2024.6",
    # zarr is the chunked-array backend for HRRR-Zarr and is pulled in by
    # xarray.open_zarr elsewhere. v3 reads v2 stores, which is what hrrrzarr
    # publishes.
    "zarr>=2.18,<4",
    # BeautifulSoup4 + lxml drive web_fetch's main_text/metadata extraction
    # (boilerplate strip, Open Graph tag parse). lxml is already present
    # transitively through the rasterio chain; it is pinned explicitly so a
    # dependency churn cannot silently drop the parser.
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.0,<7",
    "websockets>=13,<16",
    "pydantic>=2,<3",
    "python-ulid>=2,<4",
    # Pelicun (NHERI SimCenter) is the fragility-curve runtime. Only the
    # bundled HAZUS v6.1 flood loss-function library is wired
    # (resources/DamageAndLossModelLibrary/flood/...); the seismic library
    # ships with it but has no engine integration here. It pulls in
    # scikit-learn / scipy / pandas / colorama transitively, and its
    # pandas >= 2.2, < 3 range contains the 2.2.x pin above.
    "pelicun>=3.9,<4",
    # cdsapi wraps the queue/poll/stream lifecycle of a Copernicus CDS
    # retrieval; the returned NetCDF is converted to a CRS-tagged COG at the
    # call site. CDS is a key-required (Tier-2) source.
    "cdsapi>=0.7,<1",
    # pfdf is imported for its USGS data-source wrappers, NOT its assessment
    # engine: pfdf.data.usgs.statsgo materializes STATSGO COGs from
    # ScienceBase, and pfdf.data.usgs.tnm.dem reaches the non-default 3DEP
    # resolutions (1 arc-sec, 1/9 arc-sec, 1 m, 2 arc-sec, 5 m). pfdf 3.x
    # requires Python >= 3.11, which matches the floor above.
    "pfdf>=3.0.4",  # VENDORED wheel in wheels/: USGS GitLab 403s git clones, so installs use --find-links
    # pysheds==0.4 backs the D8 terrain-hydrology tools, and is deliberately
    # NOT a second top-level pin: pfdf 3.x hard-pins it, so a pin here could
    # only drift. It is numba-based, so the first tool CALL pays a ~2.2 s lazy
    # import rather than the daemon paying it at boot.
    # rank_bm25 backs the BM25 channel of the hybrid lexical+dense retrieval
    # over the tool corpus. Pure Python (numpy only). The dense backend
    # (sentence-transformers or a hosted embedder) is imported opportunistically
    # at runtime and is NOT a hard dependency, so the service still starts when
    # it is unavailable.
    "rank_bm25>=0.2,<1",
    # geopandas backs vector reading and spatial joins in the analytical Q&A
    # tools. It pulls in shapely + pyogrio; pyogrio is the default vector
    # driver from geopandas >= 1.0.
    "geopandas>=1.0,<2",
    # pyarrow is what makes GeoParquet 1.1 row-group bbox pushdown possible:
    # geopandas.read_parquet(bbox=...) prunes row groups only through the
    # pyarrow backend. The country files run 4-5 GB, so pruning rather than
    # whole-file download is the only viable read.
    "pyarrow>=16",
    # pyswmm is the headless SWMM5 runner and swmm-api the .inp deck author.
    # BOTH are lazy-imported inside the mesh builder - a top-level import would
    # force every agent process to load SWMM5 - so the service still starts
    # when they are absent. Two shape constraints the deck author encodes: a
    # flap gate is an Orifice(has_flap_gate=True) (a Conduit has no flap kwarg
    # in 0.4.73), and an Outfall takes exactly ONE inlet link.
    "pyswmm>=2.1,<3",
    "swmm-api>=0.4.73,<0.5",
    # pmtiles is the PMTiles v3 archive writer/reader behind
    # vector_tiles.build_pmtiles. The import surface it relies on
    # (pmtiles.tile.zxy_to_tileid + Compression + TileType, pmtiles.writer.
    # Writer, pmtiles.reader.Reader/MmapSource) is 3.x. The build path is
    # env-gated OFF unless TRID3NT_VECTOR_TILES_BASE_URL is set, so the
    # dependency only binds once an HTTP tile-serving face exists.
    # mapbox-vector-tile + mercantile arrive transitively.
    "pmtiles>=3,<4",
    # openai is the client for ANY OpenAI-compatible chat.completions endpoint
    # (Ollama, vLLM, llama.cpp, LM Studio, OpenAI, Groq, DeepSeek, OpenRouter)
    # and is the live default provider. AsyncOpenAI with streaming tool calls
    # needs >= 1.40.
    "openai>=1.40",
    # The official Anthropic SDK backs adapters/anthropic_adapter.py, selected
    # by MODEL_PROVIDER=anthropic and dormant otherwise. >= 1 is the line that
    # carries adaptive thinking, the prompt-cache usage fields, and
    # AsyncAnthropic messages.stream() with get_final_message().
    "anthropic>=1,<2",
    # duckdb runs the read-only SQL of the spatial_query tool over a case's
    # vector layers via its spatial extension (ST_Read). The spatial and
    # httpfs extensions download on first INSTALL and cache under
    # ~/.duckdb/extensions; a cold offline box degrades with a typed
    # EXTENSION_UNAVAILABLE error rather than a stack trace.
    "duckdb>=1",
    # spotpy.objectivefunctions is the pinned source of NSE/KGE/PBIAS/RSR/
    # RMSE/R2 - no bespoke reimplementation of a metric spotpy provides. Pure
    # numpy + scipy, so it installs cleanly on the offline box.
    "spotpy>=1.6,<2",
    # The official USGS `dataretrieval` client backs the router's
    # dataretrieval-delegating executor for the USGS water-data family (WQP
    # water quality, NLDI navigation), absorbing the NWIS -> Water Data OGC API
    # churn instead of hand-rolled RDB/GeoJSON parsers. Pinned EXACTLY: the
    # OGC-API surface and tabular schemas evolve, and a floating pin risks
    # silent column or endpoint drift.
    "dataretrieval==1.2.0",
    # The pins below are on libraries product code imports DIRECTLY and that
    # were previously supplied only transitively, so their versions were set by
    # whichever resolver run installed the geospatial stack. Each is pinned at
    # the version installed in venvs/agent.
    # httpx: the fetcher transport layer, 15 server importers.
    "httpx==0.28.1",
    # PyYAML: 7 server importers.
    "PyYAML==6.0.3",
    # tenacity: the retry-loop consolidation target.
    "tenacity==9.1.4",
    # aiohttp: the HTTP server replacement target.
    "aiohttp==3.14.1",
    # shapely: 41 direct importers - geometry predicates, bbox overlap tests,
    # mesh boundary work.
    "shapely==2.1.2",
    # pyproj: 34 direct importers - CRS axis units, geodesic area and distance.
    "pyproj==3.7.2",
    # scipy: 9 direct importers - interpolation, ndimage sampling, spatial trees.
    "scipy==1.15.3",
    # xarray: 6 direct importers - gridded fetch decode, the COG write path.
    "xarray==2026.4.0",
    # The libraries below own a protocol family, so a fetch spec names WHAT to
    # fetch and the library holds HOW.
    # odc-stac loads a STAC item set onto an odc-geo GeoBox; odc-geo is the
    # geometry/CRS math the two share. Its reader is rasterio's GDAL, NOT the
    # router transport, so every STAC read must run inside a rasterio.Env
    # carrying the GDAL_HTTP_* retry policy.
    "odc-stac==0.5.3",
    "odc-geo==0.5.3",
    # planetary-computer signs Planetary Computer blob hrefs per account and
    # container; it is the modifier passed to pystac_client.Client.open.
    "planetary-computer==1.0.0",
    # osmnx owns Overpass. Its Overpass endpoint is a single settings value, so
    # the mirror chain and the verbatim-error mapping wrap it rather than
    # replace it.
    "osmnx==2.1.1",
    # pygeohydro owns the STN high-water-mark query set and the NFHL flood-zone
    # service. Its HTTP layer has no retry and returns a JSON-bodied 4xx as
    # data, so every call goes through the shared HyRiver shim, which also pins
    # the library's response-cache expiry and location. pynhd is deliberately
    # absent: nothing imports it, NLDI navigation stays on dataretrieval, and
    # pygeohydro's own pynhd < 0.20 cap holds the line.
    "pygeohydro==0.19.4",
    # pynldas2 reads hourly NLDAS-2 CONUS forcing through the same HyRiver line
    # and the same shim.
    "pynldas2==0.19.3",
    # pyogrio is GDAL's vector I/O, imported directly for the ESRIJSON, OAPIF
    # and /vsizip//vsicurl/ read paths. It vendors its OWN GDAL, distinct from
    # rasterio's: GDAL_HTTP_* set through rasterio.Env does not reach it, so
    # vector reads configure it via pyogrio.set_gdal_config_options.
    "pyogrio>=0.13,<1",
    # Consumed verbatim from contracts/ in this repo (editable install).
    "trid3nt-contracts>=0.1,<0.2",
]

[project.optional-dependencies]
dev = ["pytest>=7", "grimp>=3", "vulture>=2.14"]
# local-engines: the pip-only solver runtimes, installed with
# `pip install -e ".[local-engines]"`. pyswmm + swmm-api are ALSO core deps
# (always on the box); the pins here are for the offline venv where the full
# agent is not installed.
local-engines = [
    "pyswmm>=2.1,<3",
    "swmm-api>=0.4,<1",
    "landlab>=2.6,<3",
    "openquake.engine>=3.19",
]

[project.scripts]
trid3nt-server = "trid3nt_server.main:run"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -p no:cacheprovider"
testpaths = ["tests", "contracts/tests", "plugin/tests"]
markers = [
    "qt_harness_shim: asserts only that a Qt subprocess harness exited 0 and printed its marker - a standing exception to 'a test tests a product behavior', listed in tests/README.md",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["trid3nt_server*"]

# Runtime data files shipped in the wheel. setuptools drops every non-.py file
# by default, so a non-editable `pip install` omits them silently while an
# editable install on the box keeps working - the failure only appears on the
# image. Any new file loaded via Path(__file__).parent belongs in this list.
[tool.setuptools.package-data]
trid3nt_server = [
    "workflows/sfincs/manning_mapping.csv",
    "tools/tool_query_corpus.yaml",
    "tools/duckdb_spatial_functions.json",
    "tools/README.md",
]
