# Template routing phrasings (door dissolution, ADR 0094): walked into the main
# retrieval index directly -- the engine templates are ordinary retrieval-pool tools.
telemac_river_dye:
- run a TELEMAC-2D shallow-water solve with an advected dye tracer over a real river reach
- a dye plume moving downstream through the river channel with the current, animated
- watch a dye plume travel downstream and dilute as it moves down the river
- an oil spill from a barge on the river, where does the oil slick go downstream
- sewage / E.coli effluent released into the river, decaying as it travels downstream
- a sediment / silt slurry spilled into the river, settling and depositing on the bed
- surface-water contaminant transport down the river channel from a point-source spill
- how does sustained wind set up a water-surface slope or drive circulation on a wide reach or lake
- wind-driven setup and circulation on a broad river reach, embayment or lake surface
- prescribed upstream sediment supply rate depositing downstream, reservoir-inflow sedimentation
- how a continuous incoming sediment load settles and deposits along the river bed downstream
- where does the river bed scour below a dam, weir or bridge contraction and where does it re-deposit
- erodible-bed morphodynamics under a flood hydrograph, bed scour and deposition pattern along a reach
- how much does the channel bed erode and lower during a high flow, and where does the eroded sand redeposit
- bedload transport and bed evolution in a river reach, Meyer-Peter-Mueller scour and deposition map
- mobile-bed scour depth below a hydraulic structure under a flood, sediment erosion and aggradation
- how does a mixture of several grain sizes sort and segregate downstream versus a single grain size
- multi-class graded sediment bedload, fine and coarse grains sorting as the bed evolves
- bed surface armoring where fines winnow out of the scour zone under a flood, grain-size sorting
- downstream fining of a poorly-sorted sand-gravel mixture, differential grain mobility
- graded sediment budget, how a well-graded or bimodal grain mixture segregates along a reach
