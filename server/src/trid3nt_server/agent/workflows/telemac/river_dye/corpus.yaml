telemac_river_dye:
- run a TELEMAC-2D shallow-water solve with an advected dye tracer over a real river reach
- a dye plume moving downstream through the river channel with the current, animated
- watch a dye plume travel downstream and dilute as it moves down the river
- an oil spill from a barge on the river, where does the oil slick go downstream
- sewage / E.coli effluent released into the river, decaying as it travels downstream
- a sediment / silt slurry spilled into the river, settling and depositing on the bed
- surface-water contaminant transport down the river channel from a point-source spill
- how does sustained wind set up a water-surface slope or drive circulation on a wide reach or lake
- wind-driven setup and circulation on a broad river reach, embayment or lake surface
- prescribed upstream sediment supply rate depositing downstream, reservoir-inflow sedimentation
- how a continuous incoming sediment load settles and deposits along the river bed downstream
