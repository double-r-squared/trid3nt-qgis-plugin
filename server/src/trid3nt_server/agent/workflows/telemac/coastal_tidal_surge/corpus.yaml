# Template routing phrasings (ADR 0259): the coastal tidal/surge inundation
# template is an ordinary retrieval-pool member (door dissolution, ADR 0094). Two
# question classes (observed storm surge vs astronomical prediction) share ONE
# tool, so the phrasings span the surge/tide framing and the CO-OPS gauge input.
coastal_tidal_surge:
- how far does the storm surge flood inland along this coast
- map the coastal inundation from this NOAA tide-gauge water-level record
- which low-lying land does the storm tide reach at Apalachicola Bay
- drive a coastal flood with an observed CO-OPS water-level series
- compare surge vs calm-tide flooded area over the same stretch of coast
- run a TELEMAC-2D coastal tidal inundation from a tide-gauge stage series
- how much more land floods under the hurricane surge than the astronomical tide
- peak inundation depth from a coastal storm-tide boundary forcing
- flood a shoreline domain with the observed gauge series through a liquid boundary
- coastal water-level series flooding the low coast with tidal-flat wetting and drying
