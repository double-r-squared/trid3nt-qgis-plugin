schema_version: v1
name: fetch_hrrr_smoke
source_class: hrrr_smoke
error_prefix: HRRR_SMOKE
shape: raster-cog
supports_global_query: false
endpoints:
  data:
    url: s3://hrrrzarr/
auth:
  mode: none
  user_agent: trid3nt/0.1 (Hazard Modeling Agent; agent@trid3nt.dev)
params:
  bbox:
    type: bbox
    required: true
    quantize: round_6dp
  variable:
    type: enum
    values:
    - near_surface_smoke
    - smoke_column_mass
    - aerosol_optical_depth
    default: near_surface_smoke
  forecast_hour:
    type: int
    default: 1
    min: 0
    schema_optional: true
  cycle:
    type: str
    schema_optional: true
    default: null
ingest:
  access: library_delegate
  delegate:
    library: hrrr_zarr
    timeout_s: 90.0
  hrrr:
    variables:
      near_surface_smoke:
        level: 8m_above_ground
        s3_var: MASSDEN
      smoke_column_mass:
        level: entire_atmosphere_single_layer
        s3_var: COLMD
      aerosol_optical_depth:
        level: entire_atmosphere_single_layer
        s3_var: AOTK
    fill_value: -9999.0
hooks:
  delegate: hrrr.read
  delegate_validate: hrrr.validate
  delegate_resolve: hrrr.resolve_cycle
normalize:
  crs: EPSG:4326
  units_by_param:
    param: variable
    map:
      near_surface_smoke: kg m-3
      smoke_column_mass: kg m-2
      aerosol_optical_depth: '1'
output:
  layer_type: raster
  ext: tif
  role: primary
  style_preset: hrrr_smoke_near_surface_smoke
  style_preset_by_param:
    param: variable
    map:
      near_surface_smoke: hrrr_smoke_near_surface_smoke
      smoke_column_mass: hrrr_smoke_smoke_column_mass
      aerosol_optical_depth: hrrr_smoke_aerosol_optical_depth
cache:
  ttl_class: dynamic-1h
payload_estimate:
  model: bbox_area
  mb_per_sq_deg: 0.0021114864864864866
  floor_mb: 0.05
  ceil_mb: 5.0
docstring: "NOAA HRRR-Smoke 3 km smoke / aerosol forecast -- Tier-1 CONUS fetcher.\n\nWhat it does: returns\
  \ a CRS-tagged GeoTIFF (EPSG:4326) of a single\nHRRR-Smoke forecast field at a single forecast lead\
  \ time, reprojected\nfrom the native Lambert Conformal Conic grid and clipped to the\nrequested CONUS\
  \ bbox. Wraps the University of Utah CHPC HRRR-Zarr S3\nmirror (anonymous, Tier-1 free, no API key)\
  \ that carries NCEP/EMC's\noperational HRRR-Smoke run -- smoke emissions sourced from NESDIS HMS\nsatellite\
  \ fire detections, plume-rise via Freitas et al. (2006),\nadvected on the 3 km HRRR dynamical core.\
  \ Resolves the most-recently\npublished HRRR cycle whose forecast at the requested lead time is on\n\
  S3, walking up to 6 h backward if the in-progress cycle has not yet\nposted (mirror lag ~1.0 - 1.5 h).\n\
  \nWhen to use:\n- User asks about \"wildfire smoke\" / \"smoke plume\" / \"air quality from\n  the fire\"\
  \ forecasts anywhere in CONUS (\"how bad will the smoke be in\n  Denver tomorrow?\", \"show the smoke\
  \ plume from the wildfire in\n  Oregon\", \"is California's smoke reaching Nevada by tonight?\").\n\
  - Driving an air-quality / public-health overlay or a fire-impact\n  composite layered with ``fetch_nifc_fire_perimeters``\
  \ (active\n  perimeters), ``fetch_firms_active_fire`` (satellite hot spots), or\n  ``fetch_mtbs_burn_severity``\
  \ (post-fire severity).\n- \"Forecast smoke + observed weather\" comparisons against\n  ``fetch_asos_metar``\
  \ (visibility, sky conditions) for plausibility.\n- Short-term (≤ 18 h on most cycles, ≤ 48 h on 00/06/12/18z\
  \ cycles)\n  US smoke-transport decision-support overlay.\n\nWhen NOT to use:\n- Standard weather forecasts\
  \ (temperature, wind, precip) -- use\n  ``fetch_hrrr_forecast``. HRRR-Smoke shares the same dynamical\
  \ core\n  but this tool exposes only smoke / aerosol diagnostics.\n- Observed surface particulate (PM2.5\
  \ / PM10 / AOD) -- HRRR-Smoke is\n  model output. There is no HRRR-Smoke \"observation\"; use EPA AirNow\n\
  \  (future tool) or NASA MODIS AOD (future) for measured aerosols.\n- Active fire detection -- use ``fetch_firms_active_fire``\
  \ (NASA VIIRS/\n  MODIS hot spots) or ``fetch_goes_satellite`` (GOES-East/West fire\n  products). HRRR-Smoke\
  \ ingests these as forcing; it does not produce\n  them.\n- Fire perimeters -- use ``fetch_nifc_fire_perimeters``\
  \ (active) or\n  ``fetch_mtbs_burn_severity`` (historical).\n- Outside CONUS (Mexico interior, Caribbean\
  \ except direct CONUS\n  spillover, Alaska, Hawaii, the open Pacific or Atlantic) -- HRRR-Smoke is CONUS-only;\
  \ bbox outside coverage raises\n  ``HRRRSmokeInputError``.\n- Long-range climatology / multi-day transport\
  \ beyond 48 h -- those\n  leads are not in HRRR-Smoke.\n\nParameters:\n    bbox: ``(west, south, east,\
  \ north)`` in EPSG:4326 (WGS84 decimal\n        degrees). Must intersect CONUS coverage (~lon -134..-60,\n\
  \        lat 21..53). Example: ``(-124.5, 41.0, -120.0, 46.3)`` for a\n        northern California /\
  \ southern Oregon wildfire footprint.\n    variable: one of:\n        - ``\"near_surface_smoke\"`` (kg\
  \ m-3, 8 m AGL smoke mass density -- the \"what you'd breathe\" layer; multiply by ~10⁹ for µg m-3)\n\
  \        - ``\"smoke_column_mass\"`` (kg m-2, vertically-integrated smoke\n          column -- total\
  \ atmospheric smoke load)\n        - ``\"aerosol_optical_depth\"`` (dimensionless, 550 nm AOD -- proxy\
  \ for satellite-observable smoke opacity).\n        Default ``\"near_surface_smoke\"``.\n    forecast_hour:\
  \ integer forecast lead time in hours (1 = +1 h from\n        cycle start). Range 1 - 18 for standard\
  \ cycles, 1 - 48 for the\n        extended 00/06/12/18z cycles. ``0`` is accepted and aliased to\n \
  \       the +1 h slice (no analysis-time slice exists in the ``fcst``\n        zarr). Default ``1``.\n\
  \    cycle: optional ISO-8601 cycle timestamp like\n        ``\"2026-06-09T00:00:00Z\"`` to pin a specific\
  \ cycle. Default\n        ``None`` → use the most recent published cycle (walks backward\n        up\
  \ to 6 h from current UTC).\n\nReturns:\n    A ``LayerURI`` pointing at a COG in the cache bucket\n\
  \    ``s3://trid3nt-cache/cache/dynamic-1h/hrrr_smoke/<key>.tif``\n    carrying the requested variable's\
  \ forecast slice, EPSG:4326,\n    float32, NaN nodata. ``layer_type=\"raster\"``, ``role=\"primary\"\
  ``,\n    ``units`` per the variable (``\"kg m-3\"``, ``\"kg m-2\"``, or ``\"1\"``).\n    Downstream\
  \ consumers (``publish_layer``, the code_exec playground,\n    ``clip_raster_to_polygon``) read the\
  \ COG and treat it as a\n    single-band scalar field.\n\nCross-tool dependencies:\n    - Consumes nothing\
  \ (Tier-1 substrate fetcher; no upstream tool).\n    - Feeds: ``publish_layer`` (visualization on the\
  \ web map),\n      AOI zonal stats in the code_exec playground (aggregate to admin\n      boundaries\
  \ or county / ZIP code area-weighted exposure),\n      ``clip_raster_to_polygon`` (further sub-clip\
  \ to fire footprint\n      or admin polygon), ``clip_raster_to_polygon`` (bbox or polygon sub-clip).\n\
  \    - Composes with: ``fetch_nifc_fire_perimeters`` (active wildfire\n      polygons -- overlay smoke\
  \ plume on the burning area),\n      ``fetch_firms_active_fire`` (VIIRS/MODIS hot spots -- overlay\n\
  \      ignition sources), ``fetch_mtbs_burn_severity`` (historical\n      burn footprints for context),\
  \ ``fetch_asos_metar`` (surface\n      visibility for validation), ``fetch_gridmet`` (RH / wind speed\n\
  \      context for fire-weather), ``fetch_administrative_boundaries``\n      (clip to a county or state\
  \ for air-quality reporting).\n\nRaises:\n    ``HRRRSmokeInputError``: bad bbox / variable / forecast_hour\n\
  \        (retryable=False).\n    ``HRRRSmokeEmptyError``: bbox falls outside HRRR coverage or\n    \
  \    yields all-NaN after clip (retryable=False).\n    ``HRRRSmokeNotAvailableError``: requested cycle\
  \ is not yet on S3\n        within the 6 h backstop (retryable=True).\n    ``HRRRSmokeUpstreamError``:\
  \ S3 / zarr / reprojection failure\n        (retryable=True).\n\nFR-CE-8: routed through ``read_through``\
  \ with ``ttl_class=\"dynamic-1h\"``\nso identical ``(bbox, variable, cycle, forecast_hour)`` calls reuse\n\
  the cached COG within the hourly window. The cache key includes the\ncycle identifier so distinct cycles\
  \ predicting the same valid time\nmap to distinct cache entries."
