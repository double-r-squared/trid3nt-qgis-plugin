# Router source spec (data-router fold, phase-2 wave-2 ArcGIS family).
# Twin: fetch_nhd_waterbodies.py (SPEC-EXPRESSIBLE, vector-API-FGB / ArcGIS).
# Uses the new primary->fallback endpoint chain (HR -> medium-res, the
# data-source-fallback norm) + case-insensitive column_map with a lookup-derived
# ftype_label (the two endpoints return field names in different case).
schema_version: v1

name: fetch_nhd_waterbodies
source_class: nhd_waterbodies              # cache prefix; error prefix == source_class.upper()
input_error_suffix: INPUT_INVALID          # NHDWaterbodiesInputError -> NHD_WATERBODIES_INPUT_INVALID
shape: vector-fgb
supports_global_query: false               # national polygon corpus, bbox required

endpoints:
  data:                                      # PRIMARY: NHDPlus_HR (lowercase fields)
    url: "https://hydro.nationalmap.gov/arcgis/rest/services/NHDPlus_HR/MapServer/9/query"
  medium:                                    # FALLBACK: medium-resolution (UPPERCASE fields)
    url: "https://hydro.nationalmap.gov/arcgis/rest/services/nhd/MapServer/12/query"
auth:
  mode: none
  user_agent: trid3nt_default
fallback: [medium]                           # tried in order on the primary's upstream failure

params:
  bbox: {type: bbox, required: true, quantize: round_6dp}
gates:
  max_features: 100000                       # twin _MAX_PAGES(100) * _PAGE_SIZE(1000)

ingest:
  query_template:
    out_fields: "permanent_identifier,gnis_name,ftype,fcode,reachcode,elevation,areasqkm"
    f: geojson
    order_by: "OBJECTID ASC"
  pagination: {mode: exceeded_transfer_limit, page_size: 1000}
  column_map_ci: true                        # HR lowercase vs medium-res UPPERCASE field names
  column_map:
    permanent_identifier: {from: permanent_identifier}
    gnis_name:            {from: gnis_name}
    ftype:                {from: ftype, kind: int}
    ftype_label:          {from: ftype, kind: lookup, key_from: ftype,
                           table: {390: LakePond, 436: Reservoir, 466: SwampMarsh,
                                   361: Playa, 493: Estuary, 378: IceMass}}
    fcode:                {from: fcode}
    reachcode:            {from: reachcode}
    elevation:            {from: elevation}
    areasqkm:             {from: areasqkm}

normalize:
  crs: "EPSG:4326"
  units: null

output:
  layer_type: vector
  ext: fgb
  role: context
  style_preset: "nhd_waterbodies"
  emit_bbox: false                           # twin LayerURI omits bbox

cache:
  ttl_class: static-30d
payload_estimate:                            # twin: area*0.4 clamp[0.05,50]
  model: bbox_area
  mb_per_sq_deg: 0.4
  floor_mb: 0.05

caveats:
  - "USGS NHD open-water polygons (lakes/ponds/reservoirs); vegetated wetlands -> fetch_nwi_wetlands"
  - "PRIMARY NHDPlus_HR -> FALLBACK medium-resolution; empty bbox over dry upland -> header-only FGB (honest-empty)"

docstring: |-
  USGS NHD waterbody polygons (lakes / ponds / reservoirs) as a vector layer.

  ROUTING -- use this when the user wants OPEN-WATER BODY extent: "show the
  lakes / ponds / reservoirs here", "map the water bodies", "NHD waterbodies",
  "which lakes are in this area", or needs waterbody polygons to overlay on /
  intersect with a hazard footprint. KEY-FREE, US + territories, authoritative
  USGS National Hydrography Dataset (NHDPlus HR).

  Prefer THIS over:
  - ``fetch_nhdplus_nldi_navigate`` -- that navigates the FLOWLINE (river/stream
    LINE) network from a seed point; this returns waterbody POLYGONS.
  - ``fetch_nwi_wetlands`` -- that returns VEGETATED / classified wetlands
    (marshes, swamps); this returns OPEN water. Fetch both for "all water +
    wetland habitat".
  - ``fetch_jrc_global_surface_water`` -- that is a global surface-water RASTER
    (occurrence %), not vector lake/pond polygons.
  Do NOT use for: coastal shoreline (``fetch_topobathy``), stream gauges
  (``fetch_usgs_nwis_gauges``), or flood extent (a SFINCS modeled layer).

  Parameters:
      bbox: ``(min_lon, min_lat, max_lon, max_lat)`` in EPSG:4326. REQUIRED -- NHD does not support a global query (national-scale polygon corpus).
          Recommended <= ~1 deg on a side. Example (Naples, FL):
          ``(-81.5, 26.0, -81.3, 26.2)``.

  Returns:
      ``LayerURI`` (``layer_type="vector"``, ``role="context"``,
      ``style_preset="nhd_waterbodies"``, ``units=None``) pointing at a
      FlatGeobuf in the cache bucket with per-polygon columns:
          permanent_identifier (str) -- stable NHD id
          gnis_name            (str) -- GNIS place name (null for many small ponds)
          ftype                (int) -- NHD feature-type code
          ftype_label          (str) -- human label (LakePond / Reservoir /
                                         SwampMarsh / Playa / Estuary / IceMass)
          fcode                (int) -- full NHD feature code
          reachcode            (str) -- NHD reach code
          elevation            (float) -- waterbody elevation (source units)
          areasqkm             (float) -- polygon area in square km
      An empty bbox over dry upland returns a valid 0-feature FlatGeobuf
      (NOT an error).

  Cross-tool dependencies:
      - Composed by the code_exec playground (open-water channel of a
        habitat-impact assessment, alongside ``fetch_nwi_wetlands``).
      - Feeds ``spatial_query`` (waterbody area inside a footprint, or
        waterbodies within a place).

  Resilience (feedback_data_source_fallback_norm): PRIMARY NHDPlus_HR ->
  FALLBACK medium-resolution NHD Waterbody -> honest
  ``NHDWaterbodiesUpstreamError(retryable=True)`` if both fail. Never fabricates
  a non-empty layer. Cache: ``static-30d``, keyed on ``bbox-rounded-6dp`` +
  month vintage.
