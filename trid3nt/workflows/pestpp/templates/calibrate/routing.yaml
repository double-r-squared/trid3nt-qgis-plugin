summary: CALIBRATE a finished run against measurements using PEST++.
routing: 'Use for tuning MODFLOW conductivity to wells or TELEMAC friction to gauges. Pass a finished
  run id or layer handle, or use the case''s run. Name parameters by engine identifier with lower and
  upper multipliers or lower_value and upper_value in model units. Pass observe (wells) or gauges,
  or let the template match observations. Set noptmax for calibration and other PEST++ keywords by name.
  Use stages for an ordered subset of screen (Morris), calibrate and resolve. Resolve requires earlier
  calibration. By default tune below the parameter count adds screening before calibration and re-solve.
  Use parameter_data for native PEST++ columns keyed by authored PARNME.'
not_for: building a model, a GeoClaw run, or predictions under changed forcing
returns: 'With resolve, a calibrated LayerURI. Without resolve, a StudyResult with the study id,
  stage run ids and any ranking. Calibration publishes its charts and journals the study.
  A failure returns status and error_code.'
