# USGS Water Data OGC API groundwater wells: a measurements primary - the latest reading per well, or asked a
# window the field measurements dated inside it - then a best-effort
# monitoring-locations enrich. A failed or absent locations body leaves the names blank
# and never drops a reading. Keyless.
# NOT a dataretrieval delegate: nwis.get_gwlevels is defunct in the installed version
# and directs to waterdata.get_field_measurements / get_daily / get_continuous, a
# different submodule answering a different shape than these rows are read in.
schema_version: v1

name: fetch_usgs_groundwater_levels
source_class: usgs_groundwater_levels
error_prefix: USGS_GROUNDWATER
empty_error_suffix: NO_WELLS
shape: vector-fgb
supports_global_query: false

endpoints:
  data:
    url: "https://api.waterdata.usgs.gov/ogcapi/v0/collections/latest-field-measurements/items"
  dated:
    url: "https://api.waterdata.usgs.gov/ogcapi/v0/collections/field-measurements/items"
auth:
  mode: none
  user_agent: "trid3nt/0.1 (Hazard Modeling Agent; https://github.com/double-r-squared/trid3nt-qgis-plugin; agent@trid3nt.dev)"

params:
  state_code: {type: str, schema_optional: true}
  bbox: {type: bbox, schema_optional: true, quantize: round_6dp}
  start_date: {type: str, schema_optional: true}
  end_date: {type: str, schema_optional: true}
  period_average: {type: bool, schema_optional: true}

hooks:
  build_request: usgs_groundwater_levels.build_request
  parse_response: usgs_groundwater_levels.parse_response
  enrich_plan: usgs_groundwater_levels.enrich_plan
  enrich_merge: usgs_groundwater_levels.enrich_merge

normalize:
  crs: "EPSG:4326"
  units: "ft (water level)"

output:
  layer_type: vector
  ext: fgb
  role: primary
  style:
    kind: reference
    geometry: point
  bbox_from_features:
    pad: 0.05

cache:
  ttl_class: dynamic-1h
payload_estimate:
  model: per_feature
  features_per_sq_deg: 1.0
  kb_per_feature: 1.6
  floor_mb: 0.001

fields:
  site: {field: site_no}
  site_name: {field: location.monitoring_location_name}
  value: {field: water_level, unit: {field: unit_of_measure}}
  time: {field: datetime}
  datum: {field: vertical_datum}
  quantity:
    field: parameter_code
    table: {"72019": water_table_depth, "72150": groundwater_head, "62610": groundwater_head, "62611": groundwater_head}
    cite: "USGS Water Data OGC API parameter-codes collection: 72019 Depth to water level, feet below land surface; 72150 Groundwater level above local mean sea level, feet; 62610 above NGVD 1929; 62611 above NAVD 1988. 61055 is not in that collection, so it has no row."
  depth: {field: location.well_constructed_depth, unit: ft}
  accuracy:
    field: observing_procedure
    table:
      "GW level, steel tape": {absolute: 0.01, unit: ft}
      "GW level, calib steel tape": {absolute: 0.01, unit: ft}
      "GW level, electric tape": {absolute: 0.01, unit: ft}
      "GW level, calib electric tape": {absolute: 0.01, unit: ft}
    cite: "Cunningham and Schalk 2011, USGS TM 1-A1 (Groundwater Technical Procedures): GWPD 1 p.5, a graduated steel tape is commonly accurate to 0.01 foot; GWPD 4 p.33, a modern graduated electric tape commonly is accurate to +/- 0.01 foot. A calibrated tape is the same tape. The other procedures (airline, pressure gage or transducer, manometer, logs, estimated) state no number there."
coverage:
- data_class: groundwater level
  kind: measured
  reach_km: 25
  extent:
    kind: stations
    rings:
      - [[-125.0, 24.0], [-66.0, 24.0], [-66.0, 50.0], [-125.0, 50.0]]
      - [[-172.0, 51.0], [-129.0, 51.0], [-129.0, 72.0], [-172.0, 72.0]]
      - [[-161.0, 18.0], [-154.0, 18.0], [-154.0, 23.0], [-161.0, 23.0]]
      - [[-68.5, 17.0], [-64.0, 17.0], [-64.0, 19.0], [-68.5, 19.0]]
      - [[144.0, 13.0], [146.5, 13.0], [146.5, 21.0], [144.0, 21.0]]
      - [[-171.5, -15.0], [-169.0, -15.0], [-169.0, -13.0], [-171.5, -13.0]]
    note: USGS groundwater monitoring wells over the US and its territories,
      discovered by bbox or by state
    discover: bbox
  window:
    series: true
    cadence: irregular field measurements
    series_param: period_average
  datum: record

caveats:
  - "USGS Water Data OGC API observed groundwater monitoring wells + their latest water-level reading (depth-to-water / groundwater elevation) as points. Pass EXACTLY ONE of state_code (USPS) or bbox (state wins). No wells with a reading in scope -> a typed USGS_GROUNDWATER_NO_WELLS error, never a fabricated layer."
  - "Asked a window (start_date and end_date, ISO dates), every field measurement DATED inside it is one point, the window reaching back OBSERVATION_WINDOW_DAYS before start_date so every reading that may speak for a moment is read; with period_average, each well's readings of one parameter over the window alone are ONE point - their mean, stamped at start_date, with reading_count and period_end. More readings than one page holds refuse (USGS_GROUNDWATER_UPSTREAM_ERROR) rather than return part of them."

docstring: |-
  Fetch REAL, OBSERVED USGS groundwater monitoring wells as a point FlatGeobuf.

  Retrieves active USGS groundwater monitoring wells and their LATEST
  water-level reading -- depth-to-water (pcode 72019, ft below land surface)
  and/or groundwater elevation (62611/62610/72150, ft) -- from the modernized
  USGS Water Data OGC API (the machine API behind ``waterdata.usgs.gov``, which
  replaced the decommissioned ``nwis/gwlevels`` service). Returns one Point
  feature per well-level reading at the well's coordinates, carrying the latest
  value, its parameter code, unit, vertical datum and reading timestamp. This
  is the canonical OBSERVED groundwater-head source -- the field/instrument
  record of how deep the water table is, NOT a model estimate.

  When to use:
      - The user asks for USGS groundwater wells / monitoring wells, "water
        table", "depth to water", "groundwater levels", "observed heads", or
        "well water-level readings" (e.g. "show me the groundwater monitoring
        wells in the High Plains aquifer", "where are the wells near this farm
        and how deep is the water table", "plot the observed groundwater
        levels in central Kansas").
      - You need the actual measured groundwater head at instrumented wells -- the real instrument record -- to map, annotate, or ground-truth.
      - Cross-checking / calibrating a MODELED groundwater head field
        against the observed monitoring-well network ("observed
        vs modeled heads").

  When NOT to use:
      - MODELED groundwater heads / drawdown / a contaminant plume are not
        currently modeled here. This tool supplies the OBSERVED comparison points.
      - SURFACE-water stream gauges (discharge / gage height at river
        stations) -- use ``fetch_usgs_nwis_gauges`` (the observed stream-gauge
        companion). This tool is the GROUNDWATER (subsurface well) network.
      - Soil-moisture / shallow vadose-zone water content -- that is a different
        measurement; this is the saturated-zone water table.

  Window (optional): ``start_date`` and ``end_date`` (ISO dates) read the DATED field measurements inside
  it instead of the latest; ``period_average=True`` returns each well's mean over that window, one
  point per well and parameter, with ``reading_count``.

  Spatial selector (pass EXACTLY ONE):
      state_code: Optional 2-letter USPS state/territory code (e.g. ``"KS"``,
          ``"CA"``, ``"FL"``). PREFER THIS for state-level asks. Mapped
          internally to the FIPS code the OGC API's ``state_code`` filter
          expects.
      bbox: Optional ``(west, south, east, north)`` in EPSG:4326 for an
          area-of-interest query (a farm, aquifer sub-region, or county). The
          OGC API places NO area limit on bbox, so any sub-state extent is
          accepted.
      When both are given, ``state_code`` wins. When neither is given,
      ``GwInputError`` is raised.

  Returns:
      ``LayerURI`` pointing at a FlatGeobuf in the cache bucket.
      - ``layer_type="vector"``, ``role="primary"`` ``units="ft (water level)"``.
      - Geometry: Point at each well's coordinates, EPSG:4326.
      - ``bbox`` is set to the wells' extent so the client camera auto-zooms
        (the layer renders via the inline-GeoJSON vector path).
      - Properties per reading: the whole field measurement under the
        service's own names (``parameter_code`` 72019 / 72150 / 62610 /
        62611 / 61055, ``value`` as text, ``unit_of_measure``,
        ``vertical_datum`` ("NAVD88", "NGVD29", or "Local Assumed Datum"),
        ``time``, ``observing_procedure`` (the method: steel tape, electric
        tape, airline, logs, ...), ``qualifier``, ``approval_status``, ...),
        ``site_no`` (NWIS site number), ``water_level`` (the value parsed,
        null if not parseable) and ``datetime`` (the reading's ISO-8601
        timestamp), then the well's whole monitoring-locations record as
        ``location.<field>`` (``location.monitoring_location_name``,
        ``location.well_constructed_depth`` in ft, ``location.national_aquifer_code``,
        ``location.altitude``, ``location.altitude_accuracy``, ...), absent where
        the join found none. A depth-to-water reading (72019) is ft below land
        surface; the others are elevations on ``vertical_datum``.

  Fallback behaviour (data-source fallback norm -- primary -> honest typed
  error): the latest-field-measurements collection is the primary (observed
  readings). The monitoring-locations join (for well name / aquifer / depth) is
  a best-effort ENRICHMENT -- a failure there leaves names blank but never
  aborts. If the primary returns zero readings in scope, ``GwNoWellsError`` is
  raised -- never an empty success-shaped layer.

  Cache: ``ttl_class="dynamic-1h"``, ``source_class="usgs_groundwater_levels"``.
  Cache key is SHA-256 of the resolved selector (``state_code`` or
  bbox-rounded-6dp), so identical-scope calls within the hour reuse the FGB.

  Cross-tool dependencies:
      - Composes WITH: ``geocode_location``
        (derive a bbox or surface a state from a place name BEFORE this call),
        ``fetch_administrative_boundaries`` (state/county framing).
      - Upstream data source: USGS Water Data OGC API
        (api.waterdata.usgs.gov/ogcapi/v0 -- latest-field-measurements +
        monitoring-locations).

  Errors:
      - ``GwInputError``: no selector / bad bbox / bad state code
        (retryable=False).
      - ``GwUpstreamError``: USGS network failure / HTTP 5xx / bad body
        (retryable=True).
      - ``GwNoWellsError``: no groundwater wells with a reading in scope
        (retryable=False).

  Tier-1 free. No API key.
