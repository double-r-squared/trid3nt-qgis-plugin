schema_version: v1
name: fetch_slider_timestamps
source_class: slider_timestamps
shape: record
error_prefix: SLIDER
input_error_suffix: INPUT_ERROR
empty_error_suffix: EMPTY

docstring: |
  List the AVAILABLE CIRA/RAMMB SLIDER imagery frames for a product.

  Reads the SLIDER ``latest_times.json`` availability index and returns the
  timestamps (ascending) for which imagery tiles exist, plus the earliest /
  latest ISO time and an estimated frame cadence. This is the AVAILABILITY +
  auto-snap primitive: call it FIRST to learn which frames exist (and how
  often they land), then fetch the actual imagery per frame with
  ``fetch_goes_animation`` / ``fetch_goes_blend_animation`` /
  ``fetch_viirs_day_fire`` and window your animation to real frames.

  When to use:
      - "which GOES/VIIRS frames are available over this window?"
      - "what is the SLIDER cadence for this product?"
      - snapping a requested animation window to the nearest real frames
        (the frame-animation playground recipe's availability step).

  When NOT to use:
      - fetching the imagery itself (use the ``*_animation`` fetchers).
      - historical raw-archive access (use ``fetch_goes_archive_animation``).

  Params:
      sat: SLIDER satellite id -- one of ``"goes-18"``, ``"goes-19"``,
          ``"jpss"``.
      sector: SLIDER sector for that satellite -- e.g. ``"conus"`` /
          ``"full_disk"`` (GOES) or ``"conus"`` / ``"northern_hemisphere"`` /
          ``"southern_hemisphere"`` (jpss).
      product: SLIDER product slug -- e.g. ``"geocolor"``,
          ``"fire_temperature"``, ``"band_02"`` (GOES ABI) or
          ``"day_land_cloud_fire"`` (VIIRS Day Fire).

  Returns:
      A dict: ``sat`` / ``sector`` / ``product`` (echoed), ``count`` (n
      frames), ``timestamps_int`` (ascending 14-digit YYYYMMDDHHMMSS ints),
      ``earliest_iso`` / ``latest_iso`` (ISO-8601 UTC or None), and
      ``cadence_seconds`` (median inter-frame gap, or None for < 2 frames).

  Raises:
      ``SliderUpstreamError`` on a network / parse failure (upstream provider
      error -- surfaced verbatim, never internalized).

# The build_request hook builds the per-(sat, sector, product) URL via the shared
# _satellite_slider.build_times_url (the single source of truth the animation cluster
# also imports); this endpoint documents the templated latest_times.json path.
endpoints:
  latest_times:
    url: https://rammb-slider.cira.colostate.edu/data/json/{sat}/{sector}/{product}/latest_times.json

params:
  sat:
    type: str
    required: true
  sector:
    type: str
    required: true
  product:
    type: str
    required: true

hooks:
  build_request: slider_timestamps.build_request
  record: slider_timestamps.record

normalize:
  crs: EPSG:4326

output:
  layer_type: record
  ext: json
  style_preset: none
  emit_bbox: false

# live-no-cache by construction: the SLIDER availability index turns over every
# few minutes (new frames land continuously), so a cached list would go stale and
# make the auto-snap miss the newest frames. read_through short-circuits it (no
# cache write) and the tool registers cacheable=False.
cache:
  ttl_class: live-no-cache

# The record is a tiny JSON availability dict (echoed ids + an int list), not a
# bulk payload; the twin registered no estimator (cacheable=False). A tiny clipped
# estimate (never warns) reproduces that no-warning behaviour under the router's
# mandatory payload seam.
payload_estimate:
  model: bbox_area
  floor_mb: 0.02
  ceil_mb: 0.2
  mb_per_sq_deg: 0.01

caveats:
  - The availability index is a live read (no cache); it turns over every few minutes as new frames land.
  - An unknown sat/sector/product 404s upstream and surfaces as a typed SLIDER_UPSTREAM_ERROR, never a fabricated empty list.
