# USACE National Structure Inventory points, a single POST whose query is a JSON body.
# The build hook carries the per-axis span cap and the polygon POST body; the field map
# states the FeatureCollection walk, the column projection and the exposure columns.
schema_version: v1
name: fetch_usace_nsi
source_class: usace_nsi
shape: vector-fgb
supports_global_query: false
input_error_suffix: INPUT_INVALID
endpoints:
  data:
    url: https://nsi.sec.usace.army.mil/nsiapi/structures
auth:
  mode: none
  user_agent: trid3nt/0.1 (Hazard Modeling Agent; https://github.com/double-r-squared/trid3nt-qgis-plugin;
    agent@trid3nt.dev)
params:
  bbox:
    type: bbox
    required: true
    quantize: round_6dp
hooks:
  build_request: usace_nsi.build_request
ingest:
  access: http_json
  body:
    format: geojson
    rows_path: features
    geometry:
      kind: geojson
      path: geometry
  column_map:
    fd_id: {from: properties.fd_id}
    occtype: {from: properties.occtype}
    st_damcat: {from: properties.st_damcat}
    bldgtype: {from: properties.bldgtype}
    found_type: {from: properties.found_type}
    found_ht: {from: properties.found_ht}
    num_story: {from: properties.num_story}
    sqft: {from: properties.sqft}
    med_yr_blt: {from: properties.med_yr_blt}
    val_struct: {from: properties.val_struct}
    val_cont: {from: properties.val_cont}
    val_vehic: {from: properties.val_vehic}
    firmzone: {from: properties.firmzone}
    cbfips: {from: properties.cbfips}
    ground_elv: {from: properties.ground_elv}
    ground_elv_m: {from: properties.ground_elv_m}
    pop2amu65: {from: properties.pop2amu65}
    pop2amo65: {from: properties.pop2amo65}
    pop2pmu65: {from: properties.pop2pmu65}
    pop2pmo65: {from: properties.pop2pmo65}
    students: {from: properties.students}
    source: {from: properties.source}
    # occtype IS the HAZUS occupancy class and val_struct the canonical
    # per-structure USD value, so the exposure consumer reads them under its own names.
    component_type: {from: properties.occtype, kind: str}
    replacement_value: {from: properties.val_struct, kind: float}
  json_coerce_nested: true
  geometry_filter:
    geom_types: [Point]
    require_finite: true
normalize:
  crs: EPSG:4326
output:
  layer_type: vector
  ext: fgb
  role: primary
  style:
    kind: reference
    geometry: point
  emit_bbox: false
cache:
  ttl_class: static-30d
payload_estimate:
  model: bbox_area
  mb_per_sq_deg: 50.0
  floor_mb: 0.0
coverage:
- data_class: exposure
  kind: measured
  extent:
    kind: surface
    rings:
      - [[-125.0, 24.4], [-66.9, 24.4], [-66.9, 49.4], [-125.0, 49.4]]
      - [[-172.0, 51.0], [-129.0, 51.0], [-129.0, 72.0], [-172.0, 72.0]]
      - [[-161.0, 18.0], [-154.0, 18.0], [-154.0, 23.0], [-161.0, 23.0]]
      - [[-68.5, 17.0], [-64.0, 17.0], [-64.0, 19.0], [-68.5, 19.0]]
      - [[144.0, 13.0], [146.5, 13.0], [146.5, 21.0], [144.0, 21.0]]
    note: the USACE National Structure Inventory over CONUS, Alaska, Hawaii and
      the US territories, one point per structure
  window:
    series: false
    latest: '2022-01-01'
  units:
    val_struct: USD
    val_cont: USD
    val_vehic: USD
    sqft: ft2
    found_ht: ft
    num_story: storeys
    ground_elv_m: m
  value_column: val_struct

caveats:
- Per-axis bbox span capped at 1 degree (NSI 500s oversized envelopes). A bbox with no structures ->
  a header-only FlatGeobuf, never an error.
docstring: |-
  USACE National Structure Inventory as a point FlatGeobuf -- buildings +
  HAZUS occupancy class + per-structure replacement value (USD).

  What it does: queries the U.S. Army Corps of Engineers (USACE) National
  Structure Inventory (NSI) REST API for every documented building inside
  a bbox and returns a FlatGeobuf of point features (one per structure),
  each carrying its HAZUS occupancy class (``occtype``), structure
  replacement value (``val_struct``, USD), content value (``val_cont``),
  square footage, year built, foundation type/height, FEMA FIRM flood
  zone, AM/PM population, and ground elevation. NSI is the authoritative
  structure inventory used by FEMA / USACE / HAZUS for flood loss
  estimation.

  When to use:
      - User asks for the buildings or "structure inventory" inside an
        area (e.g. "show me every building in Fort Myers Beach", "what
        buildings are in the floodplain?").
      - As the structure-exposure asset layer for a building-loss or
        exposure-value analysis -- NSI carries the HAZUS occupancy class
        AND per-structure replacement value, removing both the
        default-RES1 proxy AND the
        ``_REPLACEMENT_VALUE_DEFAULTS_USD`` per-class fallback. This is
        the **preferred** structure-exposure substrate.
      - User asks for exposed value or repair cost estimates that need a
        real ``val_struct`` per structure.
      - Counting buildings by occupancy class (RES1 / COM1 / IND1 / EDU1
        / etc.) in a small area.

  When NOT to use:
      - Off the coverage row -- use ``fetch_buildings`` (building
        footprints) instead.
      - For bbox spans larger than ~1 degree per axis -- NSI rejects
        oversized queries with a 500. Split into tiles and call once per
        tile, or aggregate footprints in the session for the regional
        count.
      - For aggregate building density rasters -- a count of ``fetch_buildings``
        footprints per cell in the session, when you want a raster of building counts
        per cell, not point features.
      - For HRSL population grids -- ``fetch_hrsl_population`` is the
        dedicated tool when you only need persons-per-cell, not per-
        structure attributes.

  Parameters:
      bbox: REQUIRED ``(min_lon, min_lat, max_lon, max_lat)`` in EPSG:4326.
          Valid range: ``min_lon`` in [-180, 180], ``max_lat`` in [-90, 90],
          min < max on each axis. Span on each axis must be <= 1.0 degree
          (NSI server-side cap; oversized envelopes return 500). Example:
          ``(-81.880, 26.620, -81.860, 26.660)`` for a Fort Myers Beach
          neighborhood (~0.02 deg, ~50-200 structures).

  Returns:
      A ``LayerURI`` pointing at a FlatGeobuf of NSI Point features (one
      per structure) at
      ``s3://trid3nt-cache/cache/static-30d/usace_nsi/<key>.fgb``.
      ``layer_type="vector"``, ``role="primary"``, ``units=None`` Each feature carries:

      - ``fd_id`` (int) -- NSI persistent feature ID.
      - ``occtype`` (str) -- HAZUS occupancy class (``RES1``, ``RES3A``,
        ``COM1``, ``IND1``, ``EDU1``, ...). Downstream exposure analysis
        reads this.
      - ``component_type`` (str) -- duplicate of ``occtype`` under a
        standard exposure-analysis column name.
      - ``st_damcat`` (str) -- Structure damage category (RES, COM, IND).
      - ``bldgtype`` (str) -- Construction type (W=wood, S=steel, C=concrete,
        M=masonry).
      - ``found_type`` (str) -- Foundation type (S=slab, B=basement,
        C=crawlspace, P=pier).
      - ``found_ht`` (float) -- Foundation height above ground (ft).
      - ``num_story`` (int) -- Number of stories.
      - ``sqft`` (float) -- Building square footage.
      - ``med_yr_blt`` (int) -- Median year built (Census block).
      - ``val_struct`` (float) -- Structure replacement value (USD).
      - ``replacement_value`` (float) -- duplicate of ``val_struct`` under
        a standard exposure-analysis column name.
      - ``val_cont`` (float) -- Content replacement value (USD).
      - ``val_vehic`` (float) -- Vehicle replacement value (USD).
      - ``firmzone`` (str|None) -- FEMA FIRM flood zone (``AE``, ``X``,
        ``VE``, or None).
      - ``cbfips`` (str) -- Census block FIPS code.
      - ``ground_elv`` / ``ground_elv_m`` (float) -- Ground elevation
        (ft / m).
      - ``pop2amu65`` / ``pop2amo65`` / ``pop2pmu65`` / ``pop2pmo65``
        (int) -- Population AM/PM, under/over 65.
      - ``students`` (int) -- Student count (schools).
      - ``source`` (str) -- NSI source tier (E=Estimated, P=Parcel, ...).

  Cross-tool dependencies:
      - Every NSI feature already carries ``component_type`` and
        ``replacement_value`` (added by this tool) for real HAZUS
        occupancy + structure values rather than a class-default
        fallback. This is the **preferred** structure-exposure substrate --
        prefer NSI where the coverage row reaches and fall back to
        ``fetch_buildings`` elsewhere.
      - Complementary to ``fetch_hrsl_population`` (population grid),
        ``fetch_administrative_boundaries`` (admin polygons for zonal
        aggregation), and ``fetch_osm_features`` (feature="roads") for full
        exposure-context layers.

  Cache: ``static-30d`` (the NSI is rebuilt by USACE on a ~quarterly
  cadence; a 30-day TTL matches the update rhythm). Cache key:
  SHA-256 of (bbox-rounded-6dp, "static-30d" vintage).
