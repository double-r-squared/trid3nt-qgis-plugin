schema_version: v1
name: fetch_administrative_boundaries
source_class: admin_boundaries
error_prefix: ADMIN_BOUNDARY
input_error_suffix: ERROR
empty_error_suffix: EMPTY
shape: vector-fgb
supports_global_query: false
endpoints:
  data:
    url: https://www2.census.gov/geo/tiger/TIGER2024
auth:
  mode: none
  user_agent: trid3nt/0.1 (Hazard Modeling Agent; https://github.com/double-r-squared/trid3nt-qgis-plugin;
    agent@trid3nt.dev)
params:
  level:
    type: enum
    required: true
    values:
    - state
    - county
    - place
    - zcta
    error_suffix: LEVEL_INVALID
  bbox:
    type: bbox
    required: true
    quantize: round_6dp
hooks:
  build_request: admin_boundaries.build_request
ingest:
  access: ogr
  ogr:
    driver: vsizip
    # A bbox the archive does not reach is out of coverage, not an empty answer.
    empty_is_typed_error: true
normalize:
  crs: EPSG:4326
output:
  layer_type: vector
  ext: fgb
  role: context
  style:
    kind: reference
    geometry: polygon
  emit_bbox: false
cache:
  ttl_class: static-30d
payload_estimate:
  model: bbox_area
  mb_per_sq_deg: 2.0
  floor_mb: 0.05
  ceil_mb: 20.0
caveats:
- US Census TIGER/Line 2024 administrative polygons (state/county/place/zcta), clipped to bbox. The
  shapefile is read inside the remote ZIP by range request; place fans out per intersecting state FIPS.
  US + territories only. No feature in bbox -> ADMIN_BOUNDARY_EMPTY.
docstring: |-
  Fetch US Census TIGER/Line 2024 administrative-boundary polygons clipped to a bbox.

  **What it does:** Reads the TIGER/Line 2024 shapefile for the requested
  administrative level inside its ZIP on ``census.gov``, by range request,
  selecting the features that intersect the bbox, and returns a FlatGeobuf
  vector layer. Cached ``static-30d``
  (boundaries change at most once per census year). Four levels supported:
  state, county, place (cities/CDPs), and ZIP Code Tabulation Areas (zcta).

  **When to use:**
  - Agent needs administrative outlines for spatial context alongside a
    hazard layer (e.g. county boundaries over a flood inundation surface).
  - Workflow must aggregate or label results by jurisdiction -- state, county,
    city, or ZIP code.
  - User asks for a geographic boundary before calling
    ``clip_raster_to_polygon`` or ``spatial_query``.
  - ``geocode_location`` returned a bbox but the workflow needs the actual
    polygon for precise clipping.

  **When NOT to use:**
  - Parcel-level or cadastral boundaries (county assessor data; not in scope).
  - Congressional or voting districts (different TIGER layers, not added).
  - International administrative boundaries (TIGER is US + territories only).
  - Simple place-name -> bbox resolution (use ``geocode_location`` instead).

  **Parameters:**
  - ``level`` (str): one of ``"state"`` (50 + DC + territories), ``"county"``
    (3000+ counties), ``"place"`` (cities/CDPs; per-state ZIPs; only states
    intersecting bbox are fetched), or ``"zcta"`` (ZIP Code Tabulation Areas;
    ~504 MB download -- subsequent calls hit 30-day cache).
  - ``bbox`` (tuple): ``(min_lon, min_lat, max_lon, max_lat)`` in EPSG:4326.
    Example: ``(-82.2, 26.3, -81.5, 26.8)`` for Lee County FL.

  **Returns:**
  ``LayerURI(layer_type="vector", role="context", units=None)`` pointing at a
  FlatGeobuf with TIGER standard fields (GEOID, NAME, STATEFP, etc.) clipped
  to the requested bbox.

