schema_version: v1
name: fetch_administrative_boundaries
source_class: admin_boundaries
error_prefix: ADMIN_BOUNDARY
input_error_suffix: ERROR
empty_error_suffix: EMPTY
shape: vector-fgb
supports_global_query: false
endpoints:
  data:
    url: https://www2.census.gov/geo/tiger/TIGER2024
auth:
  mode: none
  user_agent: trid3nt/0.1 (Hazard Modeling Agent; https://github.com/double-r-squared/trid3nt-qgis-plugin;
    agent@trid3nt.dev)
params:
  level:
    type: enum
    required: true
    values:
    - state
    - county
    - place
    - zcta
    error_suffix: LEVEL_INVALID
  bbox:
    type: bbox
    required: true
    quantize: round_6dp
hooks:
  build_request: admin_boundaries.build_request
ingest:
  zip_vector:
    member_pattern: .shp
    merge_levels:
    - place
    merge_level_param: level
    reproject_to: EPSG:4326
normalize:
  crs: EPSG:4326
output:
  layer_type: vector
  ext: fgb
  role: context
  style_preset: admin_boundaries
  emit_bbox: false
cache:
  ttl_class: static-30d
payload_estimate:
  model: bbox_area
  mb_per_sq_deg: 2.0
  floor_mb: 0.05
  ceil_mb: 20.0
caveats:
- US Census TIGER/Line 2024 administrative polygons (state/county/place/zcta), clipped to bbox. Whole-object
  ZIP download + shapefile extract (ADR 0067); place fans out per intersecting state FIPS. US + territories
  only. No feature in bbox -> ADMIN_BOUNDARY_EMPTY.
docstring: "Fetch US Census TIGER/Line 2024 administrative-boundary polygons clipped to a bbox.\n\n**What\
  \ it does:** Downloads the TIGER/Line 2024 shapefile for the requested\nadministrative level from ``census.gov``,\
  \ clips it to the requested bbox\nvia geopandas, and returns a FlatGeobuf vector layer. Cached ``static-30d``\n\
  (boundaries change at most once per census year). Four levels supported:\nstate, county, place (cities/CDPs),\
  \ and ZIP Code Tabulation Areas (zcta).\n\n**When to use:**\n- Agent needs administrative outlines for\
  \ spatial context alongside a\n  hazard layer (e.g. county boundaries over a flood inundation surface).\n\
  - Workflow must aggregate or label results by jurisdiction -- state, county,\n  city, or ZIP code.\n\
  - User asks for a geographic boundary before calling\n  ``clip_raster_to_polygon`` or ``spatial_query``.\n\
  - ``geocode_location`` returned a bbox but the workflow needs the actual\n  polygon for precise clipping.\n\
  \n**When NOT to use:**\n- Parcel-level or cadastral boundaries (county assessor data; not in scope).\n\
  - Congressional or voting districts (different TIGER layers, not added).\n- International administrative\
  \ boundaries (TIGER is US + territories only).\n- Simple place-name → bbox resolution (use ``geocode_location``\
  \ instead).\n\n**Parameters:**\n- ``level`` (str): one of ``\"state\"`` (50 + DC + territories), ``\"\
  county\"``\n  (3000+ counties), ``\"place\"`` (cities/CDPs; per-state ZIPs; only states\n  intersecting\
  \ bbox are fetched), or ``\"zcta\"`` (ZIP Code Tabulation Areas;\n  ~504 MB download -- subsequent calls\
  \ hit 30-day cache).\n- ``bbox`` (tuple): ``(min_lon, min_lat, max_lon, max_lat)`` in EPSG:4326.\n \
  \ Example: ``(-82.2, 26.3, -81.5, 26.8)`` for Lee County FL.\n\n**Returns:**\n``LayerURI(layer_type=\"\
  vector\", role=\"context\", units=None)`` pointing at a\nFlatGeobuf with TIGER standard fields (GEOID,\
  \ NAME, STATEFP, etc.) clipped\nto the requested bbox.\n\n**Cross-tool dependencies:**\n- Upstream of:\
  \ ``clip_raster_to_polygon``, ``spatial_query``,\n  overlay display.\n- Pairs with: ``geocode_location``\
  \ (resolve name → bbox first), then\n  ``fetch_administrative_boundaries`` for the actual polygon.\n\
  - Feeds into: jurisdictional labeling in any flood/wildfire impact summary."
