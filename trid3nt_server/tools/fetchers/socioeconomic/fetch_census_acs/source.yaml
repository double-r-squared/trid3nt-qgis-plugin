# Router source spec (data-router fold, pilot 5/5) -- Census ACS tract choropleth.
# Twin: fetch_census_acs.py (HYBRID, vector-FGB + JOIN-on-key transform).
# The two-source geometry+values join on GEOID that 6+ fetchers share.
schema_version: v1

name: fetch_census_acs
source_class: census_acs        # cache prefix == twin source_class
input_error_suffix: INPUT_INVALID   # twin CensusACSInputError -> *_INPUT_INVALID
shape: vector-fgb               # join block below selects the JOIN transform
supports_global_query: false

# --- endpoints ------------------------------------------------------------
# geometry = TIGERweb tract polygons (keyless ArcGIS REST).
# values   = ACS estimates. The twin's PRIMARY keyless path is the
#   data.census.gov backend (g=/tid=, response.data shape); the router JOIN
#   transform speaks the api.census.gov Data-API shape (get=/for=/in=). These
#   are different protocols (see VERDICT.md: census values-endpoint protocol +
#   {year}-templating gaps). The offline harness feeds identical values to both,
#   so the JOIN + null-floor + serialization parity is exercised regardless.
endpoints:
  geometry:
    url: "https://tigerweb.geo.census.gov/arcgis/rest/services/Generalized_ACS2023/Tracts_Blocks/MapServer/4/query"
  values:
    url: "https://api.census.gov/data/2022/acs/acs5"
auth:
  mode: api_key_env
  api_key_env: {var: CENSUS_API_KEY, required: false}   # keyless fallback
  user_agent: trid3nt_default

# --- request-param schema -------------------------------------------------
# variable is a free STR (not an enum) for FULL FIDELITY (NATE): the JOIN
# transform's select_variable resolves either a friendly name (the 6 below,
# case-insensitive) OR a raw ACS estimate code (e.g. B19013_001E, units=count),
# exactly as the twin _resolve_variable did. An unknown/malformed value raises
# the twin-identical CENSUS_ACS_INPUT_INVALID inside the transform.
params:
  bbox:     {type: bbox, required: true, quantize: round_6dp}
  variable: {type: str, default: median_income}
  year:     {type: int, default: 2022}
gates:
  max_features: 20000

# --- ingestion (geometry endpoint ArcGIS query template) ------------------
ingest:
  query_template: {out_fields: "GEOID,NAME,STATE,COUNTY,TRACT", f: geojson, order_by: "OBJECTID ASC"}
  pagination: {mode: result_offset, page_size: 1000}

# --- named transform: two-source JOIN-on-key (contract sec 2.5) -----------
join:
  geometry: {endpoint: geometry, key_field: GEOID, keep: [NAME, STATE, COUNTY]}
  values:
    endpoint: values
    key_field: geoid11
    scope_by: [STATE, COUNTY]        # values fetched per-county from the geometry set
    null_sentinel_below: -666666000.0
    variables:                       # the ACS_VARIABLES registry, declarative
      median_income:     {table: B19013, code: B19013_001E, kind: value, units: usd}
      median_age:        {table: B01002, code: B01002_001E, kind: value, units: years}
      median_home_value: {table: B25077, code: B25077_001E, kind: value, units: usd}
      poverty_rate:      {table: B17001, num: [B17001_002E], denom: B17001_001E, kind: pct, units: percent}
      pct_renters:       {table: B25003, num: [B25003_003E], denom: B25003_001E, kind: pct, units: percent}
      pct_no_vehicle:    {table: B25044, num: [B25044_003E, B25044_010E], denom: B25044_001E, kind: pct, units: percent}

# --- normalization stamps -------------------------------------------------
# units are per-variable in the twin (usd / years / percent / count for raw
# codes). FULL FIDELITY (NATE): build_layer_uri resolves the LayerURI.units
# per-variable for JOIN specs (from the resolved variable's units), and the
# per-feature units (in the FGB) vary via the JOIN. The `units: usd` below is
# only the fallback default (median_income) used if resolution ever fails.
normalize:
  crs: "EPSG:4326"
  units: usd
  quantity: acs_estimate

# --- output surface -------------------------------------------------------
output:
  layer_type: vector
  ext: fgb
  role: primary
  style:
    kind: reference
    geometry: polygon

# --- cache + payload gate -------------------------------------------------
cache:
  ttl_class: static-30d
payload_estimate:              # twin: clamp(area * 3.0, 0.02, 80.0)
  model: bbox_area
  mb_per_sq_deg: 3.0
  floor_mb: 0.02

# --- honesty: caveats + fallback -----------------------------------------
caveats:
  - "US-only; a bbox over ocean / outside the US -> header-only FGB (honest-empty)"
  - "missing ACS estimate or jam sentinel (<= -666666000) -> value=null (NEVER fabricated)"
  - "keyless (data.census.gov backend); optional CENSUS_API_KEY uses classic Data API as primary"

# corpus lifted from sibling corpus.yaml.

# --- LLM docstring (carried VERBATIM from the twin via inspect.getdoc;
# the sole source of the promoted FunctionDeclaration description + the
# retrieval-index document text -> indistinguishable from the twin). ---
docstring: |
  US Census ACS 5-year demographics as a census-tract choropleth FlatGeobuf.

  Joins authoritative U.S. census-tract geometry (Census TIGERweb, keyless)
  to ACS 5-year estimates (Census ``data.census.gov`` backend, keyless) by
  11-digit GEOID, returning a FlatGeobuf choropleth clipped to ``bbox``. The
  ``variable`` param maps friendly names (``median_income``, ``median_age``,
  ``median_home_value``, ``poverty_rate``, ``pct_renters``, ``pct_no_vehicle``)
  to ACS detailed-table codes; a raw ACS estimate code (``B19013_001E``) is
  also accepted. Generalizes the population-only fetchers to arbitrary
  demographics for vulnerability / environmental-justice analysis.

  **When to use:**
  - User asks for a specific demographic (income, age, home value, poverty,
    renters, car-free households) for an area, or "median income by tract".
  - Agent needs a demographic surface to intersect with a hazard footprint
    for exposure / equity analysis.

  **When NOT to use:**
  - For composited social-vulnerability *percentile ranks* -> ``fetch_cdc_svi``.
  - For a gridded population *raster* -> ``fetch_hrsl_population``.
  - For areas outside the U.S. -> ACS is U.S.-only; an empty FGB is returned.

  **Parameters:**
      bbox: ``(min_lon, min_lat, max_lon, max_lat)`` in EPSG:4326. Required;
          ``supports_global_query=False``. County-or-smaller extent. Example
          for Houston / Harris County TX: ``(-95.45, 29.65, -95.25, 29.85)``.
      variable: friendly name (see registry) or raw ACS estimate code.
          Default ``"median_income"``. Unknown -> ``CensusACSInputError``.
      year: ACS 5-year vintage end-year. Default ``2022``.

  **Returns:**
      ``LayerURI`` -> FlatGeobuf. Each feature is a Polygon (census tract) in
      EPSG:4326. Properties: ``geoid`` (str, 11-digit), ``name`` (str),
      ``state`` (str FIPS), ``county`` (str FIPS), ``variable`` (str),
      ``value`` (float|null), ``units`` (str). ``layer_type="vector"``,
      ``role="primary"``

  **Error types:**
      - ``CensusACSInputError``: bad bbox / unknown variable / nonexistent
        ACS table (retryable=False).
      - ``CensusACSUpstreamError``: TIGERweb or data.census.gov network / HTTP
        / parse failure (retryable=True).
      - ``CensusACSEmptyError``: no tracts in bbox (not raised by default --
        an empty FGB is returned instead).

  Cache: ``static-30d``, ``source_class="census_acs"``. Cache key is bbox
  (6 dp) + variable + year. No API key required (optional ``CENSUS_API_KEY``
  env var, if set, uses the classic Data API as primary with the keyless
  backend as fallback).
