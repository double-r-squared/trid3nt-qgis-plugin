# USACE National Inventory of Dams, opened on the user's map through QGIS's own
# ArcGIS FeatureServer provider (public ESRI Living Atlas mirror). Optional
# equality/floor WHERE clauses for hazard_potential, state and min_height_ft.
schema_version: v1

name: fetch_usace_dams
source_class: usace_nid_dams
error_prefix: USACE_DAMS
input_error_suffix: INPUT_INVALID
shape: record
supports_global_query: true

endpoints:
  data:
    url: "https://services2.arcgis.com/FiaPA4ga0iQKduv3/arcgis/rest/services/NID_v1/FeatureServer/0"
auth:
  mode: none
  user_agent: trid3nt_default

params:
  bbox: {type: bbox, required: true, quantize: round_6dp}
  hazard_potential: {type: enum, required: false, default: null, schema_optional: true,
                      values: [High, Significant, Low, Undetermined]}
  state: {type: str, required: false, schema_optional: true}
  min_height_ft: {type: float, required: false, schema_optional: true, min: 0.0}

ingest:
  access: qgis_provider
  qgis_provider:
    provider: arcgisfeatureserver
    uri: "crs='EPSG:4326' url='{url}'"
    mode: open
  where_clauses:
    - {template: "HAZARD_POTENTIAL='{hazard_potential}'", require: [hazard_potential]}
    - {template: "STATE='{state}'", require: [state]}
    - {template: "DAM_HEIGHT >= {min_height_ft:g}", require: [min_height_ft]}

normalize:
  crs: "EPSG:4326"

output:
  layer_type: record
  ext: json

cache:
  ttl_class: live-no-cache
payload_estimate:
  model: bbox_area
  mb_per_sq_deg: 0.0
  floor_mb: 0.0

caveats:
  - "USACE National Inventory of Dams, opened as a live map overlay through the public ESRI Living Atlas mirror; the authoritative geospatial.sec.usace.army.mil token endpoint is not reachable from a map overlay and is dropped"
  - "hazard_potential/state are single-value equality filters (STATE must match the NID STATE column form exactly); min_height_ft is a DAM_HEIGHT floor in feet; all three are applied server-side as the layer's subset"
  - "the layer is drawn by QGIS from the service, so its features are on the map but not in the case store and no analysis reads them"
  - "model-callable, not matched: infrastructure points, not one of the seventeen matched data classes"

docstring: |-
  USACE National Inventory of Dams (NID), added to the map.

  Opens NID dam point features from the public ESRI Living Atlas mirror as a
  live layer served by QGIS's own ArcGIS FeatureServer provider, drawn over
  the requested area. Carries the full NID attribute payload (identification,
  ownership, height, storage, hazard potential, condition, EAP status).

  **When to use:**
  - User asks about dams in a region ("what dams are upstream of X?", "show
    every high-hazard dam in California").
  - Visual context for a flood-modeling or dam-break workflow.

  **When NOT to use:**
  - To COMPUTE with dam attributes - intersect them with fields, rank by
    storage, feed a model. The overlay is drawn from the service and its
    features never reach the store; nothing downstream can read them.
  - For levees -> ``fetch_usace_levees``. For buildings -> a structure
    inventory fetcher. For non-US dams -> NID is US-only.
  - For live reservoir operations -> NID is a static inventory.

  **Parameters:**
      bbox: ``(min_lon, min_lat, max_lon, max_lat)`` in EPSG:4326. Required.
      hazard_potential: Optional exact NID hazard-potential match, one of
          ``"High"``, ``"Significant"``, ``"Low"``, ``"Undetermined"``.
      state: Optional exact NID ``STATE`` column match.
      min_height_ft: Optional minimum ``DAM_HEIGHT`` in feet.

  **Returns:**
      A record naming what was opened: the provider, the service uri behind
      the layer, the layer name and the bbox the map was taken to.
  **Error types:**
      - ``USACE_DAMSInputError``: bad bbox or filter value (retryable=False).
      - ``USACE_DAMSUpstreamError``: the provider's own text when it cannot
        open the service (retryable=True).

  Requires a live QGIS session: the layer is opened in the user's QGIS, so a
  headless or direct call refuses by name rather than returning nothing.

  ``supports_global_query=True``. No API key required.
