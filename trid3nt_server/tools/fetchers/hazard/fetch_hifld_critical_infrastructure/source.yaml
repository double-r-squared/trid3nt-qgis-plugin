# HIFLD critical-infrastructure points, opened on the user's map through
# QGIS's own ArcGIS FeatureServer provider: one facility_type, one service.
schema_version: v1

name: fetch_hifld_critical_infrastructure
source_class: hifld_critical_infrastructure
error_prefix: HIFLD_INFRA
input_error_suffix: INPUT_INVALID
shape: record
supports_global_query: false

endpoints:
  hospitals:
    url: "https://services2.arcgis.com/C8EMgrsFcRFL6LrL/arcgis/rest/services/Hospitals/FeatureServer/0"
  schools:
    url: "https://services2.arcgis.com/C8EMgrsFcRFL6LrL/arcgis/rest/services/Public_Schools/FeatureServer/0"
  fire_stations:
    url: "https://services2.arcgis.com/C8EMgrsFcRFL6LrL/arcgis/rest/services/Fire_Stations/FeatureServer/0"
  police:
    url: "https://services2.arcgis.com/C8EMgrsFcRFL6LrL/arcgis/rest/services/Local_Law_Enforcement_Locations/FeatureServer/0"
  power_plants:
    url: "https://services2.arcgis.com/C8EMgrsFcRFL6LrL/arcgis/rest/services/Power_Plants/FeatureServer/0"
auth:
  mode: none
  user_agent: trid3nt_default

params:
  bbox: {type: bbox, required: true, quantize: round_6dp}
  facility_type: {type: enum, required: true, lowercase: true,
                   values: [hospitals, schools, fire_stations, police, power_plants],
                   aliases: {hospital: hospitals, public_schools: schools,
                             fire: fire_stations, ems: fire_stations,
                             law_enforcement: police, power_plant: power_plants}}

ingest:
  access: qgis_provider
  qgis_provider:
    provider: arcgisfeatureserver
    uri: "crs='EPSG:4326' url='{url}'"
    mode: open
  endpoint_by_param: {param: facility_type, map: {hospitals: hospitals,
                       schools: schools, fire_stations: fire_stations,
                       police: police, power_plants: power_plants}}

normalize:
  crs: "EPSG:4326"

output:
  layer_type: record
  ext: json

cache:
  ttl_class: live-no-cache
payload_estimate:
  model: bbox_area
  mb_per_sq_deg: 0.0
  floor_mb: 0.0

caveats:
  - "HIFLD critical-infrastructure points via a public ArcGIS FeatureServer per facility_type, opened as a live map overlay; one facility_type per call, no cross-type union"
  - "the layer is drawn by QGIS from the service, so its features are on the map but not in the case store and no analysis reads them"
  - "US-only HIFLD"
  - "model-callable, not matched: critical-infrastructure points, not one of the seventeen matched data classes"

docstring: |-
  HIFLD critical-infrastructure points by facility type, added to the map.

  Opens national Homeland Infrastructure Foundation-Level Data (HIFLD) point
  facilities of one ``facility_type`` as a live layer served by QGIS's own
  ArcGIS FeatureServer provider, from a public, unauthenticated mirror.

  **When to use:**
  - "Where are the hospitals / schools / fire stations / police stations near
    [place]?"; "show critical infrastructure in this area".
  - Life-safety facility context for a flood / fire / surge footprint.

  **When NOT to use:**
  - To COMPUTE with the facility attributes - intersect them with fields,
    count by type, feed a model. The overlay is drawn from the service and
    its features never reach the store; nothing downstream can read them.
  - Dams -> ``fetch_usace_dams``. EPA-regulated facilities ->
    ``fetch_epa_frs_facilities``.
  - Non-US facilities (HIFLD is US-only). An amenity not in the supported
    set -> use an OSM Overpass fetcher.

  **Parameters:**
      bbox: ``(min_lon, min_lat, max_lon, max_lat)`` in EPSG:4326. Required.
      facility_type: One of ``"hospitals"``, ``"schools"``,
          ``"fire_stations"``, ``"police"``, ``"power_plants"`` (aliases
          accepted: ``"hospital"``, ``"public_schools"``, ``"fire"``,
          ``"ems"``, ``"law_enforcement"``, ``"power_plant"``).

  **Returns:**
      A record naming what was opened: the provider, the service uri behind
      the layer, the layer name and the bbox the map was taken to.
  **Error types:**
      - ``HIFLD_INFRAInputError``: unknown facility_type or bad bbox
        (retryable=False).
      - ``HIFLD_INFRAUpstreamError``: the provider's own text when it cannot
        open the service (retryable=True).

  Requires a live QGIS session: the layer is opened in the user's QGIS, so a
  headless or direct call refuses by name rather than returning nothing.

  ``supports_global_query=False``. No API key required.
