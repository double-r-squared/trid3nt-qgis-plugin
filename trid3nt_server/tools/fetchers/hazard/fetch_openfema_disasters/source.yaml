# FEMA disaster declarations: declared offset paging over the attribute feed; every
# declaration is a row of the layer with no geometry. One hook assembles the OData filter
# and one keeps each declaration whole; a county overlay is an operation over this table.
schema_version: v1
name: fetch_openfema_disasters
source_class: openfema_disasters
shape: vector-fgb
supports_global_query: false
error_prefix: OPENFEMA
input_error_suffix: INPUT_ERROR
empty_error_suffix: NO_DECLARATIONS
endpoints:
  data:
    url: https://www.fema.gov/api/open/v2/DisasterDeclarationsSummaries
auth:
  mode: none
  user_agent: trid3nt/0.1 (Hazard Modeling Agent; https://github.com/double-r-squared/trid3nt-qgis-plugin;
    agent@trid3nt.dev)
params:
  state_code:
    type: str
    required: false
    schema_optional: true
  bbox:
    type: bbox
    required: false
    schema_optional: true
    quantize: round_6dp
  incident_type:
    type: str
    required: false
    schema_optional: true
  start_year:
    type: int
    required: false
    schema_optional: true
hooks:
  build_request: openfema_disasters.build_request
  parse_response: openfema_disasters.parse_response
ingest:
  pagination:
    style: offset
    page_size: 1000
    stop_on_short_page: true
    row_cap: 12000
    max_pages: 25
  body:
    format: json
    rows_path: DisasterDeclarationsSummaries
normalize:
  crs: EPSG:4326
  units: declaration count
output:
  layer_type: vector
  ext: fgb
  role: primary
  style:
    kind: reference
    geometry: polygon
  emit_bbox: false
  keep_null_geometry: true
cache:
  ttl_class: semi-static-7d
payload_estimate:
  model: per_feature
  features_per_sq_deg: 30.0
  kb_per_feature: 1.0
  floor_mb: 0.01
  ceil_mb: 10.0
caveats:
- FEMA OpenFEMA DisasterDeclarationsSummaries, every declaration whole as a row with no geometry (one row per
  declaration and designated area, state-wide rows with fipsCountyCode 000 included); DR/EM/FM declarations
  1953-present. A county overlay is an operation over the table's fipsStateCode and fipsCountyCode. No declaration in
  scope -> OPENFEMA_NO_DECLARATIONS, never an empty success layer. US states + territories only.
- "model-callable, not matched: disaster-declaration records, not one of the seventeen matched data classes"
docstring: |-
  Fetch FEMA disaster declarations as a table of declarations, one row each.

  Retrieves real US federal disaster declarations (Major Disaster ``DR``,
  Emergency ``EM``, Fire-Management ``FM``) from the FEMA OpenFEMA API and
  returns every declaration whole, one row per declaration and designated
  area, under OpenFEMA's own field names. The rows carry no geometry: this is
  the **historical hazard-declaration record**, not a map overlay.

  When to use:
      - The user asks where or how often disasters have been federally declared
        ("which counties in Florida have had a disaster declared", "show me
        the FEMA hurricane declarations in Texas since 2017", "where have
        flood disasters been declared near here").
      - You want the historical record of FEMA declarations to frame a hazard
        study, or to count how many times a county has been declared (count
        the rows of one ``fipsStateCode`` + ``fipsCountyCode``).

  When NOT to use:
      - LIVE / active hazards right now -- use the live feeds: NWS active
        warnings, FIRMS / GOES active fire, MRMS precip. Declarations are the
        AFTER-THE-FACT federal record, not a real-time hazard.
      - MODELED hazard footprints (flood depth, plume, surge) -- use the
        modeling tools (``build_mesh``, ``run_solver``). This is a
        declaration record, not a physical hazard extent.
      - Flood-zone regulatory boundaries -- use ``fetch_fema_nfhl_zones`` (the
        NFHL flood-insurance-rate-map zones). That is a different FEMA product.
      - Non-US disasters -- this tool is US states + territories only
        (supports_global_query=False).

  Spatial selector (pass EXACTLY ONE):
      state_code: Optional 2-letter USPS state/territory code (e.g. ``"FL"``,
          ``"TX"``). PREFERRED for state-level asks -- one OpenFEMA query for
          that state.
      bbox: Optional ``(west, south, east, north)`` in EPSG:4326. The tool
          derives every state whose envelope intersects the bbox and queries
          OpenFEMA per state; a declaration is a row of a state and county
          code, so the bbox selects states and clips nothing. When both are
          given, ``state_code`` wins; when neither, ``OpenFemaInputError`` is
          raised.

  Optional filters:
      incident_type: Optional OpenFEMA incident type (e.g. ``"Hurricane"``,
          ``"Flood"``, ``"Severe Storm"``, ``"Tornado"``, ``"Fire"``,
          ``"Tropical Storm"``, ``"Earthquake"``, ``"Drought"``). Validated
          against the documented OpenFEMA enumeration; an unrecognized value
          raises ``OpenFemaInputError`` rather than silently returning empty.
      start_year: Optional lower-bound federal fiscal year (``fyDeclared``).
          E.g. ``start_year=2017`` restricts to declarations from FY2017 on.
          Omit for the full declaration history (FEMA records begin 1953).

  Returns:
      ``LayerURI`` pointing at a FlatGeobuf in the cache bucket
      (``s3://.../cache/semi-static-7d/openfema_disasters/<key>.fgb``):
      - ``layer_type="vector"``, ``role="primary"``, rows with no geometry.
      - Properties per declaration: every field OpenFEMA returns, under its
        own name (``femaDeclarationString``, ``disasterNumber``, ``state``,
        ``declarationType`` DR/EM/FM, ``declarationDate``, ``fyDeclared``,
        ``incidentType``, ``declarationTitle``, ``ihProgramDeclared`` /
        ``iaProgramDeclared`` / ``paProgramDeclared`` / ``hmProgramDeclared``,
        ``incidentBeginDate``, ``incidentEndDate``, ``fipsStateCode``,
        ``fipsCountyCode`` ("000" is state-wide), ``placeCode``,
        ``designatedArea``, ``region``, ``lastRefresh``, ``id``, ...).

  Fallback behaviour (data-source fallback norm): OpenFEMA is the sole
  declaration source. If no declaration is found in scope,
  ``OpenFemaNoDeclarationsError`` is raised -- never an empty success-shaped
  layer.

  Cache: ``ttl_class="semi-static-7d"``, ``source_class="openfema_disasters"``.
  Cache key is SHA-256 of the resolved selector (states + incident_type +
  start_year), so identical-scope calls within the week reuse it.

  Cross-tool dependencies:
      - Composes WITH: ``geocode_location``
        (place name -> bbox / state before this call),
        ``fetch_administrative_boundaries`` (county framing).
      - Distinct from: ``fetch_fema_nfhl_zones`` (NFHL flood zones -- a
        regulatory boundary, not a declaration record); the live-hazard feeds
        (NWS warnings, FIRMS / GOES fire, MRMS) -- declarations are historical.
      - Upstream source: FEMA OpenFEMA DisasterDeclarationsSummaries.

  Errors:
      - ``OpenFemaInputError``: no selector / bad bbox / bad state code / bad
        incident type / bad year (retryable=False).
      - ``OpenFemaUpstreamError``: OpenFEMA network / HTTP 5xx / bad body
        (retryable=True).
      - ``OpenFemaNoDeclarationsError``: no declaration in scope
        (retryable=False).


  Tier-1 free. No API key. ``supports_global_query=False`` (US + territories).
