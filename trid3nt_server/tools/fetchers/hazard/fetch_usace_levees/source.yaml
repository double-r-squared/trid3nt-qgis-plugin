# USACE National Levee Database, opened on the user's map through QGIS's own
# ArcGIS FeatureServer provider. endpoint_by_param routes the layer enum to
# its FeatureServer sub-layer, same map as the twin's coded routing.
schema_version: v1

name: fetch_usace_levees
source_class: usace_nld
error_prefix: USACE_LEVEES
input_error_suffix: INPUT_INVALID
shape: record
supports_global_query: true

endpoints:
  leveed_areas:
    url: "https://services2.arcgis.com/FiaPA4ga0iQKduv3/arcgis/rest/services/NLD2_PUBLIC_v1/FeatureServer/16"
  system_routes:
    url: "https://services2.arcgis.com/FiaPA4ga0iQKduv3/arcgis/rest/services/NLD2_PUBLIC_v1/FeatureServer/14"
  embankments:
    url: "https://services2.arcgis.com/FiaPA4ga0iQKduv3/arcgis/rest/services/NLD2_PUBLIC_v1/FeatureServer/10"
auth:
  mode: none
  user_agent: trid3nt_default

params:
  bbox:  {type: bbox, required: true, quantize: round_6dp}
  layer: {type: enum, required: false, default: leveed_areas,
          values: [leveed_areas, system_routes, embankments]}

ingest:
  access: qgis_provider
  qgis_provider:
    provider: arcgisfeatureserver
    uri: "crs='EPSG:4326' url='{url}'"
    mode: open
  endpoint_by_param:
    param: layer
    map: {leveed_areas: leveed_areas, system_routes: system_routes, embankments: embankments}

normalize:
  crs: "EPSG:4326"

output:
  layer_type: record
  ext: json

cache:
  ttl_class: live-no-cache
payload_estimate:
  model: bbox_area
  mb_per_sq_deg: 0.0
  floor_mb: 0.0

caveats:
  - "USACE National Levee Database (federally inspected levees) via a public ArcGIS FeatureServer, opened as a live map overlay; layer=leveed_areas|system_routes|embankments"
  - "the layer is drawn by QGIS from the service, so its features are on the map but not in the case store and no analysis reads them"
  - "US-only NLD; private / non-federal levees may not appear"
  - "model-callable, not matched: infrastructure lines/areas, not one of the seventeen matched data classes"

docstring: |-
  USACE National Levee Database (NLD), added to the map.

  Opens the US-authoritative inventory of federally inspected levee
  infrastructure as a live layer served by QGIS's own ArcGIS FeatureServer
  provider, from the public NLD service.

  **When to use:**
  - User asks "what levees protect [city]?" / "where are the levees in
    [state]?" / "show me the New Orleans levees".
  - Levee footprint context for a flood-modeling or breach-risk workflow.

  **When NOT to use:**
  - To COMPUTE with the levee attributes - intersect them with fields, feed
    a model. The overlay is drawn from the service and its features never
    reach the store; nothing downstream can read them.
  - Dam infrastructure -> ``fetch_usace_dams``. FEMA regulatory floodplain
    polygons -> ``fetch_fema_nfhl_zones``. Historical breach / failure case
    studies (publications, not a FeatureService).

  **Parameters:**
      bbox: ``(min_lon, min_lat, max_lon, max_lat)`` in EPSG:4326. Required.
      layer: One of ``"leveed_areas"`` (default; protected-area polygons),
          ``"system_routes"`` (centerline polylines), or ``"embankments"``
          (segment-level alignment polylines).

  **Returns:**
      A record naming what was opened: the provider, the service uri behind
      the layer, the layer name and the bbox the map was taken to.
  **Error types:**
      - ``USACE_LEVEESInputError``: bad bbox or layer (retryable=False).
      - ``USACE_LEVEESUpstreamError``: the provider's own text when it
        cannot open the service (retryable=True).

  Requires a live QGIS session: the layer is opened in the user's QGIS, so a
  headless or direct call refuses by name rather than returning nothing.

  ``supports_global_query=True``. No API key required.
