# NIFC WFIGS current fire perimeters, opened on the user's map through QGIS's
# own ArcGIS FeatureServer provider.
schema_version: v1

name: fetch_nifc_fire_perimeters
source_class: nifc_perimeters
error_prefix: NIFC_FIRE
input_error_suffix: INPUT_INVALID
shape: record
supports_global_query: true

endpoints:
  data:
    url: "https://services3.arcgis.com/T4QMspbfLg3qTGWY/arcgis/rest/services/WFIGS_Interagency_Perimeters_Current/FeatureServer/0"
auth:
  mode: none
  user_agent: trid3nt_default

params:
  bbox: {type: bbox, required: true, quantize: round_6dp}

ingest:
  access: qgis_provider
  qgis_provider:
    provider: arcgisfeatureserver
    uri: "crs='EPSG:4326' url='{url}'"
    mode: open

normalize:
  crs: "EPSG:4326"

output:
  layer_type: record
  ext: json

cache:
  ttl_class: live-no-cache
payload_estimate:
  model: bbox_area
  mb_per_sq_deg: 0.0
  floor_mb: 0.0

caveats:
  - "current active NIFC WFIGS perimeters only via a public ArcGIS FeatureServer, opened as a live map overlay (historic fires -> fetch_mtbs_burn_severity)"
  - "the layer is drawn by QGIS from the service, so its features are on the map but not in the case store and no analysis reads them"
  - "US-only; the status filter the old fetch body accepted queried the same 'Current' service regardless of its value and is dropped"
  - "model-callable, not matched: active-fire perimeter polygons, not one of the seventeen matched data classes"

docstring: |-
  Current NIFC WFIGS wildland fire perimeter polygons, added to the map.

  Opens the National Interagency Fire Center (NIFC) WFIGS Interagency
  Perimeters Current layer as a live overlay served by QGIS's own ArcGIS
  FeatureServer provider (federal + state + tribal agency data fused).

  **When to use:**
  - "Show every active wildfire in California right now."
  - Wildfire hazard-context overlay on a population or air-quality layer.

  **When NOT to use:**
  - To COMPUTE with the fire attributes - intersect them with fields, feed
    a model. The overlay is drawn from the service and its features never
    reach the store; nothing downstream can read them.
  - Historical wildfire perimeters (NIFC "Current" only carries active
    incidents; use ``fetch_mtbs_burn_severity``). Fire-danger or
    fire-weather forecasts. Satellite thermal anomaly detections (use
    ``fetch_firms_active_fire``).

  **Parameters:**
      bbox: ``(min_lon, min_lat, max_lon, max_lat)`` in EPSG:4326. Required.

  **Returns:**
      A record naming what was opened: the provider, the service uri behind
      the layer, the layer name and the bbox the map was taken to.
  **Error types:**
      - ``NIFC_FIREInputError``: bad bbox (retryable=False).
      - ``NIFC_FIREUpstreamError``: the provider's own text when it cannot
        open the service (retryable=True).

  Requires a live QGIS session: the layer is opened in the user's QGIS, so a
  headless or direct call refuses by name rather than returning nothing.

  ``supports_global_query=True``. No API key required.
