# EPA regulated-facility points, opened on the user's map through QGIS's own
# ArcGIS FeatureServer provider: one program, one MapServer layer, one uri -
# the old build_request/parse_response union of five layers into one FGB has
# no single-uri equivalent, so facility_program picks ONE layer per call.
schema_version: v1

name: fetch_epa_frs_facilities
source_class: epa_frs_facilities
error_prefix: EPA_FRS
input_error_suffix: INPUT_INVALID
shape: record
supports_global_query: false

endpoints:
  tri:
    url: "https://geopub.epa.gov/arcgis/rest/services/NEPAssist/NEPAVELayersPublic_fgdb/MapServer/15"
  water:
    url: "https://geopub.epa.gov/arcgis/rest/services/NEPAssist/NEPAVELayersPublic_fgdb/MapServer/16"
  hazwaste:
    url: "https://geopub.epa.gov/arcgis/rest/services/NEPAssist/NEPAVELayersPublic_fgdb/MapServer/17"
  air:
    url: "https://geopub.epa.gov/arcgis/rest/services/NEPAssist/NEPAVELayersPublic_fgdb/MapServer/18"
  brownfields:
    url: "https://geopub.epa.gov/arcgis/rest/services/NEPAssist/NEPAVELayersPublic_fgdb/MapServer/13"
  superfund:
    url: "https://geopub.epa.gov/arcgis/rest/services/NEPAssist/NEPAVELayersPublic_fgdb/MapServer/14"
auth:
  mode: none
  user_agent: trid3nt_default

params:
  bbox: {type: bbox, required: true, quantize: round_6dp}
  facility_program: {type: enum, required: true, lowercase: true,
                      values: [tri, water, hazwaste, air, brownfields, superfund],
                      aliases: {toxic_release: tri, toxics: tri, npl: superfund,
                                cercla: superfund, npdes: water, wastewater: water,
                                rcra: hazwaste, hazardous_waste: hazwaste,
                                air_emissions: air, brownfield: brownfields}}

ingest:
  access: qgis_provider
  qgis_provider:
    provider: arcgisfeatureserver
    uri: "crs='EPSG:4326' url='{url}'"
    mode: open
  endpoint_by_param: {param: facility_program, map: {tri: tri, water: water,
                       hazwaste: hazwaste, air: air, brownfields: brownfields,
                       superfund: superfund}}

normalize:
  crs: "EPSG:4326"

output:
  layer_type: record
  ext: json

cache:
  ttl_class: live-no-cache
payload_estimate:
  model: bbox_area
  mb_per_sq_deg: 0.0
  floor_mb: 0.0

caveats:
  - "EPA Facility Registry Service program-interest points via the public NEPAssist MapServer, opened as a live map overlay; facility_program selects ONE program layer (tri/water/hazwaste/air/brownfields/superfund) - the prior 'frs' union of five layers into one output has no single-uri equivalent, so a caller wanting all five opens each program in turn"
  - "the layer is drawn by QGIS from the service, so its features are on the map but not in the case store and no analysis reads them"
  - "model-callable, not matched: exposure-facility points, not one of the seventeen matched data classes"

docstring: |-
  EPA regulated-facility points for one program, added to the map.

  Opens EPA Facility Registry Service (FRS) program-interest point facilities
  for one ``facility_program`` as a live layer served by QGIS's own ArcGIS
  FeatureServer provider, from the public, unauthenticated EPA NEPAssist
  MapServer.

  **When to use:**
  - "Show EPA regulated facilities / TRI sites / Superfund sites near [place]".
  - Visual context for a chemical-source or exposure question inside a flood
    / fire / surge / plume footprint.

  **When NOT to use:**
  - To COMPUTE with the facility attributes - intersect them with fields,
    count by program, feed a model. The overlay is drawn from the service and
    its features never reach the store; nothing downstream can read them.
  - Every program layer at once - call this once per ``facility_program``
    of interest; there is no combined "all programs" overlay.
  - Life-safety facilities (hospitals / schools / fire / police / power) ->
    ``fetch_hifld_critical_infrastructure``. Dams -> ``fetch_usace_dams``.
  - Non-US facilities (FRS is US-only).

  **Parameters:**
      bbox: ``(min_lon, min_lat, max_lon, max_lat)`` in EPSG:4326. Required.
      facility_program: One of ``"tri"``, ``"water"``, ``"hazwaste"``,
          ``"air"``, ``"brownfields"``, ``"superfund"`` (aliases accepted:
          ``"toxic_release"``, ``"npl"``, ``"npdes"``, ``"rcra"``, etc.).
          Required -- there is no default union layer.

  **Returns:**
      A record naming what was opened: the provider, the service uri behind
      the layer, the layer name and the bbox the map was taken to.
  **Error types:**
      - ``EPA_FRSInputError``: unknown facility_program or bad bbox
        (retryable=False).
      - ``EPA_FRSUpstreamError``: the provider's own text when it cannot
        open the service (retryable=True).

  Requires a live QGIS session: the layer is opened in the user's QGIS, so a
  headless or direct call refuses by name rather than returning nothing.

  ``supports_global_query=False``. No API key required.
