# FEMA NFHL regulatory flood-zone polygons, opened on the user's map through
# QGIS's own ArcGIS FeatureServer provider (public MapServer, layer 28).
schema_version: v1

name: fetch_fema_nfhl_zones
source_class: fema_nfhl
error_prefix: FEMA_NFHL_ZONES
input_error_suffix: INPUT_INVALID
shape: record
supports_global_query: false

endpoints:
  data:
    url: "https://hazards.fema.gov/arcgis/rest/services/public/NFHL/MapServer/28"
auth:
  mode: none
  user_agent: trid3nt_default

params:
  bbox: {type: bbox, required: true, quantize: round_6dp}
  zone: {type: str, required: false, schema_optional: true}

ingest:
  access: qgis_provider
  qgis_provider:
    provider: arcgisfeatureserver
    uri: "crs='EPSG:4326' url='{url}'"
    mode: open
  where_clauses:
    - {template: "FLD_ZONE='{zone}'", require: [zone]}

normalize:
  crs: "EPSG:4326"

output:
  layer_type: record
  ext: json

cache:
  ttl_class: live-no-cache
payload_estimate:
  model: bbox_area
  mb_per_sq_deg: 0.0
  floor_mb: 0.0

caveats:
  - "FEMA NFHL regulatory flood-zone polygons via the public MapServer (layer 28), opened as a live map overlay; QGIS paginates the service itself so the deep-page / tile-refusal handling the old fetch body did no longer applies"
  - "zone is a single exact FLD_ZONE equality filter (e.g. AE, VE, X); a SFHA-vs-not distinction is a matter of the layer's own style once opened, not a fetch-time filter"
  - "the layer is drawn by QGIS from the service, so its features are on the map but not in the case store and no analysis reads them"
  - "model-callable, not matched: regulatory flood-zone polygons, not one of the seventeen matched data classes"

docstring: |-
  FEMA NFHL regulatory flood-zone polygons, added to the map.

  Opens the FEMA Map Service Center National Flood Hazard Layer (NFHL,
  layer 28) as a live map overlay served by QGIS's own ArcGIS FeatureServer
  provider. Carries the FEMA flood-zone semantic columns (``FLD_ZONE``,
  ``ZONE_SUBTY``, ``SFHA_TF``, ``STATIC_BFE``, ``V_DATUM``, ``DEPTH``,
  ``VELOCITY``, ``DFIRM_ID``, ``SOURCE_CIT``, ``GFID``).

  **When to use:**
  - User asks for the FEMA flood map, the regulatory floodplain, the
    100-year or 500-year floodplain, the Special Flood Hazard Area, FIRM
    zones, NFIP / flood-insurance rate zones, or the Base Flood Elevation.
  - Visual regulatory-flood context beside a hazard or exposure layer.

  **When NOT to use:**
  - To COMPUTE with the zone polygons - intersect them with fields, count
    area by class, feed a model. The overlay is drawn from the service and
    its features never reach the store; nothing downstream can read them.
  - Real-time / current flood EXTENT (NFHL is a regulatory static product).
  - Flood-insurance claims, disaster declarations, storm-surge forecasts,
    SLR projections - each is a separate source.

  **Parameters:**
      bbox: ``(min_lon, min_lat, max_lon, max_lat)`` in EPSG:4326. Required
          -- NFHL does not support a global query.
      zone: Optional exact ``FLD_ZONE`` match (e.g. ``"VE"``, ``"AE"``,
          ``"X"``). Omit to draw every zone.

  **Returns:**
      A record naming what was opened: the provider, the service uri behind
      the layer, the layer name and the bbox the map was taken to.
  **Error types:**
      - ``FEMA_NFHL_ZONESInputError``: bad bbox or zone (retryable=False).
      - ``FEMA_NFHL_ZONESUpstreamError``: the provider's own text when it
        cannot open the service (retryable=True).

  Requires a live QGIS session: the layer is opened in the user's QGIS, so a
  headless or direct call refuses by name rather than returning nothing.

  ``supports_global_query=False``. No API key required.
