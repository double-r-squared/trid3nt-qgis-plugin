# MTBS burn-severity polygons, opened on the user's map through QGIS's own
# ArcGIS FeatureServer provider, with an optional inclusive YEAR range.
schema_version: v1

name: fetch_mtbs_burn_severity
source_class: mtbs_burn_severity
error_prefix: MTBS
shape: record
supports_global_query: false

endpoints:
  data:
    url: "https://services2.arcgis.com/FiaPA4ga0iQKduv3/arcgis/rest/services/EDW_MTBS_v1/FeatureServer/0"
auth:
  mode: none
  user_agent: trid3nt_default

params:
  bbox: {type: bbox, required: true, quantize: round_6dp, error_suffix: BBOX_INVALID}
  year_range: {type: int_range, required: false, default: null, min: 1984, max: 2100,
               error_suffix: YEAR_RANGE_INVALID}

ingest:
  access: qgis_provider
  qgis_provider:
    provider: arcgisfeatureserver
    uri: "crs='EPSG:4326' url='{url}'"
    mode: open
  where_clauses:
    - {template: "YEAR >= {year_range[0]} AND YEAR <= {year_range[1]}", require: [year_range]}

normalize:
  crs: "EPSG:4326"

output:
  layer_type: record
  ext: json

cache:
  ttl_class: live-no-cache
payload_estimate:
  model: bbox_area
  mb_per_sq_deg: 0.0
  floor_mb: 0.0

caveats:
  - "MTBS historic burn-severity polygons via a public ArcGIS FeatureServer, opened as a live map overlay; CONUS+AK+HI+PR, 1984-present, fires >=500-1000 acres"
  - "year_range is an inclusive [start_year, end_year] server-side filter (start >= 1984); omitted draws all years"
  - "the layer is drawn by QGIS from the service, so its features are on the map but not in the case store and no analysis reads them"
  - "model-callable, not matched: historic burn-severity polygons, not one of the seventeen matched data classes"

docstring: |-
  MTBS historic burn-severity boundary polygons, added to the map.

  Opens the USFS/USGS MTBS (Monitoring Trends in Burn Severity) burned-area
  boundary polygons -- one polygon per fire event -- as a live layer served
  by QGIS's own ArcGIS FeatureServer provider, from the public MTBS service
  (EDW_MTBS_v1). MTBS covers CONUS + AK + HI + PR, 1984-present, for fires
  >=1000 acres in the West and >=500 acres in the East.

  **When to use:**
  - Post-fire hazard context: burn scars for debris flow, post-fire flood,
    or erosion risk visualization.
  - Wildfire history overlay: "show fires that burned in this area since
    2010."

  **When NOT to use:**
  - To COMPUTE with the fire attributes - intersect them with fields, feed
    a model. The overlay is drawn from the service and its features never
    reach the store; nothing downstream can read them.
  - Active or current-year fire perimeters (MTBS lags ~1 year; use
    ``fetch_nifc_fire_perimeters``).
  - Fires smaller than the MTBS minimum thresholds. Per-pixel burn-severity
    rasters (this returns polygon boundaries only). Fire-weather forecasts.

  **Parameters:**
      bbox: ``(min_lon, min_lat, max_lon, max_lat)`` in EPSG:4326. Required.
      year_range: Optional ``(start_year, end_year)`` inclusive, both
          integers, minimum start 1984. Omit to draw all years.

  **Returns:**
      A record naming what was opened: the provider, the service uri behind
      the layer, the layer name and the bbox the map was taken to.
  **Error types:**
      - ``MTBSInputError``: bad bbox or year_range (retryable=False).
      - ``MTBSUpstreamError``: the provider's own text when it cannot open
        the service (retryable=True).

  Requires a live QGIS session: the layer is opened in the user's QGIS, so a
  headless or direct call refuses by name rather than returning nothing.

  ``supports_global_query=False``. No API key required.
