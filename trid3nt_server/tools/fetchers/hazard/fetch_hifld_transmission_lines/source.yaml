# HIFLD electric power transmission lines, opened on the user's map through
# QGIS's own ArcGIS FeatureServer provider, with an optional VOLTAGE floor.
schema_version: v1

name: fetch_hifld_transmission_lines
source_class: hifld_transmission_lines
error_prefix: HIFLD_TRANSMISSION
input_error_suffix: INPUT_INVALID
shape: record
supports_global_query: false

endpoints:
  data:
    url: "https://services1.arcgis.com/Hp6G80Pky0om7QvQ/arcgis/rest/services/Electric_Power_Transmission_Lines/FeatureServer/0"
auth:
  mode: none
  user_agent: trid3nt_default

params:
  bbox: {type: bbox, required: true, quantize: round_6dp}
  min_voltage_kv: {type: float, required: false, default: null, min: 0.0}

ingest:
  access: qgis_provider
  qgis_provider:
    provider: arcgisfeatureserver
    uri: "crs='EPSG:4326' url='{url}'"
    mode: open
  where_clauses:
    - {template: "VOLTAGE >= {min_voltage_kv:g}", require: [min_voltage_kv]}

normalize:
  crs: "EPSG:4326"
  units: "kV"

output:
  layer_type: record
  ext: json

cache:
  ttl_class: live-no-cache
payload_estimate:
  model: bbox_area
  mb_per_sq_deg: 0.0
  floor_mb: 0.0

caveats:
  - "HIFLD electric power transmission lines via a public ArcGIS FeatureServer, opened as a live map overlay"
  - "min_voltage_kv is an optional nominal-voltage floor (kV) applied server-side as the layer's subset"
  - "the layer is drawn by QGIS from the service, so its features are on the map but not in the case store and no analysis reads them"
  - "US-only HIFLD; bulk transmission only, not last-mile distribution"
  - "model-callable, not matched: infrastructure lines, not one of the seventeen matched data classes"

docstring: |-
  HIFLD electric power transmission lines, added to the map.

  Opens national Homeland Infrastructure Foundation-Level Data (HIFLD)
  ``Electric Power Transmission Lines`` as a live layer served by QGIS's own
  ArcGIS FeatureServer provider, from a public, unauthenticated service.

  This is the LINE (power-grid backbone) complement to the POINT lifeline
  inventory in ``fetch_hifld_critical_infrastructure``.

  **When to use:**
  - "Where are the power transmission lines near [place]?"; "show the
    electric grid in this area"; "what high-voltage lines cross this
    footprint?".
  - Lifeline resilience context for a flood / fire / surge / earthquake
    footprint.

  **When NOT to use:**
  - To COMPUTE with the line attributes - intersect them with fields, feed
    a model. The overlay is drawn from the service and its features never
    reach the store; nothing downstream can read them.
  - Power PLANTS / hospitals / schools / fire / police POINTS ->
    ``fetch_hifld_critical_infrastructure``. Dams -> ``fetch_usace_dams``.
  - Non-US areas (HIFLD is US-only). Last-mile distribution lines (HIFLD is
    bulk transmission).

  **Parameters:**
      bbox: ``(min_lon, min_lat, max_lon, max_lat)`` in EPSG:4326. Required.
      min_voltage_kv: Optional nominal-voltage floor in kV. When set, only
          segments with ``VOLTAGE >= min_voltage_kv`` are drawn.

  **Returns:**
      A record naming what was opened: the provider, the service uri behind
      the layer, the layer name and the bbox the map was taken to.
  **Error types:**
      - ``HIFLD_TRANSMISSIONInputError``: bad bbox or min_voltage_kv
        (retryable=False).
      - ``HIFLD_TRANSMISSIONUpstreamError``: the provider's own text when it
        cannot open the service (retryable=True).

  Requires a live QGIS session: the layer is opened in the user's QGIS, so a
  headless or direct call refuses by name rather than returning nothing.

  ``supports_global_query=False``. No API key required.
