# NWS/NWPS river-forecast gauges. The request template, the row walk, the geometry and
# the column projection are declared below; the hooks that remain are the three steps
# that are not a row walk - the bbox-or-lid selector, the detail endpoint answering with
# ONE gauge where the list endpoint answers with many, and the two conditional detail
# families (flood-category thresholds, stageflow series) whose merge reduces a crest and
# packs two series. ingest.enrich is ONE keyed detail set with a field join, so this row
# keeps its enrich hook pair rather than growing that vocabulary for a single source.
schema_version: v1
name: fetch_nws_river_forecast
source_class: nws_nwps_river_forecast
shape: vector-fgb
supports_global_query: false
error_prefix: NWS_RIVER_FORECAST
input_error_suffix: INPUT_ERROR
endpoints:
  data:
    url: https://api.water.noaa.gov/nwps/v1/gauges
    query:
      srid: EPSG_4326
  detail:
    url_template: https://api.water.noaa.gov/nwps/v1/gauges/{gauge_id}
auth:
  mode: none
  user_agent: trid3nt/0.1 (Hazard Modeling Agent; https://github.com/double-r-squared/trid3nt-qgis-plugin;
    agent@trid3nt.dev)
params:
  bbox:
    type: bbox
    required: false
    schema_optional: true
    quantize: round_6dp
    error_suffix: BBOX_TOO_LARGE
  include_thresholds:
    type: bool
    required: false
    default: false
  gauge_id:
    type: str
    required: false
    schema_optional: true
  include_series:
    type: bool
    required: false
    default: false
gates:
  max_bbox_deg2: 2000.0
hooks:
  build_request: nws_river_forecast.build_request
  parse_response: nws_river_forecast.parse_response
  enrich_plan: nws_river_forecast.enrich_plan
  enrich_merge: nws_river_forecast.enrich_merge
ingest:
  chained:
    max_detail_fetches: 100
  endpoint_select:
    param: gauge_id
    present: detail
    absent: data
  request:
    params:
      bbox.xmin: '{bbox[0]}'
      bbox.ymin: '{bbox[1]}'
      bbox.xmax: '{bbox[2]}'
      bbox.ymax: '{bbox[3]}'
  body:
    format: json
    rows_path: gauges
    geometry:
      kind: point
      lon: longitude
      lat: latitude
  geometry_filter:
    geom_types: [Point]
    require_finite: true
  column_map:
    lid: {from: lid, kind: str}
    usgs_id: {from: usgsId, kind: str}
    name: {from: name, kind: str}
    rfc: {from: rfc.abbreviation, kind: str}
    wfo: {from: wfo.abbreviation, kind: str}
    state: {from: state.abbreviation, kind: str}
    flood_category:
      from: status.observed.floodCategory
      kind: lookup
      table: {no_flooding: no_flood}
      default_template: '{key}'
    fcst_flood_category:
      from: status.forecast.floodCategory
      kind: lookup
      table: {no_flooding: no_flood}
      default_template: '{key}'
    obs_valid_time: {from: status.observed.validTime, kind: str}
    fcst_valid_time: {from: status.forecast.validTime, kind: str}
    fcst_crest_time: {from: fcst_crest_time, kind: str}
    obs_series_json: {from: obs_series_json, kind: str}
    fcst_series_json: {from: fcst_series_json, kind: str}
    obs_stage_ft: {from: status.observed.primary, kind: float, null_below: -999.0}
    obs_flow_kcfs: {from: status.observed.secondary, kind: float, null_below: -999.0}
    fcst_stage_ft: {from: status.forecast.primary, kind: float, null_below: -999.0}
    fcst_flow_kcfs: {from: status.forecast.secondary, kind: float, null_below: -999.0}
    action_stage_ft: {from: flood.categories.action.stage, kind: float, null_below: -999.0}
    minor_stage_ft: {from: flood.categories.minor.stage, kind: float, null_below: -999.0}
    moderate_stage_ft: {from: flood.categories.moderate.stage, kind: float, null_below: -999.0}
    major_stage_ft: {from: flood.categories.major.stage, kind: float, null_below: -999.0}
    fcst_crest_stage_ft: {from: fcst_crest_stage_ft, kind: float, null_below: -999.0}
  empty:
    code: NO_GAUGES
    message: >-
      No NWS river/forecast gauges (AHPS/NWPS) found in scope. The NWPS gauges service
      returned zero forecast points: this area is not on a forecast river reach.
normalize:
  crs: EPSG:4326
  units: ft (river stage) + flood category
output:
  layer_type: vector
  ext: fgb
  role: primary
  style:
    kind: reference
    geometry: point
  emit_bbox: true
  bbox_from_features:
    pad: 0.05
cache:
  ttl_class: dynamic-1h
payload_estimate:
  model: per_feature
  features_per_sq_deg: 15.0
  kb_per_feature: 0.4096
  floor_mb: 0.001
coverage:
- data_class: water level series
  kind: predicted
  reach_km: 25
  extent:
    kind: stations
    rings:
      - [[-125.0, 24.0], [-66.0, 24.0], [-66.0, 50.0], [-125.0, 50.0]]
      - [[-172.0, 51.0], [-129.0, 51.0], [-129.0, 72.0], [-172.0, 72.0]]
      - [[-161.0, 18.0], [-154.0, 18.0], [-154.0, 23.0], [-161.0, 23.0]]
      - [[-68.5, 17.0], [-64.0, 17.0], [-64.0, 19.0], [-68.5, 19.0]]
      - [[144.0, 13.0], [146.5, 13.0], [146.5, 21.0], [144.0, 21.0]]
      - [[-171.5, -15.0], [-169.0, -15.0], [-169.0, -13.0], [-171.5, -13.0]]
    note: NWS/NWPS (AHPS) river-forecast gauges over the US and its territories
    discover: bbox
  window:
    series: true
    cadence: 15-min observed samples, 6-hour forecast cycles
  datum: null
  units:
    fcst_stage_ft: ft
    fcst_series_json: record
  value_column: fcst_stage_ft
  series_column: fcst_series_json
- data_class: discharge series
  kind: predicted
  reach_km: 25
  extent:
    kind: stations
    rings:
      - [[-125.0, 24.0], [-66.0, 24.0], [-66.0, 50.0], [-125.0, 50.0]]
      - [[-172.0, 51.0], [-129.0, 51.0], [-129.0, 72.0], [-172.0, 72.0]]
      - [[-161.0, 18.0], [-154.0, 18.0], [-154.0, 23.0], [-161.0, 23.0]]
      - [[-68.5, 17.0], [-64.0, 17.0], [-64.0, 19.0], [-68.5, 19.0]]
      - [[144.0, 13.0], [146.5, 13.0], [146.5, 21.0], [144.0, 21.0]]
      - [[-171.5, -15.0], [-169.0, -15.0], [-169.0, -13.0], [-171.5, -13.0]]
    note: NWS/NWPS (AHPS) river-forecast gauges over the US and its territories
    discover: bbox
  window:
    series: true
    cadence: 15-min observed samples, 6-hour forecast cycles
  datum: null
  units:
    fcst_flow_kcfs: kcfs
    fcst_series_json: record
  value_column: fcst_flow_kcfs
  series_column: fcst_series_json

caveats:
- NWS/NWPS (AHPS) river-forecast gauges with observed + forecast stage and flood category.
  Optional per-gauge threshold + stageflow-series enrichment (bounded, best-effort). A bbox with
  no forecast gauge -> a typed NO_GAUGES empty answer; a named lid that does not exist ->
  a typed input error. No API key.
docstring: "Fetch NWS river-forecast gauges + flood categories as a Point FlatGeobuf.\n\nRetrieves the\
  \ NWS / National Water Prediction Service (AHPS/NWPS) river\nforecast points inside ``bbox`` and returns\
  \ one Point feature per gauge,\neach carrying:\n\n  - the OBSERVED river stage (``obs_stage_ft``) and\
  \ flow (``obs_flow_kcfs``),\n  - the FORECAST river stage (``fcst_stage_ft``) and flow (``fcst_flow_kcfs``),\n\
  \  - the NWS **flood category** for both observed (``flood_category``) and\n    forecast (``fcst_flood_category``):\
  \ one of ``no_flood`` / ``action`` /\n    ``minor`` / ``moderate`` / ``major`` (or an operational state\
  \ such as\n    ``not_defined`` / ``out_of_service`` when the gauge has no category),\n  - the gauge\
  \ identity (``lid``, ``usgs_id``, ``name``, ``rfc``, ``wfo``,\n    ``state``) and the observed/forecast\
  \ valid times.\n\nThis is the flood-warning surface: USGS NWIS (``fetch_usgs_nwis_gauges``) is\nthe\
  \ raw instrument record and NWM (``fetch_noaa_nwm_streamflow``) is modeled\nreach flow; this tool is\
  \ the NWS forecast + flood-category source.\n\nArgs:\n    bbox: ``(west, south, east, north)`` in EPSG:4326.\
  \ REQUIRED unless\n        ``gauge_id`` is given.\n    include_thresholds: when True, fetch each gauge's\
  \ flood-category\n        threshold stages (``action_stage_ft`` / ``minor_stage_ft`` /\n        ``moderate_stage_ft``\
  \ / ``major_stage_ft``, ft) via a per-gauge\n        detail call (bounded to the first ~60 gauges).\
  \ OFF by default to\n        keep the tool a single HTTP request. Always ON in ``gauge_id``\n      \
  \  mode (the detail body carries the thresholds for free).\n    gauge_id: Optional NWS location id (lid,\
  \ e.g. ``\"CIDI4\"`` - NOT a\n        USGS site number) selecting a SINGLE gauge via the NWPS detail\n\
  \        endpoint; ``bbox`` is then optional/ignored. Use a bbox query\n        first to discover lids.\n\
  \    include_series: when True, fetch each gauge's ``/stageflow`` observed\n        + forecast time\
  \ series (bounded to the first ~12 gauges) and add:\n        ``fcst_crest_stage_ft`` / ``fcst_crest_time``\
  \ (the forecast CREST\n        - the max forecast stage and when it occurs) plus\n        ``obs_series_json``\
  \ (most-recent ~96 observed points) and\n        ``fcst_series_json`` (full forecast series) as compact\n\
  \        column-oriented JSON strings ``{\"t\": [...], \"stage_ft\": [...],\n        \"flow_kcfs\":\
  \ [...]}`` for charting. OFF by default.\n\nReturns:\n    A vector ``LayerURI`` (FlatGeobuf, Point,\
  \ EPSG:4326).\n\nRaises:\n    NwsRiverForecastInputError: bbox and gauge_id both missing / malformed.\n\
  \    NwsRiverForecastBboxTooLargeError: bbox implausibly large.\n    NwsRiverForecastNoGaugesError:\
  \ zero forecast gauges in the bbox, or\n        an unknown gauge_id.\n    NwsRiverForecastUpstreamError:\
  \ NWPS API / network failure.\n\nTier-1 free. No API key."
