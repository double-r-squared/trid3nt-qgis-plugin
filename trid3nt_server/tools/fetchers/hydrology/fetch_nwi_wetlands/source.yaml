schema_version: v1
name: fetch_nwi_wetlands
source_class: nwi_wetlands
error_prefix: NWI_WETLANDS
input_error_suffix: INPUT_INVALID
shape: vector-fgb
supports_global_query: false
endpoints:
  data:
    url: https://fwspublicservices.wim.usgs.gov/wetlandsmapservice/rest/services/Wetlands/MapServer/0/query
auth:
  mode: none
  user_agent: trid3nt/0.1 (Hazard Modeling Agent; https://github.com/double-r-squared/trid3nt-qgis-plugin;
    agent@trid3nt.dev)
params:
  bbox:
    type: bbox
    required: true
    quantize: round_6dp
ingest:
  access: ogr
  ogr:
    driver: ESRIJSON
    # The public MapServer answers a machine User-Agent with the WAF's HTML
    # challenge; this trio is what gets JSON past it.
    headers:
      User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko)
        Chrome/120.0 Safari/537.36 trid3nt/0.1 (Hazard Modeling Agent; agent@trid3nt.dev)
      Accept: application/json, text/plain, */*
      Referer: https://www.fws.gov/program/national-wetlands-inventory
  # Layer 0 is a join, so every column arrives table-prefixed; these three are the
  # published spec of this row.
  column_map:
    attribute:    {from: "NWI_Wetland_Codes.ATTRIBUTE"}
    wetland_type: {from: "Wetlands.WETLAND_TYPE"}
    acres:        {from: "Wetlands.ACRES"}
normalize:
  crs: EPSG:4326
output:
  layer_type: vector
  ext: fgb
  role: context
  style:
    kind: reference
    geometry: polygon
  emit_bbox: false
cache:
  ttl_class: static-30d
payload_estimate:
  model: per_feature
  features_per_sq_deg: 1024.0
  kb_per_feature: 1.0
  floor_mb: 0.05
  ceil_mb: 50.0
caveats:
- USFWS National Wetlands Inventory polygons via the public MapServer (layer 0), geojson with WAF headers,
  prefix-strip normalizer. US + territories; bbox required. Vegetated/classified wetlands, NOT open water
  (use fetch_nhd_waterbodies).
docstring: |-
  USFWS National Wetlands Inventory (NWI) wetland polygons as a vector layer.

  ROUTING -- use this when the user wants WETLAND EXTENT / boundaries: "show
  the wetlands here", "map the marshes / swamps / bogs", "NWI wetlands",
  "Cowardin wetland classes", "freshwater emergent / forested wetlands",
  "estuarine wetlands", or needs wetland polygons to overlay on / intersect
  with a hazard footprint. KEY-FREE, US + territories, authoritative USFWS
  source.

  Prefer THIS over:
  - ``fetch_nhd_waterbodies`` -- that returns OPEN-WATER polygons (lakes,
    ponds, reservoirs); this returns VEGETATED / classified WETLANDS. Fetch
    both when the user wants "all water + wetland habitat".
  - ``fetch_jrc_global_surface_water`` -- that is a global surface-water RASTER
    (occurrence %), not classified wetland polygons.
  - ``fetch_surface_water_ndwi`` -- that CV-vectorizes one water body from imagery;
    NWI is the pre-mapped national inventory.
  Do NOT use for: FEMA regulatory flood zones (``fetch_fema_nfhl_zones``),
  administrative boundaries (``fetch_administrative_boundaries``), or soil types
  (``fetch_soilgrids`` / ``fetch_statsgo_soils``).

  Parameters:
      bbox: ``(min_lon, min_lat, max_lon, max_lat)`` in EPSG:4326. REQUIRED --
          NWI does not support a global query (national-scale polygon corpus).
          Recommended <= ~1 deg on a side; larger envelopes risk the
          100k-feature pagination ceiling.

  Returns:
      ``LayerURI`` (``layer_type="vector"``, ``role="context"``, ``units=None``)
      pointing at a FlatGeobuf with per-polygon columns:
          attribute     (str) -- NWI code (e.g. "L1UBHx", "PFO1A")
          wetland_type  (str) -- Cowardin type (e.g. "Lake", "Freshwater
                                  Forested/Shrub Wetland", "Estuarine and
                                  Marine Wetland")
          acres         (float) -- polygon area in acres (from the source)
      An empty bbox over open ocean / an unmapped area returns a valid
      0-feature FlatGeobuf (NOT an error). An upstream failure raises
      ``NWIWetlandsUpstreamError(retryable=True)``; a non-empty layer is never
      fabricated.
