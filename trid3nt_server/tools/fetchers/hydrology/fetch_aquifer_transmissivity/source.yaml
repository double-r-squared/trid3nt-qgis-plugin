# Router source spec: staged-dataset direct_window over the Zell & Sanford 2020
# CONUS transmissivity raster, converted to a COG by
# scripts/stage_zell_sanford_groundwater.py. The s3:// endpoint names bucket/key
# only -- the transport resolves the host from the active object-store endpoint
# at read time. ADR 0298 Decision 7 parked this spec (NormalizeSpec.quantity is
# a single static stamp, so transmissivity could not ride fetch_aquifer_thickness
# without mislabelling a m2/day layer as a saturated thickness); NATE ruled
# REGISTER, so this spec gives it its own name, units and style ramp.
schema_version: v1

name: fetch_aquifer_transmissivity
source_class: aquifer_transmissivity
error_prefix: AQUIFER_TRANSMISSIVITY
input_error_suffix: INPUT_INVALID
empty_error_suffix: EMPTY
shape: raster-cog
supports_global_query: false

endpoints:
  data:
    url: "s3://trid3nt-cache/staged/zell_sanford_groundwater/zellsanford2020-v1/transmissivity_m2_day.tif"
auth:
  mode: none
  user_agent: "trid3nt/0.1 (Hazard Modeling Agent; https://github.com/double-r-squared/trid3nt-qgis-plugin; agent@trid3nt.dev)"

params:
  bbox: {type: bbox, required: true, quantize: round_6dp}

gates:
  conus_only: true
  # The staged grid's REAL bounds, read off the object itself. Identical to
  # fetch_water_table_depth's and fetch_aquifer_thickness's: all three products
  # come off the same model grid.
  conus_bbox: [-127.873333, 23.235556, -65.362222, 51.546667]

ingest:
  access: direct_window
  round_pixel_window: true
  nodata_gate: true

normalize:
  crs: "EPSG:4326"
  orientation: north_up
  units: m2/day
  quantity: aquifer_transmissivity

output:
  layer_type: raster
  ext: tif
  role: primary
  emit_bbox: true
  style:
    kind: continuous
    units: m^2/day
    label: Surficial aquifer transmissivity (modelled)
    scale:
      policy: fixed
      range: [1, 1000]
      transform: linear
  # A calibrated model output, not a pumping-test measurement.
  display_name: "Surficial aquifer transmissivity (modelled)"

cache:
  ttl_class: static-30d
payload_estimate:
  model: bbox_area
  # 1/450 deg posting: 450*450 float32 cells per square degree = 0.81 MB.
  mb_per_sq_deg: 0.81
  floor_mb: 0.01

caveats:
  - "CONUS ONLY -- the model stops at the conterminous US border; an AOI outside the staged envelope raises AQUIFER_TRANSMISSIVITY_INPUT_INVALID naming it. Alaska, Hawaii, Puerto Rico and all territories are off the grid."
  - "This is the release's HEADLINE PEST-calibrated field: the 75 subdomain groundwater-flow models were calibrated against long-term average water levels, and the published transmissivity is the converged solution's post-processed output, not an input the models were handed. It is not an independent measurement of any single well or borehole."
  - "LONG-TERM AVERAGE steady state driven by 1985-2015 mean recharge -- it resolves no season, drought, or pumping response."
  - "TRANSMISSIVITY IS LOWER IN THE WEST THAN THE EAST, on the MEDIAN: CONUS-wide, the median west of 100W is far below the median east of 100W (the paper's own headline regional finding). Do not read this off the MEAN -- a handful of western alluvial basins run past 100,000 m2/day and pull the western mean above the eastern one; the median is where the paper's claim actually shows."
  - "SURFICIAL/UNCONFINED system only: this is the shallow model's transmissivity, not the transmissivity of any deep or confined unit. It says nothing about the Ogallala, the Floridan, or any named confined aquifer."
  - "T = K x b: this is the numerator fetch_aquifer_thickness divides by the model's own hydraulic-conductivity mosaic to recover saturated thickness. A cell where this reads near zero is a near-dry or very-low-conductivity model cell, not a data gap."
  - "Off the model's active domain the raster is NODATA and the read raises AQUIFER_TRANSMISSIVITY_EMPTY -- the same masking as fetch_water_table_depth and fetch_aquifer_thickness (they share one cleaning rule): a cell whose published transmissivity is negative is masked in every product built from this release, since T = K * b with K > 0 and b >= 0 makes a negative T impossible."

docstring: |-
  Effective transmissivity of the shallow (surficial, unconfined) groundwater
  system across the contiguous US.

  **What it does:** Windowed read of a staged CONUS transmissivity raster to a
  CRS-tagged GeoTIFF over the requested bbox. Pixel values are M2/DAY --
  transmissivity, the product of hydraulic conductivity and saturated
  thickness (T = K x b), which governs how readily groundwater moves
  horizontally through the shallow system. This is the USGS Zell & Sanford
  (2020) release's headline PEST-calibrated field: 75 steady-state
  groundwater-flow models of the shallow groundwater system at 250 m,
  calibrated against
  long-term average water levels in observation wells, perennial streams and
  mapped wetlands.

  **When to use:**
  - Answering "how transmissive is the shallow aquifer here", "how easily does
    groundwater move through this area", "what is the shallow-system
    transmissivity for this county".
  - Comparing regional groundwater flow capacity: the release's own headline
    finding is that transmissivity runs far LOWER in the western CONUS than
    the eastern CONUS on the median (a handful of high-transmissivity western
    alluvial basins invert this on the mean, so compare medians).
  - Setting up or sanity-checking a regional groundwater model: T = K x b, so
    this is a consistency check against ``fetch_aquifer_thickness`` and a
    hydraulic-conductivity estimate, or a direct NPF/LPF input.
  - Screening for groundwater contaminant transport or well-yield potential at
    a regional (not site) scale -- higher transmissivity means faster lateral
    spread and higher sustainable yield, all else equal.

  **When NOT to use:**
  - DO NOT use outside the contiguous US -- raises
    ``AQUIFER_TRANSMISSIVITY_INPUT_INVALID``.
  - DO NOT use for a NAMED or CONFINED aquifer (Ogallala/High Plains, Floridan,
    Gulf Coast, any deep unit). This is the surficial system only.
  - DO NOT read the west-vs-east claim off a MEAN -- read it off the median;
    the western tail is heavy.
  - DO NOT use for a date, season, drought, or pumping response -- one
    long-term-average steady state.
  - DO NOT treat a single pixel as a pumping-test transmissivity for a specific
    well. It is a regional model value at 250 m resolution.

  **Parameters:**
  - ``bbox`` (tuple[float, float, float, float]): ``(min_lon, min_lat,
    max_lon, max_lat)`` in EPSG:4326. Required. Example for Story County, Iowa:
    ``(-93.70, 41.86, -93.20, 42.21)``.

  **Returns:** A ``LayerURI`` pointing at a GeoTIFF in the cache bucket.
  ``layer_type="raster"``, ``role="primary"``, ``units="m2/day"``,
  ``quantity="aquifer_transmissivity"``. EPSG:4326, float32, NaN nodata,
  1/450 degree cells (about 247 m) from the native 250 m Albers model grid.

  **Cross-tool dependencies:**
  - Upstream: ``geocode_location`` or ``fetch_admin_boundaries`` for the bbox.
  - Pairs with: ``fetch_aquifer_thickness`` (T divided by this model's own K
    mosaic recovers saturated thickness -- same model, same grid),
    ``fetch_water_table_depth`` (the top of the saturated column this
    transmissivity is measured over), ``fetch_groundwater_recharge`` (the flux
    that sustains the flow this transmissivity governs).
  - Downstream: groundwater flow model setup, regional flow-capacity
    comparison, and water-budget analysis in the python playground.
