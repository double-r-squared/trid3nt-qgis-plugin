# NHD waterbodies (NHDPlus HR, MapServer layer 9), opened on the user's map
# through QGIS's own ArcGIS FeatureServer provider. The twin's medium-resolution
# fallback endpoint served the FETCHED store; mode open opens the primary
# service only, since a provider-open failure has no in-band retry here.
schema_version: v1

name: fetch_nhd_waterbodies
source_class: nhd_waterbodies
input_error_suffix: INPUT_INVALID
shape: record
supports_global_query: false

endpoints:
  data:
    url: "https://hydro.nationalmap.gov/arcgis/rest/services/NHDPlus_HR/MapServer/9"

auth:
  mode: none
  user_agent: trid3nt_default

params:
  bbox: {type: bbox, required: true, quantize: round_6dp}

ingest:
  access: qgis_provider
  qgis_provider:
    provider: arcgisfeatureserver
    uri: "crs='EPSG:4326' url='{url}'"
    mode: open

normalize:
  crs: "EPSG:4326"

output:
  layer_type: record
  ext: json

cache:
  ttl_class: live-no-cache
payload_estimate:
  model: bbox_area
  mb_per_sq_deg: 0.0
  floor_mb: 0.0

caveats:
  - "model-callable, not matched: a many-feature network layer is not the one domain a hydrography row returns, so it carries no coverage row"
  - "USGS NHD open-water polygons (lakes/ponds/reservoirs) via NHDPlus HR; vegetated wetlands -> fetch_nwi_wetlands"
  - "the layer is drawn by QGIS from the service, so its features are on the map but not in the case store and no analysis reads them"
  - "opens the PRIMARY NHDPlus HR service only; the medium-resolution mirror the fetch-and-store twin fell back to has no place in a single provider-open call"

docstring: |-
  USGS NHD waterbody polygons (lakes / ponds / reservoirs), added to the map.

  Opens NHDPlus HR open-water polygons as a live map overlay served by
  QGIS's own ArcGIS FeatureServer provider. KEY-FREE, US + territories,
  authoritative USGS National Hydrography Dataset.

  **When to use:**
  - "Show the lakes / ponds / reservoirs here", "map the water bodies",
    "which lakes are in this area".
  - Visual context beside a hazard footprint.

  **When NOT to use:**
  - To COMPUTE with the polygons - intersect them with fields, an area
    figure. The overlay is drawn from the service and its features never
    reach the store; nothing downstream can read them.
  - ``fetch_nhdplus_nldi_navigate`` -- that navigates the FLOWLINE (river/
    stream LINE) network; this returns waterbody POLYGONS.
  - ``fetch_nwi_wetlands`` -- that returns VEGETATED / classified wetlands;
    this returns OPEN water.
  - Coastal shoreline (``fetch_topobathy``), stream gauges
    (``fetch_usgs_nwis_gauges``), or a modeled flood extent.

  **Parameters:**
      bbox: ``(min_lon, min_lat, max_lon, max_lat)`` in EPSG:4326. Required.

  **Returns:**
      A record naming what was opened: the provider, the service uri behind
      the layer, the layer name and the bbox the map was taken to.
  **Error types:**
      - ``NHD_WATERBODIESInputError``: bad bbox (retryable=False).
      - ``NHD_WATERBODIESUpstreamError``: the provider's own text when it
        cannot open the service (retryable=True).

  Requires a live QGIS session: the layer is opened in the user's QGIS, so a
  headless or direct call refuses by name rather than returning nothing.

  ``supports_global_query=False``. No API key required.
