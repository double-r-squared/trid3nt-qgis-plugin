# NOT a pygeohydro delegate: the EHydro class's backing ArcGIS FeatureServer answers
# {"error": {"code": 500, "message": "Service not found."}} to a direct GET, so a
# delegate over it cannot be authored or verified against anything live.
# USACE eHydro: one ArcGIS layer indexes every published survey, and each survey's
# own ZIP carries the measured soundings in its geodatabase. The index query, the
# ZIP read and the per-survey join are one delegate's socket work, so no executor
# phase is added for one source.
schema_version: v1

name: fetch_ehydro_surveys
source_class: ehydro_surveys
error_prefix: EHYDRO
input_error_suffix: INPUT_INVALID
empty_error_suffix: NO_SURVEY
shape: vector-fgb
supports_global_query: false

endpoints:
  # Documentary for the ZIP host (the delegate owns the socket); the index query
  # is the one the delegate builds its request from.
  index:
    url: "https://services7.arcgis.com/n1YM8pTrFmm7L4hs/arcgis/rest/services/eHydro_Survey_Data/FeatureServer/0/query"
  surveys:
    url: "https://ehydroprod.blob.core.usgovcloudapi.net/ehydro-surveys"
auth:
  mode: none
  user_agent: trid3nt_default

params:
  bbox: {type: bbox, required: true, quantize: round_6dp, error_suffix: BBOX_INVALID}
  since:
    type: iso_date
    schema_optional: true

gates:
  max_bbox_deg2: 1.0

ingest:
  access: library_delegate
  delegate:
    library: ehydro_survey_zip
    # The shared transport owns the socket, its per-operation timeout and the
    # retry authority; this states that timeout rather than a second one.
    timeout_s: 60.0
  properties:
    - part
    - survey_id
    - survey_date
    - district
    - feature_name
    - survey_type
    - vertical_datum
    - source_uom
    - depth_below_datum_m
    - sounding_count
    - datum_offset_m
    - datum_offset_frame

hooks:
  delegate: ehydro.read
  delegate_validate: ehydro.validate

normalize:
  crs: "EPSG:4326"
  units: m
  quantity: depth_below_datum

output:
  layer_type: vector
  ext: fgb
  role: primary
  display_name: "USACE eHydro channel survey"
  bbox_from_features:
    pad: 0.002
  style:
    kind: continuous
    geometry: point
    ramp: ylgnbu
    units: m
    label: "Depth below survey datum"

cache:
  ttl_class: semi-static-7d
payload_estimate:
  model: bbox_area
  mb_per_sq_deg: 200.0
  floor_mb: 0.2
  ceil_mb: 50.0

coverage:
-   data_class: bathymetry
    kind: measured
    extent:
      kind: surface
      rings:
      - [[-125.0, 24.0], [-66.0, 24.0], [-66.0, 50.0], [-125.0, 50.0]]
      - [[-172.0, 51.0], [-129.0, 51.0], [-129.0, 72.0], [-172.0, 72.0]]
      - [[-161.0, 18.0], [-154.0, 18.0], [-154.0, 23.0], [-161.0, 23.0]]
      - [[-68.5, 17.0], [-64.0, 17.0], [-64.0, 19.0], [-68.5, 19.0]]
      - [[144.0, 13.0], [146.5, 13.0], [146.5, 21.0], [144.0, 21.0]]
      - [[-171.5, -15.0], [-169.0, -15.0], [-169.0, -13.0], [-171.5, -13.0]]
      note: USACE navigation channels only - the dredged prism, not the whole water
        surface, so a domain is always partly covered and a reach with no federal
        navigation project has none at all
    window:
      series: false
    resolution_m: 1.0
    # Each survey states its OWN zero (CRD on the Willamette, LWD on the lakes,
    # MLLW on a coast, NAVD88 elsewhere), so no one word answers for the source:
    # the datum rides on every row from the survey's own points, and a survey
    # whose points state none refuses. A DEPTH is counted from a water surface
    # and never from a reference system, so the word a record states is read as
    # the surface it names: points on IGLD85 are soundings below the Low Water
    # Datum expressed on IGLD85 - "ALL SOUNDINGS ARE REFERENCED TO INTERNATIONAL
    # GREAT LAKES DATUM OF 1985 (IGLD85) L.W.D." on the plot sheet - which is
    # LWD_IGLD85, the surface an offset service serves and 176 m above IGLD85's
    # own zero on Lake Huron.
    datum: record
    units:
      depth_below_datum_m: m
    value_column: depth_below_datum_m

-   data_class: channel survey
    kind: measured
    extent:
      kind: surface
      rings:
      - [[-125.0, 24.0], [-66.0, 24.0], [-66.0, 50.0], [-125.0, 50.0]]
      - [[-172.0, 51.0], [-129.0, 51.0], [-129.0, 72.0], [-172.0, 72.0]]
      - [[-161.0, 18.0], [-154.0, 18.0], [-154.0, 23.0], [-161.0, 23.0]]
      - [[-68.5, 17.0], [-64.0, 17.0], [-64.0, 19.0], [-68.5, 19.0]]
      - [[144.0, 13.0], [146.5, 13.0], [146.5, 21.0], [144.0, 21.0]]
      - [[-171.5, -15.0], [-169.0, -15.0], [-169.0, -13.0], [-171.5, -13.0]]
      note: the dredged prism of a federal navigation project - which is exactly what a
        channel survey IS, so a domain with no project has none
    window:
      series: false
    resolution_m: 1.0
    # The zero rides on the record and names the surface a depth hangs below,
    # the way the bathymetry row above states it.
    datum: record
    units:
      depth_below_datum_m: m
    value_column: depth_below_datum_m

caveats:
  - "the soundings are DEPTHS BELOW the survey's own stated datum, positive down, in metres - not elevations; the datum is on every row and is a local project datum on many rivers (Columbia River Datum on the Willamette) or a chart datum on the lakes (the Low Water Datum on IGLD85, published as LWD_IGLD85), so a bed built from these needs a deliberate datum shift"
  - "a survey whose points state no vertical datum or no unit of measure refuses by name rather than guessing one"
  - "the surveys are picked by COVERAGE, newest first over each part of the bbox nothing newer reached, up to twelve packages - so a reach whose southern half was last surveyed years ago comes back with that older pass beside the recent ones, and every survey's date is on its own rows and on the run journal"
  - "``since`` is a filter the caller states, for comparing one dredging against another; unstated, age only RANKS the surveys and never drops one"
  - "``datum_offset_m`` is the shift the survey's OWN package metadata publishes between its project datum and a national frame (``datum_offset_frame``), read off the sentence the district wrote it in; it is null where the package states none, and applying it is the consumer's"
  - "a question that asks for this class is asking for the maintained channel rather than for the water around it"

docstring: |-
  Fetch USACE eHydro CHANNEL SURVEY soundings + the survey footprint for a bbox -> the measured bed.

  What it does:
      Looks the bbox up in the USACE eHydro survey index (one ArcGIS layer over
      every published survey), picks the surveys that COVER it - newest first
      over each part of the bbox no newer survey reached - downloads each
      survey's own package and reads the soundings out of its geodatabase.
      One artifact comes back, its rows tagged ``part``: ``survey`` (the survey
      footprint polygon) and ``sounding`` (the measured points). Every row carries
      the survey's id and date and - read from the survey's own data, never
      assumed - its ``vertical_datum`` and the unit its depths were measured in.
      The datum is the SURFACE the depths hang below, which on the Great Lakes is
      the Low Water Datum expressed on IGLD85 (``LWD_IGLD85``) and not IGLD85
      itself.

  When to use:
      - A river, harbour or navigation-channel model needs a REAL surveyed bed:
        this is the measured channel, at metre scale, where a 10 m DEM makes the
        channel a puddle.
      - "how deep is the channel here", "the latest dredging survey", "the
        surveyed bathymetry for this reach".
      - Handed to the BED slot, which turns the points into the
        bed raster a mesh is draped on.

  When NOT to use:
      - DO NOT use for open-coast or shelf bathymetry - use ``fetch_bluetopo``
        or ``fetch_cudem``; eHydro maps dredged channels only.
      - DO NOT use for land elevation - use ``fetch_dem``.
      - DO NOT treat the values as elevations: they are depths below the
        survey's stated datum, positive downward.

  Parameters:
      bbox: ``(min_lon, min_lat, max_lon, max_lat)`` in EPSG:4326. Surveys
          INTERSECTING it are returned whole, so a survey can reach well past
          the window.
      since: optional ISO date. Absent, EVERY published survey over the bbox is
          ranked by date and the newest one over each part of it is taken, up to
          twelve packages - so an old pass is used where nothing newer measured
          that ground. Present, only surveys ending on or after it are
          considered, which is how a bed is compared against an earlier one.

  Returns:
      ``LayerURI`` for a FlatGeobuf in EPSG:4326 carrying ``part``,
      ``survey_id``, ``survey_date``, ``district``, ``feature_name``,
      ``survey_type``, ``vertical_datum``, ``source_uom``, ``datum_offset_m``
      and ``datum_offset_frame`` (the shift the package's own metadata publishes
      between its datum and a national frame, null where it publishes none),
      ``depth_below_datum_m`` (on the sounding rows) and ``sounding_count`` (on
      the survey row). ``layer_type="vector"``, ``units="m"``.

  Rendering: a VECTOR layer renders INLINE on the map automatically.

  Cross-tool dependencies:
      - Composes WITH: ``fetch_river_reach`` (the domain the survey is read
        over),
        ``fetch_dem`` (the banks the survey does not measure).
      - Upstream data source: USACE eHydro
        (https://navigation.usace.army.mil/Survey/Hydro).

  Cache: ``ttl_class="semi-static-7d"``; districts publish a given channel every
  few weeks to months.

  Errors:
      - ``EHYDRO_BBOX_INVALID`` / ``EHYDRO_INPUT_INVALID``: a malformed bbox, a
        bbox over the area gate, or an unparseable ``since``.
      - ``EHYDRO_NO_SURVEY``: no survey intersects the bbox, none since the
        stated date, or none covering enough of it to add a bed.
      - ``EHYDRO_INPUT_INVALID`` also names a survey whose points state no
        vertical datum or no unit.
      - ``EHYDRO_UPSTREAM_ERROR``: the index or the survey package failed.

  Tier-1 free. No API key.
