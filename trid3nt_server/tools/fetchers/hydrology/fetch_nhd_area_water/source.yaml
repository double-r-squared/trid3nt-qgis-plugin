# NHDArea (MapServer layer 8) water-surface polygons, opened on the user's map
# through QGIS's own ArcGIS FeatureServer provider.
schema_version: v1

name: fetch_nhd_area_water
source_class: nhd_area_water
error_prefix: NHD_AREA_WATER
input_error_suffix: INPUT_INVALID
empty_error_suffix: EMPTY
shape: record
supports_global_query: false

endpoints:
  data:
    url: "https://hydro.nationalmap.gov/arcgis/rest/services/NHDPlus_HR/MapServer/8"

auth:
  mode: none
  user_agent: trid3nt_default

params:
  bbox: {type: bbox, required: true, quantize: round_6dp, error_suffix: BBOX_INVALID}

ingest:
  access: qgis_provider
  qgis_provider:
    provider: arcgisfeatureserver
    uri: "crs='EPSG:4326' url='{url}'"
    mode: open

normalize:
  crs: "EPSG:4326"

output:
  layer_type: record
  ext: json

cache:
  ttl_class: live-no-cache
payload_estimate:
  model: bbox_area
  mb_per_sq_deg: 0.0
  floor_mb: 0.0

caveats:
  - "model-callable, not matched: a many-feature network layer is not the one domain a hydrography row returns, so it carries no coverage row"
  - "NHDArea maps water surfaces WIDE enough to have two banks - a big river, an estuary, a canal; a narrow creek is a flowline only and draws nothing here"
  - "the layer is drawn by QGIS from the service, so its features are on the map but not in the case store and no analysis reads them - a bank offset for meshing is read off it in QGIS, not fetched through this tool"
  - "US only (NHDPlus HR)"

docstring: |-
  NHD water-surface polygons (the two BANKS of a wide river, an estuary, a canal), added to the map.

  Opens the USGS NHDPlus HR NHDArea layer as a live map overlay served by
  QGIS's own ArcGIS FeatureServer provider. Unlike a flowline - which is a
  one-dimensional centreline - an NHDArea polygon carries the river's actual
  WIDTH.

  **When to use:**
  - Visual context for how WIDE a river is at a place, or where its mid-river
    islands are.
  - Masking context for open water over a big river or estuary.

  **When NOT to use:**
  - To COMPUTE with the polygon geometry - a per-station bank offset, an area
    figure. The overlay is drawn from the service and its features never
    reach the store; nothing downstream can read them.
  - The river CENTRELINE or stream network -> ``fetch_nhdplus_hr_flowlines``
    (bbox) or ``fetch_nhdplus_nldi_navigate`` (traversal).
  - Lakes, ponds and reservoirs -> ``fetch_nhd_waterbodies``.
  - Outside the US - NHDPlus HR is US-only.

  **Parameters:**
      bbox: ``(min_lon, min_lat, max_lon, max_lat)`` in EPSG:4326. Required.

  **Returns:**
      A record naming what was opened: the provider, the service uri behind
      the layer, the layer name and the bbox the map was taken to.
  **Error types:**
      - ``NHD_AREA_WATERInputError``: bad bbox (retryable=False).
      - ``NHD_AREA_WATERUpstreamError``: the provider's own text when it
        cannot open the service (retryable=True).

  Requires a live QGIS session: the layer is opened in the user's QGIS, so a
  headless or direct call refuses by name rather than returning nothing.

  ``supports_global_query=False``. No API key required.
