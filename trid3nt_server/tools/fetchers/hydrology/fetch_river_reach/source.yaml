# One river reach as ONE artifact: the NLDI network walk gives the centerline, the
# NHDArea layer gives the banks, and the two derives that cut a polygon between two
# points run on ingestion. The two services are declared here; the composition is the
# one step the grammar cannot say.
schema_version: v1

name: fetch_river_reach
source_class: river_reach
error_prefix: RIVER_REACH
input_error_suffix: INPUT_INVALID
empty_error_suffix: EMPTY
shape: vector-fgb
supports_global_query: false

endpoints:
  position:
    url: "https://api.water.usgs.gov/nldi/linked-data/comid/position"
    query:
      f: "json"
  navigate:
    url_template: "https://api.water.usgs.gov/nldi/linked-data/comid/{comid}/navigation/{direction}/flowlines"
    query:
      f: "json"
  banks:
    url: "https://hydro.nationalmap.gov/arcgis/rest/services/NHDPlus_HR/MapServer/8/query"
    # NHDArea maps every water surface, including the structures ON a river. A
    # domain is the water: StreamRiver and CanalDitch, named by the service's own
    # FType codes. The generalization tolerance is the bank detail a mesh needs
    # rather than every vertex of the mainstem.
    query:
      where: "FType IN (460, 537)"
      geometryType: "esriGeometryEnvelope"
      inSR: "4326"
      outSR: "4326"
      spatialRel: "esriSpatialRelIntersects"
      outFields: "ftype"
      returnGeometry: "true"
      maxAllowableOffset: "0.00005"
      resultRecordCount: "200"
      f: "geojson"
auth:
  mode: none
  user_agent: trid3nt_default

params:
  seed_point: {type: point, required: true}
  distance_km: {type: float, default: 3.0, min: 0.1, max: 50.0}
  direction:
    type: enum
    values: [DM, UM]
    default: DM

ingest:
  # The one schema every row of the artifact carries; ``part`` says which row it is.
  properties:
    - part
    - comid
    - reach_km
    - area_km2
    - mean_width_m

hooks:
  resolve_build: river_reach.resolve_build
  resolve_parse: river_reach.resolve_parse
  build_request: river_reach.build_request
  parse_response: river_reach.parse_response

normalize:
  crs: "EPSG:4326"
  units: null

output:
  layer_type: vector
  ext: fgb
  role: primary
  display_name: "River reach domain"
  bbox_from_features:
    pad: 0.002
  style:
    kind: reference
    geometry: polygon

cache:
  ttl_class: static-30d
payload_estimate:
  model: bbox_area
  mb_per_sq_deg: 0.0001
  floor_mb: 0.05
  ceil_mb: 0.5

coverage:
  data_class: hydrography
  extent:
    kind: surface
    rings:
    - [[-125.0, 24.0], [-66.0, 24.0], [-66.0, 50.0], [-125.0, 50.0]]
    note: NHDPlus v2.1 and NHDPlus HR over CONUS; a creek too narrow for NHD to
      map a water surface has no polygon here
  window:
    series: false
    latest: '2023-01-01'
  resolution_m: 5.0
  datum: null
  units: {}

caveats:
  - "the reach runs FROM the seed: DM walks downstream from it, UM walks upstream to it, and distance_km is measured along the channel"
  - "a creek too narrow for NHD to map a water SURFACE has no banks, so there is no polygon to solve over and the fetch refuses by name - that is a fact about the channel, not a fetch failure"
  - "the boundary runs are the section's own end transects; a seed whose reach ends off the mapped water refuses rather than guessing a face"

docstring: |-
  Build a RIVER REACH DOMAIN from one seed point -> the reach polygon, its inflow and outflow boundary runs, and the centerline.

  What it does:
      Walks the NHDPlus network from the seed (NLDI), takes the mapped water
      SURFACE there (NHDArea: the two banks, not the centreline), and cuts that
      surface square to the channel at the two ends of the walk. One artifact
      comes back carrying four rows, each tagged ``part``:
      ``reach`` (the closed polygon the equations are solved over),
      ``inflow`` and ``outflow`` (two points each, the end transects on the
      polygon edge, in flow order), and ``centerline`` (the navigated flowline,
      clipped to the reach).

  When to use:
      - A river question needs a DOMAIN: hand the ``reach`` row to
        ``build_mesh(extent=...)`` and the two runs to the boundary roles.
      - The user names a place on a river and a stretch of it ("3 km of the
        Willamette below the Hawthorne Bridge") - geocode the place with
        ``geocode_location``, drop the seed on the channel, ask here.
      - You want the reach's banks and its centreline as ONE thing rather than
        four chained calls.

  When NOT to use:
      - DO NOT use for a lake, a pond, a reservoir or a harbour - a closed body
        has no boundary runs; use ``fetch_nhd_waterbodies``.
      - DO NOT use for the stream NETWORK or a tributary catalog - that is
        ``fetch_nhdplus_nldi_navigate``.
      - DO NOT use for the river BED: this is geometry only. The bed comes from
        ``fetch_ehydro_surveys`` (a channel survey), a bathymetry fetcher, or a
        DEM.
      - DO NOT use outside the US.

  Parameters:
      seed_point: ``(lon, lat)`` in EPSG:4326, ON or near the channel. It is
          snapped to the nearest NHDPlus flowline. Example, the Willamette at
          Portland (USGS 14211720): ``(-122.6735, 45.5175)``.
      distance_km: how far the reach runs from the seed ALONG the channel,
          default ``3.0``, range ``[0.1, 50]``.
      direction: ``"DM"`` (default) runs the reach DOWNSTREAM from the seed, so
          the seed is its inflow; ``"UM"`` runs it UPSTREAM to the seed, so the
          seed is its outflow - which is what a calibration against a gauge at
          the seed wants.

  Returns:
      ``LayerURI`` for a FlatGeobuf in EPSG:4326 whose rows carry ``part``,
      ``comid`` (the seed's NHDPlus reach id), ``reach_km`` (the centerline's
      measured length), ``area_km2`` and ``mean_width_m`` (area over length).
      ``layer_type="vector"``, ``role="primary"``.

  Rendering: a VECTOR layer renders INLINE on the map automatically.

  Cross-tool dependencies:
      - Upstream: ``geocode_location`` for the seed from a place name.
      - Composes WITH: ``build_mesh`` (the ``reach`` row is its extent),
        ``fetch_ehydro_surveys`` and ``fetch_dem`` (the bed over it),
        ``fetch_usgs_nwis_gauges`` (the discharge and stage at its ends).
      - Upstream data sources: USGS NLDI + NHDPlus HR NHDArea.

  Cache: ``ttl_class="static-30d"``, keyed on the seed, the distance and the
  direction; the channel network and the mapped banks are multi-year stable.

  Errors:
      - ``RIVER_REACH_INPUT_INVALID``: a seed off the network or outside CONUS.
      - ``RIVER_REACH_EMPTY``: no flowline from the seed, no mapped water
        surface at the reach, or the cut left no polygon - each named.
      - ``RIVER_REACH_UPSTREAM_ERROR``: NLDI or NHD failed.

  Tier-1 free. No API key.
