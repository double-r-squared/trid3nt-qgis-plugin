# The WIDE moving water in a box: NHDPlus HR NHDArea (MapServer layer 8), the
# StreamRiver and CanalDitch polygons a channel with two banks is mapped as.
# Read through the ArcGIS query URL by the vector driver, which pages past the
# service's 2000-record cap.
schema_version: v1

name: fetch_nhd_hr_river_areas
source_class: nhd_hr_river_areas
error_prefix: NHD_HR_RIVER_AREAS
input_error_suffix: INPUT_INVALID
empty_error_suffix: EMPTY
shape: vector-fgb
supports_global_query: false

endpoints:
  data:
    url: "https://hydro.nationalmap.gov/arcgis/rest/services/NHDPlus_HR/MapServer/8/query"

auth:
  mode: none
  user_agent: trid3nt_default

params:
  bbox: {type: bbox, required: true, quantize: round_6dp}

gates:
  max_features: 50000

ingest:
  access: ogr
  ogr:
    driver: ESRIJSON
    page_size: 2000
    empty_is_typed_error: true
  query_template:
    out_fields: "nhdplusid,permanent_identifier,ftype,fcode,gnis_name,areasqkm"
  # FType 460 is StreamRiver and 537 is CanalDitch in the service's own type
  # table; the other NHDArea types are structures on the water (dams, locks,
  # bridges) or water that is not a channel.
  where_clauses:
    - {template: "ftype IN (460, 537)"}

normalize:
  crs: "EPSG:4326"
  units: null

output:
  layer_type: vector
  ext: fgb
  role: primary
  display_name: "NHD river areas"
  bbox_from_features:
    pad: 0.002
  style:
    kind: reference
    geometry: polygon

cache:
  ttl_class: static-30d
payload_estimate:
  model: per_feature
  kb_per_feature: 120.0
  features_per_sq_deg: 20.0
  floor_mb: 0.05
  ceil_mb: 50.0

coverage:
-   data_class: hydrography
    kind: measured
    extent:
      kind: surface
      rings:
      - [[-125.0, 24.0], [-66.0, 24.0], [-66.0, 50.0], [-125.0, 50.0]]
      - [[-172.0, 51.0], [-129.0, 51.0], [-129.0, 72.0], [-172.0, 72.0]]
      - [[-161.0, 18.0], [-154.0, 18.0], [-154.0, 23.0], [-161.0, 23.0]]
      - [[-68.5, 17.0], [-64.0, 17.0], [-64.0, 19.0], [-68.5, 19.0]]
      note: USGS NHDPlus HR river and canal polygons over the US and Puerto Rico; a channel too narrow for NHD to map a surface is a flowline only
    window:
      series: false
      latest: '2023-01-01'
    resolution_m: 5.0
    datum: null
    units: {}
    # WHAT THIS ROW PUBLISHES of its class: every river and canal mapped as a
    # surface in the box, each a closed outline with its NHD identity.
    vocabulary:
      river areas: river areas

caveats:
  - "StreamRiver and CanalDitch only (NHD FType 460 and 537); the dams, locks and bridges NHDArea also maps are structures on the water and are not published"
  - "every polygon intersecting the box comes back WHOLE and unsimplified, so a river reaches well past the box"
  - "the NHD `elevation` column is deliberately not published: it is null on rivers and states no datum, so it is not a stage"
  - "a channel too narrow for NHD to map a surface has no polygon here; its flowline is in the flowline network"
  - "the box is the run's own; more than 50000 polygons in it refuses by name rather than truncating"
  - "CONUS, Alaska, Hawaii and Puerto Rico (NHDPlus HR)"

docstring: |-
  Fetch every wide river and canal in a box -> NHD polygons with their identity.

  What it does:
      Queries USGS NHDPlus HR NHDArea (layer 8) over the box, keeps FType 460
      StreamRiver and 537 CanalDitch, and pages past the service's 2000-record
      cap. Each polygon is the river's water surface, bank to bank, and carries
      ``nhdplusid``, ``permanent_identifier``, ``ftype``, ``fcode``,
      ``gnis_name`` and ``areasqkm``.

  When to use:
      - A model needs the wide rivers of an area as geometry: rivers a
        groundwater model holds as river cells over their measured area.
      - You need the SET of river polygons in a box, not those around one seed.

  When NOT to use:
      - DO NOT use for the water surface around ONE seed - ``fetch_nhd_water_surface``.
      - DO NOT use for the centreline or the stream NETWORK - ``fetch_nhdplus_hr_flowline_network``.
      - DO NOT use for lakes, ponds or reservoirs - ``fetch_nhd_hr_waterbodies``.
      - DO NOT use for a river's STAGE or depth: NHD publishes neither.

  Parameters:
      bbox: ``(min_lon, min_lat, max_lon, max_lat)`` in EPSG:4326.

  Returns:
      ``LayerURI`` for a FlatGeobuf in EPSG:4326 of polygons.
      ``layer_type="vector"``, ``role="primary"``.

  Cache: ``ttl_class="static-30d"``, keyed on the box.

  Errors:
      - ``NHD_HR_RIVER_AREAS_INPUT_INVALID``: a malformed box.
      - ``NHD_HR_RIVER_AREAS_EMPTY``: no river or canal polygon in the box.
      - ``NHD_HR_RIVER_AREAS_UPSTREAM_ERROR``: the NHD service failed.

  Tier-1 free. No API key.
