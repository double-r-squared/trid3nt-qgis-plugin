# NHDPlus HR NetworkNHDFlowline (MapServer layer 3), opened on the user's map
# through QGIS's own ArcGIS FeatureServer provider, optionally filtered to
# one GNIS name.
schema_version: v1

name: fetch_nhdplus_hr_flowlines
source_class: nhdplus_hr_flowlines
error_prefix: NHDPLUS_HR_FLOWLINES
input_error_suffix: INPUT_INVALID
empty_error_suffix: EMPTY
shape: record
supports_global_query: false

endpoints:
  data:
    url: "https://hydro.nationalmap.gov/arcgis/rest/services/NHDPlus_HR/MapServer/3"

auth:
  mode: none
  user_agent: trid3nt_default

params:
  bbox: {type: bbox, required: true, quantize: round_6dp, error_suffix: BBOX_INVALID}
  gnis_name: {type: str, schema_optional: true}

ingest:
  access: qgis_provider
  qgis_provider:
    provider: arcgisfeatureserver
    uri: "crs='EPSG:4326' url='{url}'"
    mode: open
  where_clauses:
    - {template: "UPPER(gnis_name)=UPPER('{gnis_name}')", require: [gnis_name]}

normalize:
  crs: "EPSG:4326"

output:
  layer_type: record
  ext: json

cache:
  ttl_class: live-no-cache
payload_estimate:
  model: bbox_area
  mb_per_sq_deg: 0.0
  floor_mb: 0.0

caveats:
  - "model-callable, not matched: a many-feature network layer is not the one domain a hydrography row returns, so it carries no coverage row"
  - "NHDPlus HR covers the US (CONUS + AK + HI + territories)"
  - "gnis_name matches EXACTLY (case-insensitively) - an unnamed headwater reach carries no gnis_name and is unreachable by name"
  - "the layer is drawn by QGIS from the service, so its features are on the map but not in the case store and no analysis reads them - stream order / drainage area for ranking a channel is read off it in QGIS, not fetched through this tool"

docstring: |-
  NHDPlus High Resolution stream flowlines, added to the map.

  Opens the USGS NHDPlus HR NetworkNHDFlowline layer as a live map overlay
  served by QGIS's own ArcGIS FeatureServer provider, optionally filtered to
  one GNIS watercourse name.

  **When to use:**
  - Visual context for "the Snake River near Twin Falls" -> pass
    ``gnis_name="Snake River"`` to draw only that watercourse.
  - Deciding which channel a point near a confluence belongs to, by reading
    ``streamorde`` / ``totdasqkm`` off the opened layer in QGIS.

  **When NOT to use:**
  - To COMPUTE with the flowline attributes - rank channels, feed a model.
    The overlay is drawn from the service and its features never reach the
    store; nothing downstream can read them.
  - Walking the network upstream or downstream from a point ->
    ``fetch_nhdplus_nldi_navigate``.
  - Wide-river water-surface polygons -> ``fetch_nhd_area_water``. Lakes /
    ponds / reservoirs -> ``fetch_nhd_waterbodies``. Outside the US.

  **Parameters:**
      bbox: ``(min_lon, min_lat, max_lon, max_lat)`` in EPSG:4326. Required.
      gnis_name: optional exact (case-insensitive) GNIS watercourse name,
          e.g. ``"Eel River"``. Omit to draw every flowline in the envelope.

  **Returns:**
      A record naming what was opened: the provider, the service uri behind
      the layer, the layer name and the bbox the map was taken to.
  **Error types:**
      - ``NHDPLUS_HR_FLOWLINESInputError``: bad bbox or gnis_name
        (retryable=False).
      - ``NHDPLUS_HR_FLOWLINESUpstreamError``: the provider's own text when
        it cannot open the service (retryable=True).

  Requires a live QGIS session: the layer is opened in the user's QGIS, so a
  headless or direct call refuses by name rather than returning nothing.

  ``supports_global_query=False``. No API key required.
