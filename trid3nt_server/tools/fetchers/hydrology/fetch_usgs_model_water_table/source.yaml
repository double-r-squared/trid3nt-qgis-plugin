# The water table of the two published USGS MODFLOW model archives behind
# fetch_usgs_model_k: the model's own starting head of the topmost active layer,
# as one EPSG:4326 raster of elevation in metres on NAVD88. The delegate hook
# reads the head, bottom and layer masks from the archive the K row downloads
# (one shared cached download), puts a model counted from another datum onto
# NAVD88 through PROJ's local VERTCON 2 grid, warps the touched window nearest-neighbour and crops to
# cells whose centres fall in the bbox. It answers only where the model measures
# every cell of the box, and measures exactly the cells fetch_usgs_model_thickness
# does, so a run takes both from the model or neither. Ranked beside
# fetch_water_table_depth by the match seam, on the finer cell.
schema_version: v1

name: fetch_usgs_model_water_table
source_class: usgs_model_water_table
error_prefix: USGS_MODEL_WATER_TABLE
input_error_suffix: INPUT_INVALID
empty_error_suffix: EMPTY
shape: raster-cog
supports_global_query: false

# Documentary: the archives are read through fetch_usgs_model_k's endpoints and
# cache entries, so a call here after a K call downloads nothing.
endpoints:
  jbcc_model:
    url: https://www.sciencebase.gov/catalog/file/get/631405ded34e36012efa3476?f=__disk__0f%2F7e%2F50%2F0f7e50aa9965d7d1ebb3261e6070e35b6857bd89
  des_moines_model:
    url: https://www.sciencebase.gov/catalog/file/get/6601d849d34e64ff1548e2ad?f=__disk__be%2F60%2F44%2Fbe6044364e5897bfd556958e27867f28ee124f64
auth:
  mode: none
  user_agent: "trid3nt/0.1 (Hazard Modeling Agent; agent@trid3nt.dev)"

params:
  bbox:
    type: bbox
    required: true
    quantize: round_6dp

ingest:
  access: library_delegate
  delegate:
    library: usgs_model_archive
    timeout_s: 120.0

hooks:
  delegate: usgs_model_water_table.read

normalize:
  crs: EPSG:4326
  units: m
  quantity: water_table_elevation

output:
  layer_type: raster
  ext: tif
  role: primary
  emit_bbox: true
  style:
    kind: continuous
    ramp: rdylbu_r
    units: m
  display_name: "Water table elevation (USGS model)"

cache:
  ttl_class: static-30d

payload_estimate:
  model: bbox_area
  # One surface at Cape Cod's 121.92 m cells: ~622k cells/deg^2 x 4 B = ~2.5 MB/deg^2.
  mb_per_sq_deg: 2.5

coverage:
- data_class: groundwater level
  kind: modelled
  extent:
    kind: surface
    # The four native corners of each model grid, as fetch_usgs_model_k states them.
    rings:
      - [[-70.720992, 41.805502], [-70.13421, 41.799982], [-70.140988, 41.481685], [-70.724858, 41.487178]]
      - [[-93.854022, 41.817624], [-93.577352, 41.819348], [-93.575291, 41.588597], [-93.850975, 41.586887]]
    note: the Cape Cod JBCC (32 layers, ~400 ft cells) and Des Moines MF6 (6 layers, 60 m cells) USGS MODFLOW model grids, their union
  window:
    series: false
    latest: '2019-01-01'
  # The COARSER of the two grids (Cape Cod 400 ft = 121.92 m).
  resolution_m: 121.92
  datum: NAVD88
  units:
    water_table_elevation: m
  value_column: water_table_elevation

caveats:
  - "Two published calibrated USGS MODFLOW model grids, nothing more: Cape Cod JBCC (2019 release) and Des Moines MF6 (2024 release). A bbox outside both raises USGS_MODEL_WATER_TABLE_INPUT_INVALID naming them; a bbox a grid holds only in part, or a box with a cell the model leaves unmeasured, raises USGS_MODEL_WATER_TABLE_EMPTY so the next source answers the whole run; nothing is interpolated between grids."
  - "The value is the model's starting head of the cell's topmost active layer, an elevation: Cape Cod start_heads (equal to the model top, the water table the model was built on; SIR 2018-5139; one array for every layer) in feet on NGVD 29, put onto NAVD88 with NOAA VDatum's offset at the AOI's four corners, bilinear between them; Des Moines dmww_strt.hds (one record per layer, times the FACTOR 1.001 its initial-condition input states) in metres on NAVD88 as published. Where VDatum has no offset the call refuses by name rather than assuming zero."
  - "A cell is kept where a layer is active, the head stands above the bottom of its deepest active layer, and so the thickness row measures it; a Des Moines cell whose layer 1 is inactive takes the head of the topmost layer that is active."

docstring: |-
  Fetch the water table inside a published USGS MODFLOW model's grid, as the
  model itself holds it: an elevation on NAVD 88.

  **What it does:** Reads the starting head out of two published USGS
  groundwater-flow model archives - the Joint Base Cape Cod (JBCC)
  MODFLOW-2005 model (~400 ft cells; heads in feet on NGVD 29, put onto NAVD 88
  with the VERTCON 2 grid) and the Des Moines River alluvial-aquifer MODFLOW-6 model
  (60 m cells; metres on NAVD 88) - and returns the head of each cell's topmost
  active layer in metres as one EPSG:4326 float32 COG over the bbox. It answers
  only where the model measures every cell of the box.

  **When to use:**
  - The water table of a run whose domain lies inside the Cape Cod or Des
    Moines model grid, so it agrees with the model's hydraulic conductivity
    (fetch_usgs_model_k), layer elevations (fetch_usgs_model_layers) and
    saturated thickness (fetch_usgs_model_thickness).
  - "What is the water table elevation in the Cape Cod / Des Moines model?"

  **When NOT to use:**
  - Anywhere outside the two grids, or where the grid holds the box only in
    part - the call refuses or is empty; fetch_water_table_depth covers CONUS.
  - A measured water level at a well - these are the models' starting heads.

  **Parameters:**
  - ``bbox`` (tuple): ``(min_lon, min_lat, max_lon, max_lat)`` EPSG:4326; must
    lie ENTIRELY inside ONE of the two model grids. Required. Example (Cape
    Cod canary): ``(-70.62, 41.59, -70.50, 41.68)``.

  **Returns:** a ``LayerURI`` for a one-band float32 COG (``layer_type="raster"``,
  ``role="primary"``, ``units="m"``, ``quantity="water_table_elevation"``,
  vertical datum NAVD88).
