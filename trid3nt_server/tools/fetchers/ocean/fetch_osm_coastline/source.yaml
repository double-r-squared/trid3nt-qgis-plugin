schema_version: v1
name: fetch_osm_coastline
source_class: osm_coastline
input_error_suffix: INPUT_INVALID
shape: vector-fgb
supports_global_query: false
endpoints:
  data:
    url: https://overpass-api.de/api/interpreter
  kumi:
    url: https://overpass.kumi.systems/api/interpreter
  coffee:
    url: https://overpass.private.coffee/api/interpreter
auth:
  mode: none
  user_agent: trid3nt/0.1 (Hazard Modeling Agent; https://github.com/double-r-squared/trid3nt-qgis-plugin;
    agent@trid3nt.dev)
params:
  bbox:
    type: bbox
    required: true
    quantize: round_6dp
hooks:
  delegate: osm_coastline.delegate
ingest:
  delegate: {library: osmnx, timeout_s: 180}
  properties:
  - osm_id
  - name
  - natural
normalize:
  crs: EPSG:4326
output:
  layer_type: vector
  ext: fgb
  role: context
  style:
    kind: reference
    geometry: line
cache:
  ttl_class: static-30d
payload_estimate:
  model: per_feature
  features_per_sq_deg: 400.0
  kb_per_feature: 8.0
  floor_mb: 0.02
caveats:
- OpenStreetMap natural=coastline ways via the Overpass API (3-mirror fallback). Global, keyless. The
  land is on the LEFT of a coastline way's direction, which is what makes an open line a land/water
  edge; the ways are returned WHOLE rather than clipped, because a coastline cut at the AOI edge would
  leave the two sides indistinguishable there. An inland AOI has no coastline in OSM and returns a
  valid 0-feature layer, not an error - a lake shore is natural=water, not natural=coastline.
docstring: |-
  The land-water EDGE at survey resolution: OpenStreetMap coastline ways as LineStrings.

  **What it does:** Queries the OpenStreetMap Overpass API for ways tagged
  ``natural=coastline`` that touch the requested bbox and returns each one
  WHOLE, in EPSG:4326, serialized to FlatGeobuf and cached for 30 days.
  OSM coastline is drawn at street resolution (metres), which is one to two
  orders of magnitude finer than the global GSHHG shoreline datasets, so it
  is the rung that can describe a harbour, a breakwater entrance or a
  narrow inlet. The vector renders inline on the map automatically.

  **When to use:**
  - The user asks where the shore runs, or wants the coastline drawn.
  - A harbour-scale domain has to be cut from the real land-water edge:
    this is the shoreline rung ``build_mesh(mesher='om2d')`` climbs to when
    the asked triangle edge is finer than a global shoreline can describe.

  **When NOT to use:**
  - DO NOT use for a LAKE, reservoir or inland water body -- OSM maps those
    as ``natural=water`` polygons and they carry no coastline way at all.
    Use ``fetch_nhd_waterbodies`` (US) for the water body's own polygon.
  - DO NOT use for a river bank -- ``fetch_nhd_area_water`` maps those.
  - DO NOT read it as bathymetry or as a tidal datum: a coastline way is a
    line on a map with no elevation and no stated water level.

  **Parameters:**
  - ``bbox`` (tuple[float, float, float, float]): ``(min_lon, min_lat,
    max_lon, max_lat)`` in EPSG:4326. Required.

  **Returns:** A ``LayerURI`` pointing at a FlatGeobuf in the cache bucket.
  ``layer_type="vector"``, ``role="context"``, ``units=None``. Properties
  per feature: ``osm_id`` (int), ``name`` (str | None), ``natural`` (str).
  An AOI OSM maps no coastline in returns a valid 0-feature layer -- an
  inland box is an honest answer, not an error.

