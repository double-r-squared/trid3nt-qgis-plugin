# NOAA CO-OPS tide stations: a station-catalog discover, a per-station datagetter loop,
# and an inline time_series_csv per station in the emitted FGB.
schema_version: v1

name: fetch_noaa_coops_tides
source_class: noaa_coops_tides   # cache prefix
error_prefix: COOPS_TIDES        # error token, distinct from the cache prefix
shape: station-timeseries-fgb
supports_global_query: false

# --- endpoints ------------------------------------------------------------
endpoints:
  catalog:
    url: "https://api.tidesandcurrents.noaa.gov/mdapi/prod/webapi/stations.json"
    query: {type: waterlevels, units: metric, format: json}
  data:
    url_template: "https://api.tidesandcurrents.noaa.gov/api/prod/datagetter"
auth:
  mode: none
  user_agent: trid3nt_default

# --- request-param schema -------------------------------------------------
params:
  bbox:       {type: bbox, required: true, quantize: round_6dp}
  start_date: {type: iso_date, required: true}
  end_date:   {type: iso_date, required: true, max_range_days: 366}
  product:    {type: enum, values: [water_level, predictions, water_temperature], default: water_level}
gates:
  max_stations: 50

# --- ingestion (station-timeseries-FGB) ----------------------------------
ingest:
  station_catalog: {lat_key: lat, lon_key: lng, id_key: id, name_key: name, rows_key: stations}
  per_station:
    # CO-OPS datagetter needs begin_date/end_date as YYYYMMDD. The router station
    # executor coerces the router-validated ISO date to a date object, so a
    # "{start:%Y%m%d}" template strftimes correctly (a raw str would raise on %Y).
    request:
      datum: MLLW
      time_zone: gmt
      interval: h
      units: metric
      application: trid3nt
      begin_date: "{start:%Y%m%d}"
      end_date: "{end:%Y%m%d}"
      station: "{id}"
      product: "{product}"
      format: json
    # A product measuring something OTHER than the water level asks the same
    # datagetter differently: its own cadence, and no datum, because a
    # temperature is counted from nothing.
    request_by_product:
      water_temperature: {interval: null, datum: null}
    rows_key: [data, predictions]   # first present wins
    time_key: t
    value_key: v
    time_normalize: iso8601z        # "YYYY-MM-DD HH:MM" -> "YYYY-MM-DDTHH:MMZ"
    time_series_csv: true           # inline CSV attribute (coastal boundary forcing)
    scalars: [wl_min_m, wl_max_m, wl_mean_m, n_timesteps, time_start, time_end]

# --- normalization stamps -------------------------------------------------
normalize:
  crs: "EPSG:4326"
  units: "m (MLLW)"
  datum: MLLW
  quantity: water_level

# --- output surface -------------------------------------------------------
output:
  layer_type: vector
  ext: fgb
  role: primary
  style:
    kind: reference
    geometry: point

# --- cache + payload gate -------------------------------------------------
cache:
  ttl_class: dynamic-1h
payload_estimate:              # ~2 KB/station/day + 0.5 KB/station overhead; ~2 stations/deg^2
  model: per_station
  kb_per_station_per_day: 2.0
  overhead_kb: 0.5
  stations_per_sq_deg: 2.0
  floor_mb: 0.01

# --- honesty: caveats + fallback -----------------------------------------
coverage:
-   data_class: water level series
    kind: measured
    reach_km: 25
    extent:
      kind: stations
      rings:
      - [[-125.5, 40.0], [-123.6, 40.0], [-123.6, 49.0], [-125.5, 49.0]]
      - [[-123.4, 47.0], [-122.0, 47.0], [-122.0, 49.1], [-123.4, 49.1]]
      - [[-123.4, 36.0], [-121.3, 36.0], [-121.3, 40.2], [-123.4, 40.2]]
      - [[-121.5, 32.4], [-117.0, 32.4], [-117.0, 36.2], [-121.5, 36.2]]
      - [[-97.6, 25.8], [-81.0, 25.8], [-81.0, 31.0], [-97.6, 31.0]]
      - [[-82.0, 24.4], [-75.3, 24.4], [-75.3, 36.6], [-82.0, 36.6]]
      - [[-76.5, 36.5], [-73.0, 36.5], [-73.0, 41.2], [-76.5, 41.2]]
      - [[-71.6, 40.3], [-66.9, 40.3], [-66.9, 45.2], [-71.6, 45.2]]
      - [[-92.3, 41.3], [-76.0, 41.3], [-76.0, 49.1], [-92.3, 49.1]]
      - [[-172.0, 51.0], [-129.0, 51.0], [-129.0, 72.0], [-172.0, 72.0]]
      - [[-161.0, 18.0], [-154.0, 18.0], [-154.0, 23.0], [-161.0, 23.0]]
      - [[-68.5, 17.0], [-64.0, 17.0], [-64.0, 19.0], [-68.5, 19.0]]
      - [[144.0, 13.0], [146.5, 13.0], [146.5, 21.0], [144.0, 21.0]]
      - [[-171.5, -15.0], [-169.0, -15.0], [-169.0, -13.0], [-171.5, -13.0]]
      note: about three hundred NOAA CO-OPS stations on the US ocean coastline, its
        tidal entrances and bays, the Great Lakes shore and the territories
      read_from: noaa_coops.stations
    window:
      series: true
      max_span_days: 366.0
      cadence: 6-min samples, requested hourly
    datum: MLLW
    units:
      water_level: m
      time_series_csv: m
    value_column: water_level
    series_column: time_series_csv
    ask:
      product: water_level
-   data_class: water level series
    kind: predicted
    reach_km: 25
    extent:
      kind: stations
      rings:
      - [[-125.5, 40.0], [-123.6, 40.0], [-123.6, 49.0], [-125.5, 49.0]]
      - [[-123.4, 47.0], [-122.0, 47.0], [-122.0, 49.1], [-123.4, 49.1]]
      - [[-123.4, 36.0], [-121.3, 36.0], [-121.3, 40.2], [-123.4, 40.2]]
      - [[-121.5, 32.4], [-117.0, 32.4], [-117.0, 36.2], [-121.5, 36.2]]
      - [[-97.6, 25.8], [-81.0, 25.8], [-81.0, 31.0], [-97.6, 31.0]]
      - [[-82.0, 24.4], [-75.3, 24.4], [-75.3, 36.6], [-82.0, 36.6]]
      - [[-76.5, 36.5], [-73.0, 36.5], [-73.0, 41.2], [-76.5, 41.2]]
      - [[-71.6, 40.3], [-66.9, 40.3], [-66.9, 45.2], [-71.6, 45.2]]
      - [[-92.3, 41.3], [-76.0, 41.3], [-76.0, 49.1], [-92.3, 49.1]]
      - [[-172.0, 51.0], [-129.0, 51.0], [-129.0, 72.0], [-172.0, 72.0]]
      - [[-161.0, 18.0], [-154.0, 18.0], [-154.0, 23.0], [-161.0, 23.0]]
      - [[-68.5, 17.0], [-64.0, 17.0], [-64.0, 19.0], [-68.5, 19.0]]
      - [[144.0, 13.0], [146.5, 13.0], [146.5, 21.0], [144.0, 21.0]]
      - [[-171.5, -15.0], [-169.0, -15.0], [-169.0, -13.0], [-171.5, -13.0]]
      note: about three hundred NOAA CO-OPS stations on the US ocean coastline, its
        tidal entrances and bays, the Great Lakes shore and the territories
      read_from: noaa_coops.stations
    window:
      series: true
      max_span_days: 366.0
      cadence: hourly astronomical predictions
    datum: MLLW
    units:
      water_level: m
      time_series_csv: m
    value_column: water_level
    series_column: time_series_csv
    ask:
      product: predictions

-   data_class: water quality sample
    kind: measured
    reach_km: 25
    extent:
      kind: stations
      rings:
      - [[-125.5, 40.0], [-123.6, 40.0], [-123.6, 49.0], [-125.5, 49.0]]
      - [[-123.4, 47.0], [-122.0, 47.0], [-122.0, 49.1], [-123.4, 49.1]]
      - [[-123.4, 36.0], [-121.3, 36.0], [-121.3, 40.2], [-123.4, 40.2]]
      - [[-121.5, 32.4], [-117.0, 32.4], [-117.0, 36.2], [-121.5, 36.2]]
      - [[-97.6, 25.8], [-81.0, 25.8], [-81.0, 31.0], [-97.6, 31.0]]
      - [[-82.0, 24.4], [-75.3, 24.4], [-75.3, 36.6], [-82.0, 36.6]]
      - [[-76.5, 36.5], [-73.0, 36.5], [-73.0, 41.2], [-76.5, 41.2]]
      - [[-71.6, 40.3], [-66.9, 40.3], [-66.9, 45.2], [-71.6, 45.2]]
      - [[-92.3, 41.3], [-76.0, 41.3], [-76.0, 49.1], [-92.3, 49.1]]
      - [[-172.0, 51.0], [-129.0, 51.0], [-129.0, 72.0], [-172.0, 72.0]]
      - [[-161.0, 18.0], [-154.0, 18.0], [-154.0, 23.0], [-161.0, 23.0]]
      - [[-68.5, 17.0], [-64.0, 17.0], [-64.0, 19.0], [-68.5, 19.0]]
      - [[144.0, 13.0], [146.5, 13.0], [146.5, 21.0], [144.0, 21.0]]
      - [[-171.5, -15.0], [-169.0, -15.0], [-169.0, -13.0], [-171.5, -13.0]]
      note: the CO-OPS stations that carry a water-temperature sensor - a SUBSET of the
        network, so a station that publishes a water level here need not publish a
        temperature, and the fetch says so by station
      read_from: noaa_coops.stations
    window:
      series: true
      max_span_days: 366.0
      cadence: 6-min samples
    # A TEMPERATURE IS COUNTED FROM NOTHING: no datum belongs on this row, and
    # none is asked of the API.
    datum: null
    units:
      water_temperature: degC
      time_series_csv: degC
    value_column: water_temperature
    series_column: time_series_csv
    ask:
      product: water_temperature
    vocabulary:
      TEMPERATURE: water_temperature

caveats:
  - "an empty bbox -> COOPS_TIDES_EMPTY (retryable=false), never a fabricated station"
  - "one bad station never aborts the bbox (swallowed to null); all-empty -> typed EMPTY, never fabricated"
  - "non-US coastal water level -> fetch_gtsm_tide_surge (GTSM v3.0 global reanalysis)"
  - "product=water_temperature is served by only SOME of the network: a station with a water-level record often publishes no temperature at all, and the fetch returns the stations that do rather than a substitute from another site"
  - "a CO-OPS station stands at the water and not tens of kilometres inland of it"

# corpus lifted from sibling corpus.yaml.

# --- LLM docstring: the sole source of the promoted tool description and the
# retrieval-index document text. ---
docstring: |-
  Fetch NOAA CO-OPS tide-station water levels, predictions or water temperature as a FlatGeobuf.

  **What it does:** Retrieves hourly water-level time series from the NOAA
  Center for Operational Oceanographic Products and Services (CO-OPS) Data
  API for all instrumented tide stations within a bbox, using the
  ``products/water_level`` or ``products/predictions`` endpoint. Returns a
  FlatGeobuf with one Point feature per station, carrying the full hourly
  time series inline as a ``time_series_csv`` attribute suitable for a
  hydraulic model's coastal boundary forcing. Tier-1 free, no API key.

  **When to use:**
  - User asks "what are the tide levels at Fort Myers / Key West / any US
    coastal city" for a past or upcoming date range.
  - Agent needs observed coastal water-level boundary conditions for a
    compound-flood hydraulic model run at a US/territory location.
  - User asks for tide predictions to plan coastal operations or assess
    flood-tide coincidence risk.
  - Agent needs to validate a GTSM global tide estimate against the
    authoritative US tide-gauge record (cross-check via this tool).
  - User asks for storm-surge context: "how high did the water get at
    Fort Myers during Ian?" -- use ``product="water_level"`` to retrieve
    the observed record.

  **When NOT to use:**
  - For global coastal water-level (non-US) -> use ``fetch_gtsm_tide_surge``
    (GTSM v3.0 global reanalysis).
  - For river-discharge / streamflow -> use ``fetch_noaa_nwm_streamflow``
    or ``fetch_usgs_nwis_gauges`` (USGS NWIS).
  - For wave height or ocean swell -> CO-OPS does not serve wave products;
    use ERA5 or NOAA WAVEWATCH III (not currently in the tool catalog).
  - For gridded storm-surge inundation rasters -> gridded inundation
    modeling is not currently available from this tool; it returns
    point time series only.
  - For sub-hourly tide data (6-minute observations) -> the current tool
    returns hourly (``interval=h``); extend with ``interval=6`` in a
    future version if a hydraulic model setup requires finer resolution.

  **Parameters:**
      bbox: ``(west, south, east, north)`` in EPSG:4326 (WGS84 decimal
          degrees). Required -- ``supports_global_query=False``. Specify a
          coastal bbox. Cap of 50 stations per call.
          Example for Fort Myers + Naples area: ``(-82.5, 25.5, -81.0, 27.5)``
          -> returns 2 stations (8725520 Fort Myers + 8725114 Naples Bay).
      start_date: ISO YYYY-MM-DD; inclusive start of the data window.
          Example: ``"2022-09-28"`` (Hurricane Ian landfall day).
      end_date: ISO YYYY-MM-DD; inclusive end of the data window.
          Hard cap of 366 days from start_date. For multi-year spans, call
          in annual chunks and aggregate.
      product: One of:
          - ``"water_level"`` (default): verified (or preliminary) observed
            water level at the gauge, relative to MLLW datum. Best for
            post-event analysis and compound-flood model validation.
          - ``"predictions"``: astronomical tide prediction (no storm surge
            component). Best for future planning, tide tables, and
            decomposing the observed signal into tide vs surge residual.
          - ``"water_temperature"``: the observed water temperature at the
            gauge, in degrees Celsius, at the sensor's own 6-minute cadence and
            on no datum. Only SOME stations carry the sensor.

  **Returns:**
      ``LayerURI`` pointing at a FlatGeobuf in the cache bucket:
      ``s3://trid3nt-cache/cache/dynamic-1h/noaa_coops_tides/<key>.fgb``
      Each feature is a Point at the station location (EPSG:4326) with
      attributes: ``station_id`` (7-digit CO-OPS ID), ``station_name``,
      ``lon``, ``lat``, ``product``, ``datum`` (always "MLLW"),
      ``time_start`` / ``time_end`` (ISO-8601 UTC), ``n_timesteps`` (int),
      ``wl_min_m`` / ``wl_max_m`` / ``wl_mean_m`` (float, meters),
      ``time_series_csv`` (comma-separated "iso,value_m" rows for
      hydraulic model boundary input). ``layer_type="vector"``, ``role="primary"``,
      ``units="m (MLLW)"``.
  **Error types:**
      - ``COOPSTidesInputError``: bad bbox / product / dates (retryable=False).
      - ``COOPSTidesUpstreamError``: HTTP/network failure (retryable=True).
      - ``COOPSTidesEmptyError``: no CO-OPS stations in bbox or all stations
        have no data for the requested period (retryable=False).

  Cache: ``ttl_class="dynamic-1h"``, ``source_class="noaa_coops_tides"``.
  Cache key is SHA-256 of ``(bbox-rounded-6dp, start_date, end_date, product)``
  so identical calls reuse the same FlatGeobuf.

  Tier-1 free. No API key. ``supports_global_query=False``.
