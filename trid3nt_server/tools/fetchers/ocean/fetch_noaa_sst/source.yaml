# NOAA Coral Reef Watch daily 5 km SST, opened on the user's map through
# QGIS's own WMS provider on the ERDDAP WMS endpoint (dhw_5km), MEASURED:
# coastwatch.pfeg.noaa.gov's WMS 302-redirects to pae-paha.pacioos.hawaii.edu,
# which is the endpoint actually opened.
schema_version: v1
name: fetch_noaa_sst
source_class: noaa_sst
shape: record
supports_global_query: false
endpoints:
  data:
    url: "https://pae-paha.pacioos.hawaii.edu/erddap/wms/dhw_5km/request"
auth:
  mode: none
  user_agent: trid3nt_default
params:
  bbox:
    type: bbox
    required: true
    quantize: round_4dp
  variable:
    type: enum
    values: [CRW_SST, CRW_SSTANOMALY]
    default: CRW_SST
    aliases: {sst: CRW_SST, temperature: CRW_SST, anomaly: CRW_SSTANOMALY,
              sst_anomaly: CRW_SSTANOMALY}

ingest:
  access: qgis_provider
  qgis_provider:
    provider: wms
    uri: "crs='EPSG:4326' format='image/png' layers='dhw_5km:{variable}' styles='' url='{url}'"
    mode: open

normalize:
  crs: EPSG:4326
  units: degrees Celsius

output:
  layer_type: record
  ext: json

cache:
  ttl_class: live-no-cache
payload_estimate:
  model: bbox_area
  mb_per_sq_deg: 0.0
  floor_mb: 0.0

caveats:
  - "NOAA Coral Reef Watch operational daily 5 km SST, opened as a live WMS map overlay through the ERDDAP dhw_5km dataset; the day the overlay draws is whatever the service's WMS TIME default carries, since a single provider-open call has no per-day subset - use fetch_goes_abi for a specific day's raster"
  - "the layer is drawn by QGIS from the service, so it is on the map but not in the case store and no analysis reads it"
  - "Ocean-only -- CRW masks land; a fully-land AOI draws a transparent overlay, never fabricated content"
  - "model-callable, not matched: a sea-surface temperature is not weather forcing, so it carries no coverage row"

docstring: |-
  NOAA sea-surface-temperature (SST) WMS overlay, added to the map.

  Opens the NOAA Coral Reef Watch operational daily 5 km global SST product
  (``dhw_5km``) as a live WMS layer served by QGIS's own WMS provider on the
  NOAA CoastWatch / PacIOOS ERDDAP endpoint. Pass ``variable="CRW_SSTANOMALY"``
  (or the alias ``"anomaly"``) for the SST ANOMALY overlay instead.

  The CRW product is global, gap-filled, updated daily, and covers
  1985-present -- the go-to "how warm is the ocean here" / marine-heatwave /
  coral-bleaching-stress / hurricane-fuel layer.

  **When to use:**
  - User wants ocean / sea-surface temperature visual context for an area
    ("show SST in the Gulf", "how warm is the water off Florida").
  - SST ANOMALY / marine-heatwave visual context.

  **When NOT to use:**
  - To COMPUTE with the SST values - a per-pixel read, a mean over an AOI,
    feed a model. The overlay is drawn from the service and its pixels never
    reach the store; nothing downstream can read them.
  - A specific past day's SST raster - the WMS layer draws the service's own
    current default; there is no per-call day subset under mode open.
  - LAND-surface or air / 2 m temperature -- this is OCEAN ONLY.

  **Parameters:**
      bbox: ``(min_lon, min_lat, max_lon, max_lat)`` in EPSG:4326. Required.
          Must cover ocean.
      variable: ``"CRW_SST"`` (default) or ``"CRW_SSTANOMALY"`` (aliases
          accepted: ``"sst"``, ``"anomaly"``, ``"sst_anomaly"``).

  **Returns:**
      A record naming what was opened: the provider, the service uri behind
      the layer, the layer name and the bbox the map was taken to.
  **Error types:**
      - ``NOAA_SSTInputError``: bad bbox or variable (retryable=False).
      - ``NOAA_SSTUpstreamError``: the provider's own text when it cannot
        open the service (retryable=True).

  Requires a live QGIS session: the layer is opened in the user's QGIS, so a
  headless or direct call refuses by name rather than returning nothing.

  **Data source:** NOAA Coral Reef Watch Operational Daily 5 km
  (``CRW_SST`` / ``CRW_SSTANOMALY``), WMS served from the PacIOOS ERDDAP
  mirror the CoastWatch endpoint redirects to. Tier-1 free (no API key).
