# The offset between two vertical frames at a point. NGVD29, NAVD88 and EGM2008 are
# converted on PROJ's local NGS/NGA grids where they cover the point (no call); every
# other pair is NOAA VDatum's one REST call, sent with a source height of ZERO so the
# height that comes back IS the offset: the number a bed and a water level are put on
# one axis with. A geodetic-by-tidal pair VDatum refuses falls back to the station tie:
# the local grids' step to NAVD88 plus the nearest CO-OPS station's published height.
# A frame asked on both sides is one zero and answers 0.0 with no call.
schema_version: v1

name: fetch_vertical_datum_offset
source_class: vertical_datum_offset
error_prefix: VDATUM
input_error_suffix: INPUT_INVALID
empty_error_suffix: NO_COVERAGE
shape: record
supports_global_query: false

endpoints:
  convert:
    url: "https://vdatum.noaa.gov/vdatumweb/api/convert"
  # The station-tie fallback: the same CO-OPS metadata the datums row reads,
  # reached here when VDatum refuses a geodetic-by-tidal pair.
  stations_catalog:
    url: "https://api.tidesandcurrents.noaa.gov/mdapi/prod/webapi/stations.json"
    query: {type: waterlevels, units: metric}
  station_datums:
    url_template: "https://api.tidesandcurrents.noaa.gov/mdapi/prod/webapi/stations/{station}/datums.json"
    query: {units: metric}
auth:
  mode: none
  user_agent: trid3nt_default

params:
  point: {type: point, required: true}
  from_frame:
    type: enum
    required: true
    lowercase: true
    values: [navd88, ngvd29, egm2008, mllw, mlw, mtl, lmsl, mhw, mhhw,
             igld85, lwd_igld85]
  to_frame:
    type: enum
    required: true
    lowercase: true
    values: [navd88, ngvd29, egm2008, mllw, mlw, mtl, lmsl, mhw, mhhw,
             igld85, lwd_igld85]

hooks:
  build_request: vdatum.build_request
  record: vdatum.record
  pre_resolve: station_tie.tie_for_offset

normalize:
  crs: "EPSG:4326"
  units: m

output:
  layer_type: record
  ext: json
  emit_bbox: false

cache:
  # A geoid model and a tidal grid are republished on the order of years, and the
  # offset at a fixed point does not move between them.
  ttl_class: semi-static-7d

# One small JSON object per call, whatever the point.
payload_estimate:
  model: bbox_area
  mb_per_sq_deg: 0.001
  floor_mb: 0.001
  ceil_mb: 0.01

caveats:
  - "model-callable, not matched: the offset between two zeros reconciles a matched source and is never one a slot matches, so it carries no coverage row"
  - "the offset is the height a ZERO on the source frame reads at on the target frame: add it to a source-frame elevation to read that elevation on the target frame"
  - "a frame asked on both sides answers offset_m 0.0 with no call: the two names are one zero, so nothing is measured and no service is reached"
  - "a pair of NGVD29, NAVD88 and EGM2008 is answered from PROJ's grids (GEOID18 over CONUS, GEOID12B over Alaska, VERTCON 2 over CONUS, EGM2008 at 2.5 arcminutes joined to NAD83(2011) by the WGS 84 (G1674) Helmert step), downloaded once from the PROJ CDN and read from disk after; the record's source names the grid files, its region reads proj-grids and its uncertainty_m is null because the grids state none. A point the grids do not cover (Hawaii, the territories, NGVD29 in Alaska) falls to VDatum, and every tidal or Great Lakes frame is VDatum's"
  - "where VDatum refuses a geodetic-by-tidal pair - its Alaska tidal sentinel, a pairing it will not serve - the station tie composes the answer: the local grids' step to NAVD88 plus the height of NAVD88 below the tidal zero at the nearest CO-OPS station within 500 km publishing BOTH frames. The station id, name and distance ride the record's source, tie_station_id and tie_distance_km; the search runs before the cache key and is best-effort, so a catalog it cannot read leaves VDatum's refusal alone"
  - "a refusal after that search names the stations checked, or that none stand within 500 km; where stations stood but none carried the pair it also names the approximation it will not take - MSL standing in for the geoid with a station's MHW above MSL - because a run never takes that silently. A tie whose grids cannot step to NAVD88 at the point refuses naming that too, because the station alone is not the conversion"
  - "a total refusal at a point - no region stands over it, VDatum's error envelope, its sentinel - names the frame pairs the local grids convert THERE, so a run can state a frame whose offset is measured; nothing chooses one for it, and a grid fetch that failed is named as unchecked rather than as nothing served"
  - "on Cape Cod VERTCON 2 sits 0.06 to 0.11 m from VDatum's NGVD29 answer (VDatum states 0.05 to 0.07) and EGM2008 to NAVD88 sits 0.07 to 0.09 m above VDatum's, inside the 0.165 m VDatum states for NAVD88 to EGM2008, and VDatum's own two directions differ by 0.025 to 0.046 m"
  - "VDatum serves the US and its territories only, and each region is its own grid: the region that stands over the point is chosen for you and named on the record, and a point no region stands over refuses by name"
  - "a local PROJECT datum - the Columbia River Datum, a district's own station datum - is NOT a VDatum frame and refuses here; its offset is published on the survey that uses it"
  - "an EGM2008 conversion runs through the ellipsoid and is NOT exactly reversible: the two directions at one point differ by a few centimetres, and VDatum reports no uncertainty for it"
  - "the offset is a SHIFT and not a scaling: it is the same number whatever height it is applied to"

docstring: |-
  Offset in metres between two VERTICAL DATUMS at one point (PROJ grids for NGVD29, NAVD88, EGM2008; NOAA VDatum for tidal and other frames) -> put a bed and a water level on one axis.

  What it does:
      Gives what a height of zero on ``from_frame`` reads at on ``to_frame``
      at this point, from local geoid grids for NGVD29, NAVD88 and EGM2008
      (CONUS, Alaska) and from NOAA VDatum for tidal frames and elsewhere. That
      number IS the offset between the two frames there: ADD it to an elevation
      on ``from_frame`` to read the same elevation on ``to_frame``. VDatum's
      frame pairing and geoid model are its own coupling and are sent for you.
      A pair VDatum refuses - a tidal frame over Alaska, a pairing it will not
      serve there - falls back to the nearest CO-OPS station within 500 km
      publishing BOTH NAVD88 and the tidal frame: the grids' step to NAVD88
      plus the station's published height, the station named on the record. A
      frame asked on both sides is one zero and answers 0.0 with no call.

  When to use:
      - A gauge publishes its datum on NGVD29 and the bed is painted on NAVD88,
        or a bathymetry is on MLLW and the terrain is on NAVD88: the two are
        metres apart on the same ground and nothing may be laid over the other
        until this number is known.
      - "how far above NAVD88 is the NGVD29 zero here", "what do I add to read
        this level on the DEM's datum", "the Great Lakes low water datum as an
        elevation".
      - Pair with the bed slot's own merge (two surfaces on different frames
        merge only through a stated offset) and with a water-level reading whose
        datum is not the bed's.

  When NOT to use:
      - DO NOT use for a local PROJECT datum - the Columbia River Datum, a
        district's station datum. VDatum does not know them; the survey that
        uses one publishes its own offset in its metadata.
      - DO NOT use outside the US and its territories.
      - DO NOT use to convert a horizontal coordinate: this is vertical only.

  Parameters:
      point: ``[lon, lat]`` in EPSG:4326, the place the offset is asked at. A
          datum difference varies over the ground, so ask at the water the
          question is about. Which regional grid answers follows from this
          point: tidal water on a coast and the tidal reach of its rivers stand
          under the coastal region, an island under its own, and inland CONUS
          under ``contiguous``.
      from_frame: the frame the number you HAVE is counted from.
      to_frame: the frame you want to read it on.

  Returns:
      a JSON-compatible dict with ``offset_m`` (metres, positive up),
      ``uncertainty_m`` (VDatum's own, or null where it reports none),
      ``from_frame``, ``to_frame``, ``lon``, ``lat``, ``region`` (the grid,
      VDatum region, ``station-tie`` or ``identity`` that answered) and
      ``source``. A station-tie answer carries ``tie_station_id`` and
      ``tie_distance_km`` beside its provenance.

  Cross-tool dependencies:
      - Composes WITH: ``fetch_ehydro_surveys``,
        ``fetch_dem``, ``fetch_copernicus_dem``, ``fetch_usgs_nwis_gauges``,
        ``fetch_noaa_coops_tides``.
      - Upstream data sources: NGS GEOID18/GEOID12B/VERTCON and NGA EGM2008 grids
        read from disk (installed by ``scripts/fetch_proj_grids.sh``); NOAA VDatum (https://vdatum.noaa.gov/).

  Cache: ``ttl_class="semi-static-7d"``.

  Errors:
      - ``VDATUM_INPUT_INVALID``: a frame outside the set above, a malformed
        point, a point no VDatum region stands over, or a request VDatum
        rejects as a frame pairing it does not serve there; each of the last
        three names the frame pairs the local grids convert at that point, and
        a refusal after a station search also names the stations checked (or
        that none stand within 500 km) plus - where stations stood and none
        carried the pair - the MSL-for-geoid approximation it refuses to take
        silently.
      - ``VDATUM_NO_COVERAGE``: the region's grids do not reach this point,
        named alongside the local grids' served pairs there.
      - ``VDATUM_UPSTREAM_ERROR``: VDatum failed or answered with something that
        is not its conversion record, or a PROJ grid is not installed (the message names ``scripts/fetch_proj_grids.sh``).

  Tier-1 free. No API key.
