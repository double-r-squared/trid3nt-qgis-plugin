# NOAA OCM SLR Viewer marsh migration, opened on the user's map through
# QGIS's own ArcGIS MapServer (image) provider: one level, one MapServer
# per call.
schema_version: v1

name: fetch_noaa_slr_marsh
source_class: noaa_slr_marsh
error_prefix: NOAA_SLR_RASTER
input_error_suffix: INPUT_INVALID
shape: record
supports_global_query: false

endpoints:
  "0.0": {url: "https://coast.noaa.gov/arcgis/rest/services/dc_slr/marsh_000/MapServer"}
  "0.5": {url: "https://coast.noaa.gov/arcgis/rest/services/dc_slr/marsh_050/MapServer"}
  "1.0": {url: "https://coast.noaa.gov/arcgis/rest/services/dc_slr/marsh_100/MapServer"}
  "1.5": {url: "https://coast.noaa.gov/arcgis/rest/services/dc_slr/marsh_150/MapServer"}
  "2.0": {url: "https://coast.noaa.gov/arcgis/rest/services/dc_slr/marsh_200/MapServer"}
  "2.5": {url: "https://coast.noaa.gov/arcgis/rest/services/dc_slr/marsh_250/MapServer"}
  "3.0": {url: "https://coast.noaa.gov/arcgis/rest/services/dc_slr/marsh_300/MapServer"}
  "3.5": {url: "https://coast.noaa.gov/arcgis/rest/services/dc_slr/marsh_350/MapServer"}
  "4.0": {url: "https://coast.noaa.gov/arcgis/rest/services/dc_slr/marsh_400/MapServer"}
  "4.5": {url: "https://coast.noaa.gov/arcgis/rest/services/dc_slr/marsh_450/MapServer"}
  "5.0": {url: "https://coast.noaa.gov/arcgis/rest/services/dc_slr/marsh_500/MapServer"}
  "5.5": {url: "https://coast.noaa.gov/arcgis/rest/services/dc_slr/marsh_550/MapServer"}
  "6.0": {url: "https://coast.noaa.gov/arcgis/rest/services/dc_slr/marsh_600/MapServer"}
  "6.5": {url: "https://coast.noaa.gov/arcgis/rest/services/dc_slr/marsh_650/MapServer"}
  "7.0": {url: "https://coast.noaa.gov/arcgis/rest/services/dc_slr/marsh_700/MapServer"}
  "7.5": {url: "https://coast.noaa.gov/arcgis/rest/services/dc_slr/marsh_750/MapServer"}
  "8.0": {url: "https://coast.noaa.gov/arcgis/rest/services/dc_slr/marsh_800/MapServer"}
  "8.5": {url: "https://coast.noaa.gov/arcgis/rest/services/dc_slr/marsh_850/MapServer"}
  "9.0": {url: "https://coast.noaa.gov/arcgis/rest/services/dc_slr/marsh_900/MapServer"}
  "9.5": {url: "https://coast.noaa.gov/arcgis/rest/services/dc_slr/marsh_950/MapServer"}
  "10.0": {url: "https://coast.noaa.gov/arcgis/rest/services/dc_slr/marsh_1000/MapServer"}
auth:
  mode: none
  user_agent: trid3nt_default

params:
  bbox: {type: bbox, required: true, quantize: round_6dp}
  slr_ft: {type: enum, required: false, default: 3.0,
           values: [0.0, 0.5, 1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0,
                    5.5, 6.0, 6.5, 7.0, 7.5, 8.0, 8.5, 9.0, 9.5, 10.0]}

ingest:
  access: qgis_provider
  qgis_provider:
    provider: arcgismapserver
    uri: "crs='EPSG:4326' format='PNG32' layer='0' url='{url}'"
    mode: open
  endpoint_by_param:
    param: slr_ft
    map: {0.0: "0.0", 0.5: "0.5", 1.0: "1.0", 1.5: "1.5", 2.0: "2.0", 2.5: "2.5",
          3.0: "3.0", 3.5: "3.5", 4.0: "4.0", 4.5: "4.5", 5.0: "5.0", 5.5: "5.5",
          6.0: "6.0", 6.5: "6.5", 7.0: "7.0", 7.5: "7.5", 8.0: "8.0", 8.5: "8.5",
          9.0: "9.0", 9.5: "9.5", 10.0: "10.0"}

normalize:
  crs: "EPSG:4326"

output:
  layer_type: record
  ext: json

cache:
  ttl_class: live-no-cache
payload_estimate:
  model: bbox_area
  mb_per_sq_deg: 0.0
  floor_mb: 0.0

caveats:
  - "NOAA OCM SLR Viewer marsh-migration overlay (marsh_* MapServer) via QGIS's arcgismapserver provider, opened as a live map overlay; existing marsh / migrated marsh / open water symbology baked into the service's own export"
  - "CONUS coastal product only; marsh migration is published at 0..10 ft in 0.5-ft steps"
  - "the layer is drawn by QGIS from the service, so it is on the map but not in the case store and no analysis reads it"
  - "model-callable, not matched: a marsh-migration scenario surface answers no run window, so it carries no coverage row"

docstring: |-
  NOAA Sea-Level-Rise MARSH-MIGRATION overlay for one level, added to the map.

  Opens NOAA OCM's SLR Viewer marsh-migration projection for one ``slr_ft``
  level as a live raster overlay served by QGIS's own ArcGIS MapServer
  provider (the NOAA marsh-class symbology baked in: existing marsh,
  migrated marsh, open water / drowned). The habitat-transition companion
  to ``fetch_noaa_slr_scenarios`` and ``fetch_noaa_slr_confidence``.

  **When to use:**
  - "How does the marsh / coastal wetland migrate under 3 ft of sea-level
    rise?"
  - Habitat-transition visual context for conservation / wetland exposure.

  **When NOT to use:**
  - The inundation FOOTPRINT -> ``fetch_noaa_slr_scenarios``. Mapping
    CONFIDENCE -> ``fetch_noaa_slr_confidence``.
  - Event-driven storm surge -> ``fetch_gtsm_tide_surge``. Outside CONUS.

  **Parameters:**
      bbox: ``(min_lon, min_lat, max_lon, max_lat)`` in EPSG:4326. Required.
      slr_ft: One level, ``0`` to ``10`` ft in 0.5-ft steps. Defaults to
          ``3.0``.

  **Returns:**
      A record naming what was opened: the provider, the service uri behind
      the layer, the layer name and the bbox the map was taken to.
  **Error types:**
      - ``NOAA_SLR_RASTERInputError``: bad bbox or slr_ft (retryable=False).
      - ``NOAA_SLR_RASTERUpstreamError``: the provider's own text when it
        cannot open the service (retryable=True).

  Requires a live QGIS session: the layer is opened in the user's QGIS, so a
  headless or direct call refuses by name rather than returning nothing.

  ``supports_global_query=False``. No API key required.
