# NOAA SLR scenario inundation footprints, opened on the user's map through
# QGIS's own ArcGIS FeatureServer provider: one scenario level, one MapServer -
# the twin's fan_out over several levels merged into one output has no
# single-uri equivalent, so scenario_ft picks ONE level's layer per call.
schema_version: v1

name: fetch_noaa_slr_scenarios
source_class: noaa_slr_scenarios
error_prefix: NOAA_SLR_SCENARIOS
input_error_suffix: INPUT_INVALID
shape: record
supports_global_query: false

endpoints:
  "0.0": {url: "https://coast.noaa.gov/arcgis/rest/services/dc_slr/slr_0ft/MapServer/0"}
  "0.5": {url: "https://coast.noaa.gov/arcgis/rest/services/dc_slr/slr_0_5ft/MapServer/0"}
  "1.0": {url: "https://coast.noaa.gov/arcgis/rest/services/dc_slr/slr_1ft/MapServer/0"}
  "1.5": {url: "https://coast.noaa.gov/arcgis/rest/services/dc_slr/slr_1_5ft/MapServer/0"}
  "2.0": {url: "https://coast.noaa.gov/arcgis/rest/services/dc_slr/slr_2ft/MapServer/0"}
  "2.5": {url: "https://coast.noaa.gov/arcgis/rest/services/dc_slr/slr_2_5ft/MapServer/0"}
  "3.0": {url: "https://coast.noaa.gov/arcgis/rest/services/dc_slr/slr_3ft/MapServer/0"}
  "3.5": {url: "https://coast.noaa.gov/arcgis/rest/services/dc_slr/slr_3_5ft/MapServer/0"}
  "4.0": {url: "https://coast.noaa.gov/arcgis/rest/services/dc_slr/slr_4ft/MapServer/0"}
  "4.5": {url: "https://coast.noaa.gov/arcgis/rest/services/dc_slr/slr_4_5ft/MapServer/0"}
  "5.0": {url: "https://coast.noaa.gov/arcgis/rest/services/dc_slr/slr_5ft/MapServer/0"}
  "5.5": {url: "https://coast.noaa.gov/arcgis/rest/services/dc_slr/slr_5_5ft/MapServer/0"}
  "6.0": {url: "https://coast.noaa.gov/arcgis/rest/services/dc_slr/slr_6ft/MapServer/0"}
  "6.5": {url: "https://coast.noaa.gov/arcgis/rest/services/dc_slr/slr_6_5ft/MapServer/0"}
  "7.0": {url: "https://coast.noaa.gov/arcgis/rest/services/dc_slr/slr_7ft/MapServer/0"}
  "7.5": {url: "https://coast.noaa.gov/arcgis/rest/services/dc_slr/slr_7_5ft/MapServer/0"}
  "8.0": {url: "https://coast.noaa.gov/arcgis/rest/services/dc_slr/slr_8ft/MapServer/0"}
  "8.5": {url: "https://coast.noaa.gov/arcgis/rest/services/dc_slr/slr_8_5ft/MapServer/0"}
  "9.0": {url: "https://coast.noaa.gov/arcgis/rest/services/dc_slr/slr_9ft/MapServer/0"}
  "9.5": {url: "https://coast.noaa.gov/arcgis/rest/services/dc_slr/slr_9_5ft/MapServer/0"}
  "10.0": {url: "https://coast.noaa.gov/arcgis/rest/services/dc_slr/slr_10ft/MapServer/0"}
auth:
  mode: none
  user_agent: trid3nt_default

params:
  bbox: {type: bbox, required: true, quantize: round_6dp}
  scenario_ft: {type: enum, required: false, default: 1.0,
                values: [0.0, 0.5, 1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0,
                         5.5, 6.0, 6.5, 7.0, 7.5, 8.0, 8.5, 9.0, 9.5, 10.0]}

ingest:
  access: qgis_provider
  qgis_provider:
    provider: arcgisfeatureserver
    uri: "crs='EPSG:4326' url='{url}'"
    mode: open
  endpoint_by_param:
    param: scenario_ft
    map: {0.0: "0.0", 0.5: "0.5", 1.0: "1.0", 1.5: "1.5", 2.0: "2.0", 2.5: "2.5",
          3.0: "3.0", 3.5: "3.5", 4.0: "4.0", 4.5: "4.5", 5.0: "5.0", 5.5: "5.5",
          6.0: "6.0", 6.5: "6.5", 7.0: "7.0", 7.5: "7.5", 8.0: "8.0", 8.5: "8.5",
          9.0: "9.0", 9.5: "9.5", 10.0: "10.0"}

normalize:
  crs: "EPSG:4326"
  units: feet

output:
  layer_type: record
  ext: json

cache:
  ttl_class: live-no-cache
payload_estimate:
  model: bbox_area
  mb_per_sq_deg: 0.0
  floor_mb: 0.0

caveats:
  - "NOAA OCM SLR Viewer dissolved bathtub-inundation polygons above MHHW via a public ArcGIS MapServer, opened as a live map overlay; ONE scenario_ft level per call - the twin's multi-level fan_out-and-merge has no single-uri equivalent"
  - "the layer is drawn by QGIS from the service, so its features are on the map but not in the case store and no analysis reads them"
  - "0-10 ft in 0.5-ft steps, CONUS-only"
  - "model-callable, not matched: a sea-level-rise scenario surface answers no run window, so it carries no coverage row"

docstring: |-
  NOAA Sea Level Rise scenario inundation polygons for one level, added to the map.

  Opens NOAA's Office for Coastal Management (OCM) SLR Viewer dissolved
  inundation-area polygons for one ``scenario_ft`` level as a live layer
  served by QGIS's own ArcGIS FeatureServer provider.

  **When to use:**
  - User asks for the NOAA sea-level-rise map, or "what areas flood if sea
    level rises by 2 feet?"
  - Visual planning-level context beside a building or roads layer.

  **When NOT to use:**
  - To COMPUTE with the polygon - intersect with fields, an area figure.
    The overlay is drawn from the service and its features never reach the
    store; nothing downstream can read them.
  - Several scenario levels at once - call this once per level; there is no
    combined multi-level overlay.
  - Real-time / event-driven storm surge -> ``fetch_gtsm_tide_surge``.
  - Inland / non-coastal flooding -> ``fetch_fema_nfhl_zones``.
  - Outside CONUS. Marsh migration -> ``fetch_noaa_slr_marsh``.

  **Parameters:**
      bbox: ``(min_lon, min_lat, max_lon, max_lat)`` in EPSG:4326. Required.
      scenario_ft: One SLR level in feet, ``0`` to ``10`` in 0.5-ft steps.
          Defaults to ``1.0``.

  **Returns:**
      A record naming what was opened: the provider, the service uri behind
      the layer, the layer name and the bbox the map was taken to.
  **Error types:**
      - ``NOAA_SLR_SCENARIOSInputError``: bad bbox or scenario_ft
        (retryable=False).
      - ``NOAA_SLR_SCENARIOSUpstreamError``: the provider's own text when it
        cannot open the service (retryable=True).

  Requires a live QGIS session: the layer is opened in the user's QGIS, so a
  headless or direct call refuses by name rather than returning nothing.

  ``supports_global_query=False``. No API key required.
