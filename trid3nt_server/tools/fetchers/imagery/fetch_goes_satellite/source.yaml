# Router source spec (FETCHER FINALE WAVE 2, ADR 0111): the fetch_goes_satellite fold.
# Twin: fetch_goes_satellite.py -- single-band float32 physical-units GOES ABI imagery.
# Folds onto a library_delegate RASTER source (ingest.access: library_delegate): the
# delegate (goes_satellite.read) lists the most-recent MCMIPC key, reads the netCDF, and
# returns (array, transform, crs) for the shared COG writer. pre_resolve rounds valid_time
# to 15 min into the cache key; the em-dash in the LayerURI name is preserved byte-identical
# (ADR 0111 follow-up note). Scan-time provenance rides the channel (ADR 0110).
schema_version: v1
name: fetch_goes_satellite
source_class: goes_satellite
error_prefix: GOES
input_error_suffix: INPUT_INVALID
shape: raster-cog
supports_global_query: false
endpoints:
  archive_s3:
    url: https://noaa-goes19.s3.amazonaws.com/
auth:
  mode: none
  user_agent: trid3nt/0.1 (Hazard Modeling Agent; https://github.com/double-r-squared/trid3nt-qgis-plugin; agent@trid3nt.dev)
params:
  bbox:
    type: bbox
    schema_optional: true
    quantize: round_6dp
  band:
    type: str
    default: visible
  satellite:
    type: str
    default: goes-19
  target_res_deg:
    type: float
    schema_optional: true
ingest:
  access: library_delegate
  delegate:
    library: goes_mcmipc
    timeout_s: 600.0
hooks:
  delegate: goes_satellite.read
  delegate_validate: goes_satellite.validate
  pre_resolve: goes_satellite.resolve
  envelope: goes_satellite.envelope
normalize:
  crs: EPSG:4326
  units_by_param:
    param: band
    map:
      visible: reflectance
      ir_window: K
      water_vapor: K
output:
  layer_type: raster
  ext: tif
  role: context
  style:
    kind: continuous
  emit_bbox: false
  result_model: GOESSatelliteLayerURI
  provenance: true
cache:
  ttl_class: dynamic-1h
payload_estimate:
  model: bbox_area
  mb_per_sq_deg: 0.5
  floor_mb: 0.05
caveats:
- Most-recent ABI L2 MCMIPC single-band float32 COG (reflectance for visible, brightness temperature K for ir_window / water_vapor) reprojected to EPSG:4326 over the bbox from the public NOAA Big-Data Program S3 archive (anonymous, no key). CONUS-only; a bbox entirely off the sector raises a typed GOES_EMPTY.
- This tool always fetches the MOST-RECENT observation (15-minute valid_time cache rounding); it does NOT replay a historical valid_time. Use fetch_goes_archive_animation for a past-date loop.
- bbox is required (a sector-wide MCMIPC raster is ~50 MB); a missing bbox raises a typed BBOX_REQUIRED.
corpus:
- show me the current satellite image of the hurricane
- I want GOES-16 infrared imagery for the storm approaching the Gulf Coast
- display the current cloud cover over the wildfire area
- show me GOES satellite for near-real-time weather context
- I need current CONUS cloud imagery for the tropical cyclone
- overlay GOES water vapor channel on the map for synoptic context
- show me the satellite view of the storm right now
docstring: "GOES-16/17/18/19 ABI satellite imagery via NOAA Big-Data Program S3.\n\n**What it does:** Fetches the most-recent ABI L2 Multi-Channel Cloud and\nMoisture Imagery (MCMIPC) product from the public NOAA Big-Data Program S3\nbuckets, reprojects the requested band to EPSG:4326 over the requested bbox,\nand writes a COG to the 1-hour dynamic cache. Three bands: visible\nreflectance, IR window brightness temperature, and water-vapor brightness\ntemperature. The CONUS sector refreshes every 5 minutes.\n\n**When to use:**\n- User asks to \"show satellite imagery\", \"show cloud cover\", or \"show the\n  storm on satellite\" for any CONUS or near-CONUS location.\n- Current-conditions weather context for a hurricane or severe-weather\n  narration — visible band shows cloud structure; IR window shows storm\n  tops; water vapor shows upper-level moisture.\n- Near-real-time storm monitoring alongside NEXRAD radar overlays.\n- Any map view that benefits from a live geostationary background\
  \ to\n  orient the user relative to current cloud/storm structure.\n\n**When NOT to use:**\n- DO NOT use for precipitation data — GOES CMI bands are radiometric\n  measurements (reflectance / brightness temperature), not rainfall;\n  use ``fetch_mrms_qpe`` for gauge-corrected rain accumulation.\n- DO NOT use when the bbox is outside the CONUS sector (~-153 W to -52 W,\n  14 N to 57 N) — the MCMIPC product is CONUS-only; full-disk imagery is\n  not served by this tool.\n- DO NOT use for historical replay at a specific valid time — this tool\n  always fetches the most-recent observation; a future ``valid_time``\n  param is in scope for v0.2.\n- DO NOT use for precipitation-radar products — use\n  ``show_nexrad_radar`` for that.\n\n**Parameters:**\n- ``bbox`` (tuple[float, float, float, float]): ``(min_lon, min_lat,\n  max_lon, max_lat)`` in EPSG:4326. Required (full-disk download is\n  ~50 MB per band; bbox is mandatory). Example for Tampa Bay:\n  ``(-83.0, 27.0, -81.5, 28.5)``.\n- ``band``\
  \ (str, default ``\"visible\"``): ``\"visible\"`` (ABI band 2,\n  0.64 µm, reflectance 0-1.5), ``\"ir_window\"`` (ABI band 13, 10.35 µm,\n  brightness temperature in K), ``\"water_vapor\"`` (ABI band 8, 6.19 µm,\n  brightness temperature in K).\n- ``satellite`` (str, default ``\"goes-19\"``): which GOES-R bird to read.\n  ``\"goes-19\"`` (current operational GOES-East, 75.2W, since 2025-04-07 --\n  eastern CONUS / Gulf / Atlantic), ``\"goes-18\"`` (current operational\n  GOES-West, Pacific / western CONUS), ``\"goes-16\"`` (historical GOES-East,\n  decommissioned 2025-04-07 -- data distribution ended, kept for archival\n  lookups), ``\"goes-17\"`` (historical GOES-West). Accepts forgiving spellings\n  -- ``\"GOES-18\"``, ``\"goes18\"``, ``\"G18\"``, a bare ``\"18\"``, and directional\n  ``\"GOES-East\"`` / ``\"GOES-West\"`` (mapped to goes-19 / goes-18) -- all\n  normalized internally; an unrecognized token raises a typed input error.\n\n**Returns:** A ``LayerURI`` pointing at a float32\
  \ COG in the cache bucket\n(``s3://trid3nt-cache/cache/dynamic-1h/goes_satellite/<key>.tif``).\n``layer_type=\"raster\"``, ``role=\"context\"``. ``units=\"reflectance\"`` for\nvisible, ``\"K\"`` for IR/WV. EPSG:4326, ~0.02 degree (~2 km) resolution.\n\n**Cross-tool dependencies:**\n- Pairs with ``show_nexrad_radar`` for combined radar + satellite\n  overlays during storm narrations.\n- Typically requested alongside ``fetch_nws_alerts_conus`` for real-time\n  storm context.\n- Pairs with ``fetch_mrms_qpe`` when the user wants both cloud context\n  and precipitation accumulation.\n\nFR-CE-8: ``read_through`` with ``ttl_class=\"dynamic-1h\"``; cache key is\nSHA-256 over ``(bbox-6dp, band, satellite, valid_time_rounded_15min)`` so\na fresh observation within the same hour can trigger a fresh fetch while\nrepeated queries hit the cache."
