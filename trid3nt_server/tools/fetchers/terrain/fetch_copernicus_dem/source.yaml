# The Copernicus GLO-30 global 30 m DEM over the Planetary Computer STAC catalog
# (first-valid mosaic, metres, -9999 nodata). A SOURCE: it states a terrain
# coverage row, so the match may pick it and the gate hands the model its schema
# on that pick - which is why it carries no corpus and is never ranked by phrase.
# fetch_dem(source="copernicus"), _hydrology_common, model_debris_flow and
# compute_sediment_yield also resolve it in-process via TOOL_REGISTRY.
schema_version: v1

name: fetch_copernicus_dem
source_class: copernicus_dem
error_prefix: COPERNICUS_DEM
input_error_suffix: BBOX_INVALID
empty_error_suffix: NO_COVERAGE
shape: raster-cog
supports_global_query: false

endpoints:
  data:
    url: "https://planetarycomputer.microsoft.com/api/stac/v1"
vertical_datum: EGM2008 geoid (metres, positive up)
auth:
  mode: none

params:
  bbox: {type: bbox, required: true, quantize: round_6dp, error_suffix: BBOX_INVALID}
  # The SAMPLE LATTICE, declared, and the parity seam. GLO-30's own tiles are
  # 3600 px per degree (1 arcsecond) with their pixel edges on multiples of
  # 1/3600 from the prime meridian, so px_per_deg=3600 returns the SOURCE PIXELS
  # rather than a resample of them - which is what a consumer sampling this
  # raster at mesh nodes needs if its answers are to match an in-container
  # /vsicurl read of the same tiles. Absent (the default) keeps the metric grid.
  px_per_deg: {type: float, schema_optional: true, min: 60.0, max: 12000.0}
gates:
  max_bbox_deg2: 4.0

ingest:
  access: stac
  render: float
  native_cell_m: 30.0
  stac:
    root: "https://planetarycomputer.microsoft.com/api/stac/v1"
    collection: cop-dem-glo-30
    data_asset: data
    sign: planetary_computer
    select:
      mode: mosaic
  serialize:
    nodata: -9999.0
    dtype: float32

normalize:
  crs: "EPSG:4326"
  orientation: north_up
  units: meters
  quantity: elevation

output:
  layer_type: raster
  ext: tif
  role: input
  emit_bbox: true
  style:
    kind: continuous
    ramp: gray
    units: m

cache:
  ttl_class: static-30d
payload_estimate:
  model: bbox_area
  mb_per_sq_deg: 8.0
  floor_mb: 0.1

coverage:
-   data_class: terrain
    kind: measured
    extent:
      kind: surface
      rings:
      - [[-180.0, -90.0], [180.0, -90.0], [180.0, 90.0], [-180.0, 90.0]]
      note: Copernicus GLO-30, global land; a SURFACE model, so canopy and roofs
        are in it and the ocean reads about zero
    window:
      series: false
      latest: '2021-01-01'
    resolution_m: 30.0
    datum: EGM2008 geoid (metres, positive up)
    units:
      elevation: m
    value_column: elevation

caveats:
  - "GLO-30 is a SURFACE model (ocean reads ~0 m; no bathymetry); an off-globe / all-nodata window -> COPERNICUS_DEM_NO_COVERAGE (never a fabricated layer)"
  - "AOI-scoped (<= 4 deg^2); a US AOI prefers the finer 3DEP via fetch_dem"

# A covered source carries no corpus: its class phrasings route to find_sources.

docstring: |-
  Copernicus GLO-30: a 30 m SURFACE elevation model (canopy and roofs are in it;
  water reads about zero and it carries no bathymetry), read from the Microsoft
  Planetary Computer STAC as a first-valid mosaic over ``bbox`` and returned as a
  single-band float32 Cloud-Optimized GeoTIFF in metres on the EGM2008 geoid.

  ``px_per_deg=3600`` returns the SOURCE pixels rather than a resample of them.
  Its coverage row says where it reaches and how it compares with the finer
  alternatives; ``fetch_dem(source="copernicus")`` resolves this same reader.
