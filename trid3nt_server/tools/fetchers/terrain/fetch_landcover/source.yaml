# NLCD, opened through QGIS's OWN wcs provider in the session and exported back:
# the coverage is asked for in EPSG:4326 at the row's resolution lever, the
# background class collapses to the dataset's nodata on the way in, and the class
# palette is the style the service publishes, declared here.
schema_version: v1
name: fetch_landcover
# Declared confirm gate: the heavy raster fetch gets the canonical
# fetch-resolution confirm card (user controls resolution before the big fetch).
confirm_gate: fetch_resolution
source_class: landcover
error_prefix: LANDCOVER
shape: raster-cog
supports_global_query: false
endpoints:
  data:
    url: https://www.mrlc.gov/geoserver/mrlc_display/wcs
auth:
  mode: none
  user_agent: trid3nt/0.1 (Hazard Modeling Agent; https://github.com/double-r-squared/trid3nt-qgis-plugin; agent@trid3nt.dev)
params:
  bbox:
    type: bbox
    required: true
    quantize: round_6dp
    schema_optional: true
  dataset:
    type: str
    required: false
    default: nlcd_2021
  resolution_m:
    type: int
    required: false
    default: 30
gates:
  max_bbox_km2: 5000000.0
ingest:
  access: qgis_provider
  qgis_provider:
    provider: wcs
    uri: "crs=EPSG:4326&format=GeoTIFF&identifier={coverage}&url={url}"
    mode: materialise
    # The MRLC GeoServer serves at most this many pixels per axis; past it the
    # row refuses naming the spacing that fits.
    max_px: 4000
    # Class 0 is Background (open ocean, international waters) and is never a
    # legitimate NLCD code -- the real codes are 11-95.
    nodata_sentinel: 0
    coverage_by_year:
      2001: mrlc_display:NLCD_2001_Land_Cover_L48
      2004: mrlc_display:NLCD_2004_Land_Cover_L48
      2006: mrlc_display:NLCD_2006_Land_Cover_L48
      2008: mrlc_display:NLCD_2008_Land_Cover_L48
      2011: mrlc_display:NLCD_2011_Land_Cover_L48
      2013: mrlc_display:NLCD_2013_Land_Cover_L48
      2016: mrlc_display:NLCD_2016_Land_Cover_L48
      2019: mrlc_display:NLCD_2019_Land_Cover_L48
      2021: mrlc_display:NLCD_2021_Land_Cover_L48
  serialize:
    nodata: 255
    dtype: uint8
hooks:
  pre_resolve: landcover.pre_resolve
  envelope: landcover.envelope
normalize:
  crs: EPSG:4326
  units: nlcd_class_code
output:
  layer_type: raster
  ext: tif
  role: input
  style:
    kind: classed
    # The class colours and labels the MRLC GeoServer publishes for this
    # coverage's own style.
    classes:
    - [11, 11, "#476ba0", "Open Water"]
    - [12, 12, "#d1ddf9", "Perennial Ice/Snow"]
    - [21, 21, "#ddc9c9", "Developed, Open Space"]
    - [22, 22, "#d89382", "Developed, Low Intensity"]
    - [23, 23, "#ed0000", "Developed, Medium Intensity"]
    - [24, 24, "#aa0000", "Developed, High Intensity"]
    - [31, 31, "#b2ada3", "Barren Land (Rock/Sand/Clay)"]
    - [32, 32, "#f9f9f9", "Unconsolidated Shore"]
    - [41, 41, "#68aa63", "Deciduous Forest"]
    - [42, 42, "#1c6330", "Evergreen Forest"]
    - [43, 43, "#b5c98e", "Mixed Forest"]
    - [51, 51, "#b0973d", "Dwarf Scrub (AK only)"]
    - [52, 52, "#ccba7c", "Shrub/Scrub"]
    - [71, 71, "#e2e2c1", "Grasslands/Herbaceous"]
    - [72, 72, "#d1d182", "Sedge/Herbaceous (AK only)"]
    - [73, 73, "#99c246", "Lichens (AK only)"]
    - [74, 74, "#82ba9e", "Moss (AK only)"]
    - [81, 81, "#dbd83d", "Pasture/Hay"]
    - [82, 82, "#aa7028", "Cultivated Crops"]
    - [90, 90, "#bad8ea", "Woody Wetlands"]
    - [95, 95, "#70a3ba", "Emergent Herbaceous Wetlands"]
  result_model: LandcoverResult
cache:
  ttl_class: static-30d
payload_estimate:
  model: bbox_area
  mb_per_sq_deg: 2.0
  floor_mb: 0.1
coverage:
-   data_class: land cover
    kind: modelled
    extent:
      kind: surface
      rings:
      - [[-125.0, 24.0], [-66.0, 24.0], [-66.0, 50.0], [-125.0, 50.0]]
      note: NLCD, CONUS L48 only
    window:
      series: false
      latest: '2021-01-01'
      cadence: ~2-3 yr epochs
    resolution_m: 30.0
    units:
      nlcd_class_code: class
    value_column: nlcd_class_code
corpus:
- show me land use data for South Florida
- I need NLCD landcover for the Houston area
- fetch land classification raster for this watershed before a hydraulic model setup
- what is the land cover around the Everglades?
- give me land-use categories for the Sacramento Valley
- I want a landcover map for the wildland-urban interface near Chico, CA
- show me the vegetation map for this Texas coastal plain
- I need landcover to compute Manning's roughness for a hydraulic model
docstring: |-
  Fetch landcover classification raster (NLCD or ESA WorldCover) for a bbox.

  Access pattern: Tier 2, an OGC service -- the MRLC WCS endpoint.

  **What it does:** Downloads an NLCD or ESA WorldCover landcover GeoTIFF
  clipped to the requested bbox via the MRLC WCS 1.0.0 GeoServer endpoint.
  Returns a dict containing a ``LayerURI`` plus a ``nlcd_vintage_year``
  sidecar field that downstream hydraulic model setup uses to validate
  Manning's roughness mappings before model invocation (the datum-and-class gate --
  no silent wrong answers).

  **When to use:**
  - A hydraulic model setup requires
    landcover for Manning's roughness assignment -- this is the canonical
    supply tool.
  - User asks "what land cover exists in this area?"
  - Exposure analysis: intersect a hazard footprint with impervious-surface
    or developed-land classes.
  - Visualization using the ``categorical_landcover`` QML style preset.

  **When NOT to use:**
  - Global landcover -- pass ``dataset="esa_worldcover_2021"`` to opt into
    the ESA WorldCover branch, but that branch currently raises
    ``UpstreamAPIError`` (forward-looking).
  - Single-point landcover classification -- this tool returns a raster;
    read the class at a point with ``probe_point``.
  - Continent-scale bboxes (> 5,000,000 km^2) -- the tool raises
    ``BboxInvalidError`` at that hard ceiling. A state-scale or
    multi-state-scale bbox at 30 m is REFUSED with the pixel-budget error
    naming the coarser spacing that fits; pass that ``resolution_m``.

  **Parameters:**
  - ``bbox`` (tuple[float,float,float,float]): ``(min_lon, min_lat, max_lon,
    max_lat)`` in EPSG:4326. Continent-scale bboxes (> 5e6 km^2) are
    rejected; a bbox needing more than 4000 px/axis at the asked
    ``resolution_m`` is refused naming the spacing that fits.
  - ``dataset`` (str, default ``"nlcd_2021"``): ``"nlcd"`` (default vintage)
    or ``"nlcd_YYYY"`` (e.g. ``"nlcd_2021"``, ``"nlcd_2019"``,
    ``"nlcd_2016"``) or ``"esa_worldcover_2021"`` (forward-looking). Bare
    ``"nlcd"`` and ``"nlcd_"`` are accepted as aliases for the default
    vintage. Valid NLCD years: 2001, 2004, 2006, 2008, 2011, 2013, 2016,
    2019, 2021.
  - ``resolution_m`` (int, default 30): pixel grid spacing in meters, and
    the spacing fetched -- nothing coarsens it. The native NLCD grid is
    30 m (a finer ask is served at 30 m); pass a coarser value (60, 120,
    300, 600 m) for a state-scale or multi-state-scale AOI.

  **Returns:**
  A dict with keys:
  - ``layer`` (LayerURI): COG at
    ``s3://trid3nt-cache/cache/static-30d/landcover/<key>.tif``; ``units="nlcd_class_code"``.
  - ``nlcd_vintage_year`` (int): vintage year consumed by hydraulic
    model setup to validate the Manning's mapping CSV.
  - ``dataset`` (str): echo of the input dataset string for provenance.
  - ``source`` (str): ``"mrlc-wcs"`` for NLCD.
  - ``effective_resolution_m`` (int): actual pixel spacing used (equals
    ``resolution_m`` when at native 30 m; coarser when the bbox was large).
  - ``native_resolution_m`` (int): NLCD native resolution (30 m).
  - ``downsampled`` (bool): True when ``effective_resolution_m > native_resolution_m``.
