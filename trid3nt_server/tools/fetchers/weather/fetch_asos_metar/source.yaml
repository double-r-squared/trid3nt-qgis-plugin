# IEM ASOS/METAR station observations: a multi-state station discovery in the resolve
# phase, then ONE bulk CSV as the main fetch, one point per observation row.
# The row per OBSERVATION stands: the weather slot reads one instant's whole set of
# columns off one row (the humidity trio is computed from the temperature and the dew
# point AT THE SAME instant), so a per-station row would have to carry one wide table
# rather than a series per variable, and the station executor serializes a single
# variable. Converting is the executor's wide table, both packages, the slot's own
# grouping and the stated-night fixture together.
schema_version: v1
name: fetch_asos_metar
source_class: asos_metar
error_prefix: ASOS_METAR
shape: vector-fgb
supports_global_query: false
endpoints:
  data:
    url: https://mesonet.agron.iastate.edu/cgi-bin/request/asos.py
auth:
  mode: none
  user_agent: trid3nt/0.1 (Hazard Modeling Agent; https://github.com/double-r-squared/trid3nt-qgis-plugin;
    agent@trid3nt.dev)
params:
  bbox:
    type: bbox
    required: true
    quantize: round_6dp
  start_time:
    type: str
    required: false
    schema_optional: true
  end_time:
    type: str
    required: false
    schema_optional: true
  search_radius_km:
    type: float
    default: 60.0
    min: 0.0
    max: 200.0
hooks:
  resolve_build: asos_metar.resolve_build
  resolve_parse: asos_metar.resolve_parse
  build_request: asos_metar.build_request
  parse_response: asos_metar.parse_response
normalize:
  crs: EPSG:4326
  units: mixed
output:
  layer_type: vector
  ext: fgb
  role: context
  style:
    kind: reference
    geometry: point
  emit_bbox: true
cache:
  ttl_class: dynamic-1h
payload_estimate:
  model: per_feature
  features_per_sq_deg: 36.0
  kb_per_feature: 0.7
  floor_mb: 0.001
fields:
  site: {field: station}
  time: {field: valid}
  air_temperature: {field: tmpf, unit: degF}
  dew_point: {field: dwpf, unit: degF}
  relative_humidity: {field: relh, unit: "%"}
  wind_speed: {field: sknt, unit: kt}
  wind_from: {field: drct, unit: degree}
  pressure: {field: mslp, unit: hPa}
  cloud_cover:
    field: skyc1
    table: {CLR: 0.0, SKC: 0.0, NCD: 0.0, NSC: 0.0, FEW: 2.0, SCT: 4.0, BKN: 6.0, OVC: 8.0, VV: 8.0}
    unit: octa
    cite: "Federal Meteorological Handbook No. 1 (OFCM FCM-H1) sky cover contractions: CLR/SKC no cloud, FEW over 0 to 2 eighths, SCT 3 to 4, BKN 5 to 7, OVC 8, VV an obscured sky read as covered. Where a class spans eighths the value is the one this table has always carried (FEW 2, SCT 4, BKN 6), which the handbook does not state."
  rain: {field: p01i, unit: in}
coverage:
- data_class: weather forcing
  kind: measured
  reach_km: 60.0
  extent:
    kind: stations
    rings:
      - [[-125.0, 24.0], [-66.0, 24.0], [-66.0, 50.0], [-125.0, 50.0]]
      - [[-172.0, 51.0], [-129.0, 51.0], [-129.0, 72.0], [-172.0, 72.0]]
      - [[-161.0, 18.0], [-154.0, 18.0], [-154.0, 23.0], [-161.0, 23.0]]
      - [[-68.5, 17.0], [-64.0, 17.0], [-64.0, 19.0], [-68.5, 19.0]]
      - [[144.0, 13.0], [146.5, 13.0], [146.5, 21.0], [144.0, 21.0]]
      - [[-171.5, -15.0], [-169.0, -15.0], [-169.0, -13.0], [-171.5, -13.0]]
    note: IEM ASOS/METAR network, US + territories airports
    discover: bbox
  window:
    series: true
    cadence: hourly (plus SPECI); IEM archive reaches the 1920s at some sites
  datum: null

caveats:
- Iowa State IEM ASOS/METAR hourly surface observations; multi-state per-state-GeoJSON discovery (states
  overlapping the bbox) then ONE bulk IEM CGI CSV request; one point per observation row.
  No stations in bbox / no rows -> ASOS_METAR_EMPTY.
docstring: |-
  Fetch ASOS/METAR surface weather observations as a point FlatGeobuf.

  Retrieves hourly surface weather observations from all Automated Surface
  Observing System (ASOS) stations within the requested bbox, sourced from
  the Iowa State University Iowa Environmental Mesonet (IEM) CGI archive.
  Observations include temperature, dewpoint, wind speed/direction/gust,
  altimeter setting, MSLP, visibility, sky cover, and present-weather codes.

  When to use:
    - User asks for current or historical surface weather at an airport or
      weather station (e.g., "what was the wind at Fort Myers yesterday?",
      "show me temperature readings near Naples, FL").
    - Hazard-event context: surface met conditions before/during a flood,
      hurricane, or wildfire event ("what were wind speeds when Ian made
      landfall?").
    - Multi-station spatial overlay of surface weather for a region.
    - Providing boundary-layer meteorology input for hazard models that need
      observed wind, humidity, or temperature fields.

  When NOT to use:
    - Forecasts or future weather -- ASOS is an observational archive; use
      ``fetch_nws_event`` or ``fetch_nws_alerts_conus`` for current NWS
      products, or ``fetch_hrrr_forecast`` for model forecasts.
    - Gridded analysis or reanalysis over large areas -- use ``fetch_era5_reanalysis``
      (global, hourly ERA5) or ``fetch_mrms_qpe`` (radar QPE for precipitation).
    - Fire-weather station observations outside IEM ASOS coverage -- use
      ``fetch_raws_weather`` for RAWS (remote automated weather stations
      used by fire agencies, often in non-airport locations).
    - Tide gauge / coastal water-level observations -- use
      ``fetch_noaa_coops_tides`` for NOAA CO-OPS.

  Parameters:
      bbox: ``(min_lon, min_lat, max_lon, max_lat)`` in EPSG:4326. Required.
          All IEM-archived ASOS stations whose coordinates fall inside this
          bbox are queried. Maximum ``_MAX_STATIONS`` (100) stations.
          Example for Fort Myers / Naples area:
          ``(-82.5, 25.8, -81.0, 27.5)``.
      start_time: Start of observation window as ISO-8601 date or datetime
          (e.g. ``"2024-09-26"`` or ``"2024-09-26T00:00:00Z"``).
          Defaults to 24 hours before ``end_time`` (or 24 hours before now
          when both are omitted). Typical recent data available with ~1-hour lag.
      search_radius_km: how far OUTSIDE the bbox stations are looked for,
          in kilometres (default 60). An airport stands where a runway fits
          rather than on the water a question is about, so a box the size of
          that water usually holds no station; the discovery box is the request
          bbox grown by this radius.
      end_time: End of observation window as ISO-8601 date or datetime
          (e.g. ``"2024-09-28"``). Defaults to current UTC time when omitted.
          Wide windows (> 30 days x many stations) may produce large payloads
          (> 25 MB); the payload-warning system will surface a confirmation
          prompt before fetching.

  Returns:
      ``LayerURI`` pointing at a FlatGeobuf in the cache bucket:
      ``s3://trid3nt-cache/cache/dynamic-1h/asos_metar/<key>.fgb``
      - ``layer_type="vector"``, ``role="context"``, ``units="mixed"``
        (temperature in degF, wind in knots, pressure in inHg/hPa,
        visibility in miles -- standard ASOS/METAR units).
      - Geometry: Point at each ASOS station's coordinates, EPSG:4326.
      - Properties per observation: every column the IEM service holds,
        under its own name: ``station`` (ICAO/FAA id), ``valid`` (UTC
        observation time), ``lon``, ``lat``, ``elevation`` (m), ``tmpf``
        (degF), ``dwpf`` (degF), ``relh`` (%), ``sknt`` (wind kt), ``drct``
        (wind dir deg), ``gust`` (gust kt), ``alti`` (altimeter inHg),
        ``mslp`` (MSLP hPa), ``p01i`` (precipitation in the past hour,
        inches; a trace is null), ``vsby`` (visibility mi), ``wxcodes``
        (present weather), ``skyc1``..``skyc4`` and ``skyl1``..``skyl4``
        (sky cover and layer height ft), ``feel`` (apparent temperature
        degF), ``peak_wind_gust`` / ``peak_wind_drct`` / ``peak_wind_time``,
        ``ice_accretion_1hr``/``3hr``/``6hr``, ``snowdepth``, and ``metar``
        (the raw report text). Missing values are ``null``.

  Cache: ``dynamic-1h`` -- identical ``(bbox-4dp, start_time, end_time)`` calls
  within the same UTC hour reuse the cached FlatGeobuf.

  Cross-tool dependencies:
      - Composes WITH: ``geocode_location``
        (bbox derivation from place name), a run_pyqgis snippet
        (wind and pressure claims from ASOS).
      - Complements: ``fetch_era5_reanalysis`` (gridded global reanalysis),
        ``fetch_mrms_qpe`` (radar precipitation), ``fetch_satellite_imagery``
        (satellite imagery), ``fetch_raws_weather`` (fire-weather stations).
      - Superseded for current NWS alerts: ``fetch_nws_alerts_conus``,
        ``fetch_nws_event``.
      - Upstream: IEM ASOS CGI + per-state ASOS network GeoJSON
        (mesonet.agron.iastate.edu).

  Errors:
      - ``ASASMETARInputError``: invalid bbox or date strings (retryable=False).
      - ``ASASMETARUpstreamError``: IEM network failure or malformed CSV
        (retryable=True).
      - ``ASASMETAREmptyError``: no ASOS stations in bbox or all observations
        missing coordinates (retryable=False).


