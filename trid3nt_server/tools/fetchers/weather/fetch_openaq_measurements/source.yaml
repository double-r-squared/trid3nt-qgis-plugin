# OpenAQ v3 latest measurements: offset paging over the locations sweep, then a
# per-location latest enrich that joins each sensor value to its parameter and expands
# into one point per station and parameter.
# Not on the field map: the walk matches a page NUMBER against the rows that came back
# because no page count is published, and the detail join EXPANDS one detail record
# into many output points through a nested sensor-to-parameter map.
schema_version: v1
name: fetch_openaq_measurements
source_class: openaq
error_prefix: OPENAQ
input_error_suffix: INPUT_INVALID
shape: vector-fgb
supports_global_query: false
endpoints:
  data:
    url: https://api.openaq.org/v3/locations
auth:
  mode: api_key_env
  credential:
    name: openaq
    label: OpenAQ
    env_var: TRID3NT_OPENAQ_API_KEY
  user_agent: trid3nt/0.1 (Hazard Modeling Agent; https://github.com/double-r-squared/trid3nt-qgis-plugin;
    agent@trid3nt.dev)
params:
  bbox:
    type: bbox
    required: true
    quantize: round_6dp
  parameters:
    type: str_list
    required: false
    schema_optional: true
hooks:
  build_request: openaq_measurements.build_request
  next_page: openaq_measurements.next_page
  parse_response: openaq_measurements.parse_response
  enrich_plan: openaq_measurements.enrich_plan
  enrich_merge: openaq_measurements.enrich_merge
ingest:
  chained:
    max_detail_fetches: 2000
normalize:
  crs: EPSG:4326
output:
  layer_type: vector
  ext: fgb
  role: primary
  style:
    kind: reference
    geometry: point
  emit_bbox: true
cache:
  ttl_class: dynamic-1h
payload_estimate:
  model: per_feature
  features_per_sq_deg: 12.0
  kb_per_feature: 1.5
  floor_mb: 0.001
fields:
  site: {field: id}
  site_name: {field: name}
  time: {field: latest.datetime.utc}
  quantity: {field: sensor.parameter.name}
  value: {field: latest.value, unit: {field: sensor.parameter.units}}
caveats:
- 'OpenAQ v3 global air-quality LATEST measurements (keyed: the person''s OpenAQ key).
  Paginated /v3/locations sweep + per-location /latest fan-out + sensor->parameter join; one point
  per (station, parameter). Worldwide. No key -> KEY_REQUIRED before the network, a key OpenAQ refuses -> KEY_REJECTED;
  empty bbox -> honest header-only FGB.'
- "model-callable, not matched: air quality is not one of the seventeen data classes, so it carries no coverage row"
docstring: |-
  OpenAQ global air-quality latest measurements as a FlatGeobuf point layer.

  What it does:
      Fetches the most recent ground-station air-quality measurements
      (PM2.5, PM10, NO2, O3, SO2, CO, and other pollutants) from the OpenAQ
      v3 API for every monitoring station inside ``bbox``, returning one
      FlatGeobuf POINT feature per (station, parameter) latest reading with
      the reading, its parameter and unit and its time as properties. OpenAQ
      aggregates reference monitors and low-cost sensors from national
      networks WORLDWIDE -- this is the GLOBAL complement to the US-only
      AirNow / EPA AQS surface.

  When to use:
      - User asks about air quality / pollution anywhere outside the US, or
        wants a global-coverage source ("what's the PM2.5 in Delhi right
        now?", "show NO2 monitoring stations around London").
      - Overlaying current pollutant concentrations on a wildfire-smoke,
        dust-storm, or industrial-hazard footprint.
      - Pairing observed ground-station air quality with modeled smoke
        (HRRR-Smoke) or satellite aerosol layers.

  When NOT to use:
      - DO NOT use for US-only regulatory AQI when a US source is preferred -- AirNow / EPA AQS give the official US AQI; OpenAQ ingests US data too
        but is not the US regulatory authority.
      - DO NOT use for HISTORICAL time-series -- this returns LATEST values
        only; use the OpenAQ ``/sensors/{id}/measurements|hours|days``
        aggregate endpoints (a future tool) for time-series.
      - DO NOT use for modeled / forecast air quality -- OpenAQ is
        ground-truth observations; use HRRR-Smoke / CAMS for forecasts.
      - DO NOT use for satellite column densities (NO2/aerosol from
        TROPOMI/Sentinel-5P) -- those are a different (raster) source.

  Parameters:
      bbox: REQUIRED ``(min_lon, min_lat, max_lon, max_lat)`` envelope in
          EPSG:4326 (= ``(west, south, east, north)``). This is the SAME
          axis order OpenAQ v3 expects, so no flip. Example:
          ``(76.8, 28.4, 77.4, 28.9)`` for the Delhi NCR returns the city's
          monitoring stations. Narrow the bbox to a city/metro: a
          country-sized sweep is capped at 2000 stations.
      parameters: Optional pollutant filter -- a single name or a list,
          case-insensitive, each one of ``pm25`` / ``pm10`` / ``pm1`` /
          ``no2`` / ``no`` / ``nox`` / ``o3`` / ``so2`` / ``co`` / ``co2`` /
          ``bc`` / ``ch4`` / ``nh3``. Defaults to the six core pollutants
          (``pm25, pm10, no2, o3, so2, co``). Applied client-side after the
          sensor->parameter join.

  Returns:
      A ``LayerURI`` pointing at a FlatGeobuf in the cache bucket
      ``s3://<cache>/cache/dynamic-1h/openaq/<key>.fgb`` containing point
      geometries (``Point`` in EPSG:4326), every field the service returns
      under its own name: the location record (``id``, ``name``, ``locality``,
      ``timezone``, ``country.code``, ``country.name``, ``owner.*``,
      ``provider.*``, ``isMobile``, ``isMonitor``, ``coordinates.*``,
      ``datetimeFirst.*``, ``datetimeLast.*``, ``instruments`` and ``sensors``
      as JSON text), the latest reading (``latest.value``,
      ``latest.datetime.utc``, ``latest.datetime.local``, ``latest.sensorsId``,
      ``latest.coordinates.*``) and the sensor that took it (``sensor.id``,
      ``sensor.name``, ``sensor.parameter.name``, ``sensor.parameter.units``,
      ``sensor.parameter.displayName``). ``layer_type="vector"``,
      ``role="primary"``, ``units=None`` (``sensor.parameter.units`` carries
      the pollutant unit, which varies by parameter). OpenAQ states no
      per-reading accuracy.

  Raises:
      ``KEY_REQUIRED``: no OpenAQ key is stored -- raised BEFORE any network call; the person is asked on a card (OpenAQ has no public
          mirror, so this honest typed error IS the degrade).
      ``KEY_REJECTED``: OpenAQ refused the stored key (401/403).
      ``OpenAQInputError``: bad bbox or unknown parameter name.
      ``OpenAQUpstreamError``: OpenAQ 5xx / 422 / non-JSON / network failure
          (retryable).

  Cross-tool dependencies:
      Consumes optional bbox from ``fetch_administrative_boundaries`` /
      ``geocode_location`` (geocode "Delhi" -> derive bbox -> call this tool).
      Pairs with ``fetch_hrrr_smoke`` / satellite aerosol layers for
      observed-vs-modeled air-quality comparison.

  Cache: ``dynamic-1h`` (OpenAQ latest values refresh as new readings land;
  an hourly window balances freshness against the API rate budget). Cache
  key: SHA-256 of (bbox rounded-6dp, parameters) + the top-of-hour vintage.
  The key omits the person's API key -- the underlying measurements do
  not vary by caller.
