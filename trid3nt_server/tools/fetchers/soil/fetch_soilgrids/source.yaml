# ISRIC SoilGrids 2.0 global 250 m soil properties. The Homolosine VRT is windowed in the
# SOURCE projection (bounds transformed and densified, with a floor/ceil and a 2 px pad),
# the intersecting members read through the coalescing transport, the window reprojected
# to EPSG:4326 bilinear, and the fixed-point Int16 scaled to physical units per property.
# Read here rather than through the session's own provider: MEASURED, the VRT opens
# with no authority CRS (it is Homolosine), so an exported window would be
# georeferenced by nothing.
schema_version: v1

name: fetch_soilgrids
source_class: soilgrids
input_error_suffix: INPUT_INVALID
empty_error_suffix: EMPTY
shape: raster-cog
supports_global_query: false

endpoints:
  data:
    url_template: "https://files.isric.org/soilgrids/latest/data/{soil_property}/{soil_property}_{depth}_{statistic}.vrt"
auth:
  mode: none
  user_agent: "trid3nt/0.1 (Hazard Modeling Agent; https://github.com/double-r-squared/trid3nt-qgis-plugin; agent@trid3nt.dev)"

params:
  bbox: {type: bbox, required: true, quantize: round_6dp}
  soil_property:
    type: enum
    default: clay
    lowercase: true
    values: [bdod, cec, cfvo, clay, nitrogen, ocd, ocs, phh2o, sand, silt, soc]
    aliases:
      ph: phh2o
      soil_ph: phh2o
      organic_carbon: soc
      soil_organic_carbon: soc
      bulk_density: bdod
      clay_content: clay
      sand_content: sand
      silt_content: silt
      coarse_fragments: cfvo
      cation_exchange_capacity: cec
      organic_carbon_density: ocd
      organic_carbon_stock: ocs
      total_nitrogen: nitrogen
  depth:
    type: enum
    default: "0-5cm"
    lowercase: true
    values: ["0-5cm", "5-15cm", "15-30cm", "30-60cm", "60-100cm", "100-200cm", "0-30cm"]
    aliases:
      "0-5": "0-5cm"
      "0-5 cm": "0-5cm"
      "5-15": "5-15cm"
      "5-15 cm": "5-15cm"
      "15-30": "15-30cm"
      "15-30 cm": "15-30cm"
      "30-60": "30-60cm"
      "30-60 cm": "30-60cm"
      "60-100": "60-100cm"
      "60-100 cm": "60-100cm"
      "100-200": "100-200cm"
      "100-200 cm": "100-200cm"
      "0-30": "0-30cm"
      "0-30 cm": "0-30cm"
  statistic:
    type: enum
    default: mean
    values: [mean, Q0.05, Q0.5, Q0.95, uncertainty]
    aliases:
      median: Q0.5
      q0.05: Q0.05
      q0.5: Q0.5
      q0.95: Q0.95
gates:
  max_bbox_deg2: 0.5

ingest:
  access: projected_vrt_window
  serialize:
    nodata: -9999.0
    dtype: float32
  projected_window:
    coverage_bbox: [-180.0, -62.0, 180.0, 84.0]
    src_nodata: -32768
    densify_pts: 21
    pad_px: 2
    target_res_deg: 0.0025
    max_window_pixels: 400000000
    scale_by_param:
      param: soil_property
      map: {bdod: 100.0, cec: 10.0, cfvo: 10.0, clay: 10.0, nitrogen: 100.0, ocd: 10.0, ocs: 10.0, phh2o: 10.0, sand: 10.0, silt: 10.0, soc: 10.0}
      override:
        param: statistic
        map: {uncertainty: 10.0}

normalize:
  crs: "EPSG:4326"
  units_by_param:
    param: soil_property
    map: {bdod: "kg/dm3", cec: "cmol(c)/kg", cfvo: "cm3/100cm3", clay: percent, nitrogen: "g/kg", ocd: "kg/m3", ocs: "kg/m2", phh2o: pH, sand: percent, silt: percent, soc: "g/kg"}
    override:
      param: statistic
      map: {uncertainty: ratio}

output:
  layer_type: raster
  ext: tif
  role: input
  style:
    kind: continuous

cache:
  ttl_class: static-30d
payload_estimate:
  model: bbox_area
  mb_per_sq_deg: 1.5
  floor_mb: 0.1

coverage:
-   data_class: soil
    kind: modelled
    extent:
      kind: surface
      rings:
      - [[-180.0, -62.0], [180.0, -62.0], [180.0, 84.0], [-180.0, 84.0]]
      note: ISRIC SoilGrids 2.0, global land excluding Antarctica and far Arctic
    window:
      series: false
    resolution_m: 250.0
    # WHICH PROPERTY a soil need asks for: the slot names it in its own word and
    # this table is the word the property's VRT is named by.
    ask: {soil_property: "need:of"}
    vocabulary:
      sand: sand
      silt: silt
      clay: clay
      organic_carbon: soc

caveats:
  - "the properties, depth intervals, statistics and conversion factors are those ISRIC publishes: the WebDAV listing of files.isric.org/soilgrids/latest/data (bdod, cec, cfvo, clay, nitrogen, ocd, ocs, phh2o, sand, silt, soc; mean, Q0.05, Q0.5, Q0.95, uncertainty) and the SoilGrids FAQ table of mapped units and conversion factors (docs.isric.org/globaldata/soilgrids/SoilGrids_faqs_01.html); the water-content layers that table lists (wv0010, wv003, wv1500) are not in the listing; ocs is served for 0-30cm only; the uncertainty layer is (Q0.95-Q0.05)/Q0.50 multiplied by 10"
  - "ISRIC SoilGrids 2.0 global 250 m ML soil-property prediction; an all-NoData window (ocean / off the soil land surface) -> SOILGRIDS_EMPTY (never a fabricated layer)"
  - "AOI-scoped (<= 0.5 deg^2); a 250 m ML prediction, NOT a surveyed NRCS map unit -- for US work use fetch_statsgo_soils"

# corpus lifted from sibling corpus.yaml.

docstring: |-
  ISRIC SoilGrids 2.0 global soil-property raster (every property the service serves: clay, sand, silt, soc, bdod, pH, CEC, coarse fragments, nitrogen, carbon density and stock).

  **What it does:** Fetches the ISRIC SoilGrids 2.0 global ~250 m prediction of
  a soil property at a standard depth for the requested bbox. Opens the global
  SoilGrids VRT mosaic via GDAL ``/vsicurl/`` byte-range HTTP, window-reads only
  the overlapping native (Interrupted Goode Homolosine) pixels, reprojects them
  to EPSG:4326 at ~250 m, applies the property scaling to recover physical
  units, and writes a single-band float32 COG to the 30-day cache.

  This is the complement to the STATSGO/SSURGO chain
  (``fetch_statsgo_soils``). Use it for soil texture, organic carbon,
  bulk density, or pH at a consistent 250 m schema.

  **Properties (``soil_property``):**
  - ``"clay"`` / ``"sand"`` / ``"silt"`` -- texture fraction, percent.
  - ``"soc"`` -- soil organic carbon, g/kg.
  - ``"bdod"`` -- bulk density of the fine earth fraction, kg/dm3.
  - ``"phh2o"`` -- pH measured in water.
  - ``"cec"`` -- cation exchange capacity at pH 7, cmol(c)/kg.
  - ``"cfvo"`` -- coarse fragments, volumetric, cm3/100cm3.
  - ``"nitrogen"`` -- total nitrogen, g/kg.
  - ``"ocd"`` -- organic carbon density, kg/m3.
  - ``"ocs"`` -- organic carbon stock, kg/m2, published for ``"0-30cm"`` only.

  **Statistics (``statistic``):** ``"mean"`` (default), the median ``"Q0.5"``,
  the 90 percent prediction interval's ``"Q0.05"`` and ``"Q0.95"``, and
  ``"uncertainty"`` -- the ratio (Q0.95 - Q0.05) / Q0.5, unitless.

  **Depths (``depth``):** GlobalSoilMap standard intervals
  ``"0-5cm"``, ``"5-15cm"``, ``"15-30cm"``, ``"30-60cm"``, ``"60-100cm"``,
  ``"100-200cm"`` (default ``"0-5cm"`` -- the surface layer that drives
  infiltration and ag rooting); ``ocs`` exists only at ``"0-30cm"`` and no
  other property does.

  **When to use:**
  - Soil texture / organic carbon / pH / bulk density -- agriculture,
    hydrology, infiltration substrate.
  - A consistent 250 m soil layer where STATSGO/SSURGO does not reach.
  - Pair with ``fetch_gcn250_curve_numbers`` (infiltration CN) and
    ``fetch_dem`` (terrain) for a global hydrologic forcing stack.

  **When NOT to use:**
  - US work needing the NRCS map-unit soil survey (SSURGO ~30 m or STATSGO) --
    use ``fetch_statsgo_soils``; SoilGrids is a 250 m machine-learned
    prediction, not a surveyed map unit.
  - SCS curve numbers for runoff -- use ``fetch_gcn250_curve_numbers``.

  **Parameters:**
  - ``bbox`` (tuple): ``(min_lon, min_lat, max_lon, max_lat)`` EPSG:4326.
    Required (``supports_global_query=False`` -- each global mosaic is ~5 GB).
    AOI-scoped (<= 0.5 deg^2).
  - ``soil_property`` (str, default ``"clay"``): one of bdod/cec/cfvo/clay/
    nitrogen/ocd/ocs/phh2o/sand/silt/soc (synonyms like ``"ph"``,
    ``"organic_carbon"``, ``"bulk_density"`` are accepted).
  - ``depth`` (str, default ``"0-5cm"``): one of the six standard depths, or
    ``"0-30cm"`` for ``ocs``.
  - ``statistic`` (str, default ``"mean"``): mean, Q0.05, Q0.5, Q0.95 or
    uncertainty.

  **Returns:** A ``LayerURI`` (``layer_type="raster"``, ``role="input"``)
  pointing at a single-band float32 COG in the ``static-30d`` / ``soilgrids``
  cache prefix. ``units`` is the physical unit (percent / g/kg / kg/dm3 / pH /
  cmol(c)/kg / cm3/100cm3 / kg/m3 / kg/m2; ``ratio`` for an uncertainty),
  NoData ``-9999``, ~250 m, EPSG:4326.

  **Data source:** ISRIC SoilGrids 2.0 (CC-BY 4.0, no API key) --
  ``https://files.isric.org/soilgrids/latest/data``.

  Honesty: an all-NoData window (ocean / off the soil surface) raises a typed
  ``SoilGridsEmptyError``; an unknown property/depth raises
  ``SoilGridsInputError`` -- never a fabricated layer.
