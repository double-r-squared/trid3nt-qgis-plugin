summary: Where a DISSOLVED RELEASE goes in an unconfined aquifer - a conservative solute plume over time, checked against measured wells.
routing: 'THE tool for "where does this release go", "how far does the plume reach". MODFLOW 6 flow
  and solute transport over a triangle mesh of `domain`: natural `recharge` and `streams` as the
  water table, lakes, the release infiltrating over the `source` polygon at `source_rate` carrying
  `source_concentration`. `porosity`, both dispersivities, `background_concentration`, `snapshot`
  and `solute` are stated, never defaulted; the period is the TDIS_PERIODDATA keyword. Wells reporting
  `solute` at the `snapshot` are charted against the model. Metres, days, `concentration_units`.'
not_for: surface-water flooding or a river plume (TELEMAC); a water table with no solute (modflow_water_table)
returns: 'On success the run''s record (a `LayerURI`): one temporal mesh layer per saved output, head and
  concentration among them, the water budget, and the modelled concentration charted against the measured
  wells. On failure a dict with `status="error"` + `error_code`.'
