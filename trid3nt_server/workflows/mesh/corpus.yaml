# Mesh-router routing phrasings: walked into the main retrieval index directly
# (workflows/**/corpus.yaml). Question class = "build the mesh a solver runs on",
# never place-based.
build_mesh:
- build the computational mesh for this area with a specific mesher
- author the model domain and let me inspect it before running anything
- make a uniform grid over this extent at a given cell size
- build a structured grid for the domain and keep it in the case
- generate the mesh a solver runs on, then let me edit it
- I want to build the mesh first and choose the mesh library myself
- create the model grid at a cell size I pick, refine it, then accept it
- build a mesh, show me its node and element counts, and let me restart it
- rebuild the mesh from its recipe so the same spec gives the same mesh
- set up the domain lattice for a structured solver over this bounding box
- build a computational mesh for this watershed, generate the model domain grid
- mesh this coastline / bay, make an unstructured triangulation of the water
- create a triangular mesh of the catchment I can reuse for TELEMAC or SCHISM
- generate a grid for the basin refined along the river network
- make an unstructured mesh of this drainage basin with a min and max edge length
- build a coastal water-edge mesh following the real shoreline, not a bbox
- produce a bathymetric mesh of the estuary for a hydrodynamic solver
- build a channel-refined HEC-RAS rain-on-grid mesh I can inspect then solve on
- author a graded HEC-RAS 2D cell mesh, fine along the river and coarse on the hillslopes
- generate a HEC-RAS mesh refined to the channel network for a design-storm run
- mesh the river reach I am modeling, following the real banks not a ribbon
- build the corridor mesh for this reach before authoring the deck
- use OceanMesh2D to mesh this coast, sized by distance to shore and by depth
- adopt a mesh somebody else built and let me edit it here
- bring my own geometry file in as the domain instead of generating one
- punch a breakwater out of the mesh and keep the cut on its outline
- cut an island or a structure out of the water and mesh around it
- refine the mesh inside the region I drew, leave the rest alone
- mark the seaward edge as the open boundary so a tide can be forced there
- classify which side of the domain is open water and which is a wall
