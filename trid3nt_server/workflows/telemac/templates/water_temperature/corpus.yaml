telemac_water_temperature:
- how warm does the water in this river get over the week
- water temperature under the heat wave, the daily high and when it peaks
- is this stretch too warm for salmon or trout this week
- model the water temperature in this lake under the observed weather
- the thermal regime of this pond over the last seven days
- how much does the water warm up crossing this body of water
