summary: WATER TEMPERATURE over a body of water under a week of real weather.
routing: 'THE tool for "how warm does this water get this week", "water temperature under
  the heat wave", "too warm for salmon / trout", "diurnal temperature swing in the water".
  WAQTEL THERMIC on TELEMAC-2D over the domain it is given - a drawn pond, a picked lake,
  or the reach the seed stands on: the surface heat budget under the hourly RAWS record over
  the run''s window. Produces the TEMPERATURE field, animated, and the series at a point.
  Deck opinions, by keyword: DURATION (seven days), GRAPHIC PRINTOUT PERIOD, LAW OF BOTTOM
  FRICTION, FRICTION COEFFICIENT. Supply the domain or `seed` a point, and `event_time` -
  the moment the week opens at.'
not_for: dissolved oxygen below a discharge (`telemac_do_sag`); a dye or contaminant plume
  (`telemac_dye_release`); stratification over depth (`telemac3d_stratified_flow`); air temperature
  or a forecast, which the weather fetchers answer
returns: 'On success the run''s record (a `LayerURI`): every variable its modules wrote, styled
  on one mesh layer, animated where it varies, plus the temperature series charted at the
  station. On failure a dict with `status="error"` + `error_code`.'
