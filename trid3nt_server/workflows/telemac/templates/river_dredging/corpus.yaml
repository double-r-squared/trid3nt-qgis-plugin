- where does the bed change when a dredger cuts the channel and dumps the spoil nearby
- channel deepening volume and the bed response in the disposal ground
- estimate dredging quantities for a river navigation reach kept at a minimum clearance
- what happens to the riverbed if we dredge here and dump there
- dredged and dumped sediment volumes over a navigation reach under a steady flow
