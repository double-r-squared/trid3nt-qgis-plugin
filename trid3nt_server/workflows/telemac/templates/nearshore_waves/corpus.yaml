tomawac_nearshore_waves:
- how big are the waves at the beach when this swell arrives
- what does the offshore swell become by the time it reaches the shore
- where does the surf break along this stretch of coast
- wave height and peak period along the nearshore during the storm
- model the swell shoaling and refracting over the bed to the shoreline
- how the swell changes as it crosses the shelf into the beach
- which way are the waves running as they come into this shoreline
- how far offshore does the breaking start at this beach
- nearshore wave transformation across the surf zone
- simulate the swell running into this shoreline and breaking
