# Template routing phrasings: walked into the main retrieval index directly, so
# an engine template is an ordinary retrieval-pool tool.
telemac_micropollutant_release:
- where does a pollutant released into the water end up, dissolved or on the bed
- how much of a spilled contaminant sticks to suspended sediment and settles out
- a metal or PCB discharge partitioning onto the suspended sediment it is released into
- track a sorbing pollutant through a reach, a harbour or a basin and onto the bed
- "contaminated sediment: how much of the released substance is left on the bed"
- run TELEMAC-2D with WAQTEL micropol for sediment-bound contaminant transport
- pesticide or radionuclide released into surface water, sorbed onto suspended solids
- dissolved versus particulate fraction of a contaminant moving with the current
- how far does the dissolved fraction of a sorbing pollutant travel downstream
