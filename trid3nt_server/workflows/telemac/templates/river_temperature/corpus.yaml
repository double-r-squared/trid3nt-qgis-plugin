# Template routing phrasings: walked into the main retrieval index directly, so
# an engine template is an ordinary retrieval-pool tool.
telemac_river_temperature:
- how warm does the water in this river get over the week
- river water temperature under the heat wave, the daily high and when it peaks
- is this reach too warm for salmon or trout this week
- model the stream temperature down the river under the observed weather
- the thermal regime of this stretch of river over the last seven days
- how much does the river warm up between the top and the bottom of the reach
- water temperature time series at a point on the river driven by real weather
- "surface heat budget on a river reach: solar radiation, evaporation, longwave"
- what is the diurnal swing in water temperature in this river
- does the stream exceed its temperature criterion during this hot spell
