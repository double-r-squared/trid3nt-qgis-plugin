telemac_river_eutrophication:
- what does this river reach do to its nitrate and phosphate load
- how much algal biomass grows down this stretch of river
- eutrophication of the reach, nutrient enrichment driving phytoplankton growth
- does the algal growth in this river pull the dissolved oxygen down
- model phytoplankton growth on nitrate and phosphate in a river reach
- nutrient drawdown and chlorophyll response along this stream
- "nutrient enrichment on the river: nitrate, phosphate, light and water temperature"
- how low does oxygen go down this enriched reach
- nitrogen and phosphorus limitation of algal growth down the river
- "excess nutrients in the stream: biomass, ammonium, organic load and the oxygen budget"
