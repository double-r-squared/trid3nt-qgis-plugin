# Template routing phrasings: walked into the main retrieval index directly, so
# an engine template is an ordinary retrieval-pool tool.
telemac_bed_scour:
- where does the bed scour below a dam, weir or bridge contraction and where does it re-deposit
- erodible-bed morphodynamics under a flood hydrograph, bed scour and deposition pattern
- how much does the channel bed erode and lower during a high flow, and where does the eroded sand redeposit
- bedload transport and bed evolution over a body of water, Meyer-Peter-Mueller scour and deposition map
- mobile-bed scour depth below a hydraulic structure under a flood, sediment erosion and aggradation
- river bed scour and deposition along a reach under a flood, where the channel lowers and where the sand builds back up
- how does a mixture of several grain sizes sort and segregate downstream versus a single grain size
- multi-class graded sediment bedload, fine and coarse grains sorting as the bed evolves
- bed surface armoring where fines winnow out of the scour zone under a flood, grain-size sorting
- downstream fining of a poorly-sorted sand-gravel mixture, differential grain mobility
- graded sediment budget, how a well-graded or bimodal grain mixture segregates along a channel
- scour and siltation in an estuary, harbour approach or navigation channel over a surveyed bed
