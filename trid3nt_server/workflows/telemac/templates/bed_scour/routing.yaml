summary: 'Bed SCOUR and DEPOSITION: a mobile bed under moving water.'
routing: 'THE tool for "where does the bed scour and where does it re-deposit" - erodible-bed
  morphodynamics below a dam, weir or bridge, bedload under a flood, and how a GRADED mixture
  sorts and armors. TELEMAC-2D + GAIA over a reach walked from the release point, an estuary
  you draw, or a polygon you supply, its bed painted from a published channel survey where
  one covers it. Deck opinions, by keyword: DURATION 3600 s, MORPHOLOGICAL FACTOR 10, CLASSES
  SEDIMENT DIAMETERS 2e-4 m, LAYERS INITIAL THICKNESS 5 m, BED-LOAD TRANSPORT FORMULA FOR
  ALL SANDS 1. Give `release`, or supply `domain`.'
not_for: a SUSPENDED plume settling onto an inert bed (`telemac_sediment_plume`); a conservative
  dye or contaminant plume (`telemac_dye_release`); an OIL slick (`telemac_oil_spill`); a
  maintenance DREDGE (`telemac_channel_dredging`); dissolved-oxygen sag (`telemac_do_sag`);
  rainfall-runoff flood depth (`telemac_rain_on_grid`)
returns: 'On success the run''s record (a `LayerURI`): every variable its modules wrote, styled
  on one mesh layer, animated where it varies, the bed evolution in metres among them (deposition
  positive, scour negative), plus the marker series charted. On failure a dict with `status="error"`
  + `error_code`.'
