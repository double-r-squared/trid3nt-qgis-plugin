summary: A DYE / TRACER / CONTAMINANT plume released into a body of surface water and carried
  by its flow.
routing: 'THE tool for "a spill in the water - how far does it travel, how concentrated":
  a dye / contaminant / pollutant / chemical plume carried by the current, sewage or E.coli
  effluent DECAYING as it goes (name it in `decaying_substance`). TELEMAC-2D over a reach
  walked from the release, a lake drawn on the canvas, or a supplied polygon: a finite pulse
  is carried by the flow and dilutes. Give `release` as a pick or a pair, or supply `domain`.
  Source: ABSCISSAE/ORDINATES/DISCHARGE/TRACER keywords. Deck: DURATION 3600 s, no WIND, no
  RAIN.'
not_for: an OIL slick (`telemac_oil_spill`); bed SCOUR, deposition, grain sorting (`telemac_bed_scour`);
  a SUSPENDED sediment plume settling onto the bed (`telemac_sediment_plume`); dissolved-oxygen
  sag (`telemac_do_sag`); rainfall-runoff flood depth (`telemac_rain_on_grid`). Groundwater
  plumes, dam-break and tsunami run-up are not modeled here
returns: 'On success the run''s record (a `LayerURI`): every variable its modules wrote, styled
  on one mesh layer, animated where it varies, plus the dye series charted. On failure a dict
  with `status="error"` + `error_code`.'
