# Template routing phrasings: walked into the main retrieval index directly, so
# an engine template is an ordinary retrieval-pool tool.
telemac_river_micropollutant:
- where does a pollutant released into the river end up, dissolved or on the bed
- how much of a spilled contaminant sticks to river sediment and settles out
- a metal or PCB discharge into the river partitioning onto suspended sediment
- track a sorbing pollutant down a river reach and onto the bed sediment
- "contaminated sediment: how much of the released substance is left on the river bed"
- run TELEMAC-2D with WAQTEL micropol for sediment-bound contaminant transport
- pesticide or radionuclide released into a river, sorbed onto suspended solids
- dissolved versus particulate fraction of a contaminant moving down the channel
- how far downstream does the dissolved fraction of a sorbing pollutant travel
