# Template routing phrasings: walked into the main retrieval index directly, so
# an engine template is an ordinary retrieval-pool tool.
telemac_river_oil_spill:
- an oil spill from a barge on the river, where does the oil slick go downstream
- a diesel or crude oil release into a river reach, tracking the floating slick
- where do the floating oil particles drift after a pipeline rupture into the river
- oil spill trajectory down a river channel, slick particles plus the dissolved fraction
- a bunker fuel or heavy fuel oil release on the river, slick drift and dissolved plume
- TELEMAC oil spill module over a real river reach, drogue particle tracking
