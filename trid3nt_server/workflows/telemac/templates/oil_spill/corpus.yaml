# Template routing phrasings: walked into the main retrieval index directly, so
# an engine template is an ordinary retrieval-pool tool.
telemac_oil_spill:
- an oil spill from a barge, where does the oil slick drift
- a diesel or crude oil release into a river reach, tracking the floating slick
- where do the floating oil particles go after a pipeline rupture into the water
- oil spill trajectory in a harbour or estuary, slick particles plus the dissolved fraction
- a bunker fuel or heavy fuel oil release on the water, slick drift and dissolved plume
- TELEMAC oil spill module over a real body of water, drogue particle tracking
