# Template routing phrasings: walked into the main retrieval index directly, so
# an engine template is an ordinary retrieval-pool tool.
telemac_sediment_plume:
- a sediment / silt slurry spilled into the water, settling and depositing on the bed
- prescribed upstream sediment supply rate depositing downstream, reservoir-inflow sedimentation
- how a continuous incoming sediment load settles and deposits along the bed downstream
- a suspended sediment plume released into the river reach, how far does it travel before it settles out
- turbidity plume from a construction or dredging discharge settling onto the bed of the harbour
- where does injected fine sand or silt deposit downstream of the release point
- siltation in a lake or basin from a sediment-laden discharge, where does the deposit land
