# Template routing phrasings: walked into the main retrieval index directly, so
# an engine template is an ordinary retrieval-pool tool.
telemac_channel_dredging:
- how much material do we have to dredge out of the navigation channel to keep it at its design depth
- maintenance dredging volume for a fairway that has shoaled below its authorized depth
- dredge the shipping channel to a design draught and put the spoil in the disposal area, how many cubic metres
- how often does this berth pocket have to be re-dredged and how much comes out each pass
- simulate a maintenance dredge campaign over a channel with a mobile bed
- where does the bed change when a dredger cuts the channel and dumps the spoil nearby
- channel deepening volume and the bed response in the disposal ground
- estimate dredging quantities for a navigation channel kept at a minimum clearance
- what happens to the bed if we dredge here and dump there
- dredged and dumped sediment volumes over a navigation channel under a steady flow
- dredge the approach channel into this harbour and tell me the spoil volume
- run a dredge campaign on the surveyed channel and show me the bed evolution
